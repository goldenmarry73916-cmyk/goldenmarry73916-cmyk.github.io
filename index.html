<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wallora - HD Wallpapers</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #0b0b0f;
  color: white;
}

header {
  padding: 30px 18px;
  text-align: center;
  background: linear-gradient(135deg, #15151d, #24243a);
}

.logo {
  font-size: 34px;
  font-weight: bold;
}

.tagline {
  margin-top: 8px;
  color: #aaa;
  font-size: 15px;
}

.search {
  margin: 22px auto 0;
  max-width: 600px;
}

.search input {
  width: 100%;
  padding: 15px 20px;
  border-radius: 30px;
  border: 1px solid #333;
  background: #17171d;
  color: white;
  font-size: 16px;
  outline: none;
}

.container {
  padding: 28px 15px;
  max-width: 1100px;
  margin: auto;
}

h2 {
  margin-bottom: 20px;
}

.wallpapers {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 15px;
}

.card {
  background: #17171d;
  border-radius: 15px;
  overflow: hidden;
  box-shadow: 0 5px 20px rgba(0,0,0,0.4);
}

.card img {
  width: 100%;
  height: 230px;
  object-fit: cover;
  display: block;
}

.card-content {
  padding: 13px;
}

.card h3 {
  margin-bottom: 11px;
  font-size: 16px;
}

.download {
  display: inline-block;
  padding: 9px 14px;
  background: white;
  color: black;
  text-decoration: none;
  border-radius: 20px;
  font-size: 14px;
  font-weight: bold;
}

footer {
  text-align: center;
  padding: 35px 15px;
  color: #777;
}

@media (min-width: 700px) {
  .wallpapers {
    grid-template-columns: repeat(3, 1fr);
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">Wallora</div>
  <div class="tagline">Premium HD Wallpapers</div>

  <div class="search">
    <input type="text" placeholder="🔍 Search wallpapers...">
  </div>
</header>

<div class="container">

  <h2>🔥 Latest Wallpapers</h2>

  <div class="wallpapers">

    <div class="card">
      <img src="wallpaper.jpg" alt="Premium Wallpaper">
      <div class="card-content">
        <h3>Premium Wallpaper</h3>
        <a class="download" href="wallpaper.jpg" download>Download</a>
      </div>
    </div>

    <div class="card">
      <img src="wallpaper.jpg" alt="HD Wallpaper">
      <div class="card-content">
        <h3>HD Wallpaper</h3>
        <a class="download" href="wallpaper.jpg" download>Download</a>
      </div>
    </div>

    <div class="card">
      <img src="wallpaper.jpg" alt="Beautiful Wallpaper">
      <div class="card-content">
        <h3>Beautiful Wallpaper</h3>
        <a class="download" href="wallpaper.jpg" download>Download</a>
      </div>
    </div>

  </div>

</div>

<footer>
  © 2026 Wallora • HD Wallpapers
</footer>

</body>
</html>
