<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wallora • Keyboard Wallpapers</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

:root{
  --bg:#070812;
  --card:#101321;
  --card2:#171b30;
  --text:#ffffff;
  --muted:#9299b5;
  --border:#292f4b;
  --purple:#7c5cff;
  --blue:#00c8ff;
  --gold:#ffc857;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:
    radial-gradient(circle at 10% 5%,#38218a55,transparent 30%),
    radial-gradient(circle at 90% 15%,#006f9250,transparent 28%),
    var(--bg);
  color:var(--text);
  min-height:100vh;
}

/* HEADER */

header{
  position:sticky;
  top:0;
  z-index:1000;
  height:70px;
  padding:0 5%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:rgba(8,10,20,.88);
  backdrop-filter:blur(18px);
  border-bottom:1px solid var(--border);
}

.logo{
  font-size:27px;
  font-weight:900;
}

.logo span{
  background:linear-gradient(
    90deg,
    var(--purple),
    var(--blue),
    var(--gold)
  );
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.header-actions{
  display:flex;
  align-items:center;
  gap:8px;
}

.back{
  padding:10px 15px;
  border:1px solid var(--border);
  border-radius:12px;
  background:var(--card);
  color:var(--text);
  text-decoration:none;
  font-size:13px;
  cursor:pointer;
}

/* HERO */

.hero{
  text-align:center;
  padding:60px 20px 35px;
}

.hero h1{
  font-size:48px;
  font-weight:900;
}

.hero h1 span{
  background:linear-gradient(
    90deg,
    var(--purple),
    var(--blue)
  );
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.hero p{
  margin-top:10px;
  color:var(--muted);
  font-size:14px;
}

/* SEARCH */

.search{
  max-width:650px;
  margin:25px auto 0;
}

.search input{
  width:100%;
  padding:16px 22px;
  border-radius:30px;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  outline:none;
  font-size:15px;
}

.search input:focus{
  border-color:var(--purple);
  box-shadow:0 0 0 3px #7c5cff18;
}

/* GALLERY */

.gallery{
  padding:20px 6% 60px;
}

.gallery-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:20px;
}

.gallery-head h2{
  font-size:24px;
}

.gallery-head span{
  color:var(--muted);
  font-size:13px;
}

/* KEYBOARD GRID */

.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:18px;
  width:100%;
}

/* CARD */

.card{
  background:
    linear-gradient(
      145deg,
      var(--card),
      var(--card2)
    );
  border:1px solid var(--border);
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 10px 30px #0006;
  transition:.3s ease;
}

.card:hover{
  transform:translateY(-6px);
  border-color:var(--purple);
  box-shadow:0 20px 45px #0009;
}

/* KEYBOARD WALLPAPER SIZE */

.card img{
  width:100%;
  aspect-ratio:16 / 9;
  height:auto;
  object-fit:cover;
  display:block;
  cursor:pointer;
  transition:.35s;
}

.card:hover img{
  transform:scale(1.03);
}

/* INFO */

.info{
  padding:13px;
}

.info h3{
  font-size:14px;
  margin-bottom:6px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.brand{
  font-size:10px;
  color:var(--gold);
  font-weight:bold;
  letter-spacing:1.5px;
}

.owner{
  font-size:11px;
  color:var(--muted);
  margin:4px 0 0;
}

/* EMPTY */

.empty{
  grid-column:1/-1;
  text-align:center;
  padding:60px 20px;
  color:var(--muted);
}

/* FULL SCREEN */

.image-viewer{
  position:fixed;
  inset:0;
  z-index:5000;
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:#000f;
}

.image-viewer.show{
  display:flex;
}

.image-viewer img{
  width:min(94vw,1200px);
  max-height:88vh;
  aspect-ratio:16 / 9;
  object-fit:contain;
  border-radius:10px;
  background:#05060b;
}

.close-viewer{
  position:absolute;
  top:18px;
  right:22px;
  width:45px;
  height:45px;
  border:0;
  border-radius:50%;
  background:#222;
  color:white;
  font-size:28px;
  cursor:pointer;
}

/* UPLOAD BUTTON */

.upload-btn{
  position:fixed;
  right:22px;
  bottom:25px;
  z-index:4000;

  width:58px;
  height:58px;

  border:0;
  border-radius:50%;

  background:linear-gradient(
    135deg,
    var(--purple),
    var(--blue)
  );

  color:white;

  cursor:pointer;

  display:none;

  align-items:center;
  justify-content:center;

  box-shadow:0 12px 35px #0008;

  transition:.25s;
}

.upload-btn:hover{
  transform:scale(1.08);
}

.upload-btn svg{
  width:28px;
  height:28px;
}

/* UPLOAD MODAL */

.upload-overlay{
  position:fixed;
  inset:0;
  z-index:6000;

  display:none;

  align-items:center;
  justify-content:center;

  padding:20px;

  background:#000b;

  backdrop-filter:blur(8px);
}

.upload-overlay.show{
  display:flex;
}

.upload-box{
  width:min(450px,100%);

  background:var(--card);

  border:1px solid var(--border);

  border-radius:22px;

  padding:25px;
}

.upload-box h2{
  margin-bottom:8px;
}

.upload-box p{
  color:var(--muted);
  font-size:13px;
  margin-bottom:20px;
}

.upload-box input{
  width:100%;
  padding:13px;

  border-radius:11px;

  border:1px solid var(--border);

  background:var(--bg);

  color:var(--text);

  margin-bottom:12px;
}

.upload-main{
  width:100%;

  padding:13px;

  border:0;

  border-radius:11px;

  background:linear-gradient(
    90deg,
    var(--purple),
    var(--blue)
  );

  color:white;

  font-weight:bold;

  cursor:pointer;
}

.upload-close{
  width:100%;

  margin-top:8px;

  padding:11px;

  border:1px solid var(--border);

  border-radius:11px;

  background:var(--card2);

  color:var(--text);

  cursor:pointer;
}

.upload-status{
  margin-top:12px;

  color:var(--muted);

  font-size:12px;

  text-align:center;
}

/* FOOTER */

footer{
  padding:40px 20px;

  text-align:center;

  border-top:1px solid var(--border);

  color:var(--muted);
}

.footer-logo{
  font-size:22px;

  font-weight:900;

  margin-bottom:8px;
}

.footer-logo span{
  color:var(--purple);
}

footer strong{
  color:var(--gold);
}

/* MOBILE */

@media(max-width:700px){

  header{
    padding:0 4%;
  }

  .hero{
    padding:45px 18px 30px;
  }

  .hero h1{
    font-size:38px;
  }

  .gallery{
    padding:15px 4% 40px;
  }

  .grid{
    grid-template-columns:1fr;
    gap:14px;
  }

  .card img{
    aspect-ratio:16 / 9;
  }

  .back{
    padding:9px 11px;
  }

  .upload-btn{
    right:18px;
    bottom:20px;
  }

}

</style>

</head>

<body>


<!-- FULL SCREEN VIEWER -->

<div
  class="image-viewer"
  id="imageViewer"
  onclick="closeImage(event)"
>

  <button
    class="close-viewer"
    onclick="closeImage(event)">
    ×
  </button>

  <img
    id="fullImage"
    src=""
    alt="Keyboard Wallpaper">

</div>


<!-- HEADER -->

<header>

  <div class="logo">
    Wall<span>ora</span>
  </div>

  <div class="header-actions">

    <a
      href="index.html"
      class="back">
      ← Home
    </a>

  </div>

</header>


<!-- HERO -->

<section class="hero">

  <h1>
    Keyboard <span>Wallpapers</span>
  </h1>

  <p>
    Beautiful wallpapers for your keyboard setup
  </p>

  <div class="search">

    <input
      id="search"
      type="text"
      placeholder="🔍 Search keyboard wallpapers..."
      oninput="searchWallpaper">

  </div>

</section>


<!-- GALLERY -->

<section class="gallery">

  <div class="gallery-head">

    <h2>
      ⌨️ Keyboard Wallpapers
    </h2>

    <span id="count">
      Loading...
    </span>

  </div>

  <div
    class="grid"
    id="grid">

    <div class="empty">
      Loading wallpapers...
    </div>

  </div>

</section>


<!-- OWNER UPLOAD BUTTON -->

<button
  class="upload-btn"
  id="ownerUploadButton"
  onclick="openUpload()"
  title="Upload Wallpaper"
  aria-label="Upload Wallpaper">

  <svg
    viewBox="0 0 24 24"
    fill="none"
    stroke="white"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round">

    <path d="M12 16V3"></path>
    <path d="M7 8l5-5 5 5"></path>
    <path d="M5 21h14"></path>

  </svg>

</button>


<!-- UPLOAD MODAL -->

<div
  class="upload-overlay"
  id="uploadOverlay">

  <div class="upload-box">

    <h2>
      Upload Keyboard Wallpaper
    </h2>

    <p>
      Only the Wallora owner can upload wallpapers.
    </p>

    <input
      type="file"
      id="wallpaperFile"
      accept="image/*">

    <button
      class="upload-main"
      onclick="uploadWallpaper()">

      Upload Wallpaper

    </button>

    <button
      class="upload-close"
      onclick="closeUpload()">

      Cancel

    </button>

    <div
      class="upload-status"
      id="uploadStatus">
    </div>

  </div>

</div>


<!-- FOOTER -->

<footer>

  <div class="footer-logo">
    Wall<span>ora</span>
  </div>

  <p>
    Premium Keyboard Wallpapers
  </p>

  <p style="margin-top:8px;">
    © 2026 Wallora • Created by
    <strong>Deepak Paweria</strong>
  </p>

</footer>


<script>

/* =========================================================
   AUTH SUPABASE
========================================================= */

const AUTH_SUPABASE_URL =
  "https://lbvpjnfnhxnhzydjydfn.supabase.co";

const AUTH_SUPABASE_KEY =
  "sb_publishable_QFKLim7EOGmn-7kjHAONDA_0k-L_YxU";

const OWNER_ID =
  "5244bbae-9306-4c50-857d-feba9a4d0807";

const authClient =
  window.supabase.createClient(
    AUTH_SUPABASE_URL,
    AUTH_SUPABASE_KEY
  );


/* =========================================================
   DATA SUPABASE
========================================================= */

const DATA_SUPABASE_URL =
  "https://frsdscguevzqqkzbwxxy.supabase.co";

const DATA_SUPABASE_KEY =
  "sb_publishable_fzXOjFFKz_QXtZagfGXpEA_xgf1cZfN";

const dataClient =
  window.supabase.createClient(
    DATA_SUPABASE_URL,
    DATA_SUPABASE_KEY
  );


/* =========================================================
   GITHUB
========================================================= */

const GITHUB_USER =
  "goldenmarry73916-cmyk";

const GITHUB_REPO =
  "goldenmarry73916-cmyk.github.io";

const BRANCH =
  "main";

let wallpapers = [];


/* =========================================================
   GET KEYBOARD FILES
========================================================= */

async function getFiles(){

  const url =
    `https://api.github.com/repos/` +
    `${GITHUB_USER}/` +
    `${GITHUB_REPO}/contents/keyboard?ref=${BRANCH}`;

  try{

    const response =
      await fetch(url);

    if(!response.ok){

      return [];

    }

    const data =
      await response.json();

    return Array.isArray(data)
      ? data
      : [];

  }catch(error){

    console.error(error);

    return [];

  }

}


/* =========================================================
   IMAGE CHECK
========================================================= */

function isImage(file){

  return file &&
    file.type === "file" &&
    /\.(jpg|jpeg|png|webp|gif|avif)$/i
    .test(file.name);

}


/* =========================================================
   LOAD WALLPAPERS
========================================================= */

async function loadWallpapers(){

  const files =
    await getFiles();

  const images =
    files.filter(
      file => isImage(file)
    );

  wallpapers =
    images.map(
      (file,index)=>({

        name:
          "Keyboard " +
          (index + 1),

        url:
          `https://raw.githubusercontent.com/` +
          `${GITHUB_USER}/` +
          `${GITHUB_REPO}/` +
          `${BRANCH}/` +
          `${file.path}`

      })
    );

  render(wallpapers);

}


/* =========================================================
   RENDER
========================================================= */

function render(list){

  const grid =
    document.getElementById("grid");

  const count =
    document.getElementById("count");

  grid.innerHTML = "";

  count.innerText =
    list.length +
    " Wallpapers";

  if(list.length === 0){

    grid.innerHTML = `

      <div class="empty">

        <h3>
          No keyboard wallpapers found
        </h3>

        <p style="margin-top:8px;">
          GitHub ke
          <b>keyboard</b>
          folder me wallpapers upload karo.
        </p>

      </div>

    `;

    return;

  }

  list.forEach(
    (wallpaper,index)=>{

      const card =
        document.createElement("div");

      card.className =
        "card";

      card.innerHTML = `

        <img
          src="${wallpaper.url}"
          loading="lazy"
          alt="${wallpaper.name}">

        <div class="info">

          <h3>
            ${wallpaper.name}
          </h3>

          <div class="brand">
            WALLORA
          </div>

          <div class="owner">
            Deepak Paweria
          </div>

        </div>

      `;

      const image =
        card.querySelector("img");

      image.onclick =
        function(){

          openImage(
            wallpaper.url
          );

        };

      grid.appendChild(card);

    }
  );

}


/* =========================================================
   SEARCH
========================================================= */

function searchWallpaper(){

  const text =
    document
      .getElementById("search")
      .value
      .toLowerCase()
      .trim();

  const filtered =
    wallpapers.filter(
      wallpaper =>
        wallpaper.name
          .toLowerCase()
          .includes(text)
    );

  render(filtered);

}


/* =========================================================
   FULL SCREEN
========================================================= */

function openImage(url){

  const viewer =
    document.getElementById(
      "imageViewer"
    );

  const image =
    document.getElementById(
      "fullImage"
    );

  image.src = url;

  viewer.classList.add("show");

  document.body.style.overflow =
    "hidden";

}


function closeImage(event){

  if(event){
    event.stopPropagation();
  }

  const viewer =
    document.getElementById(
      "imageViewer"
    );

  const image =
    document.getElementById(
      "fullImage"
    );

  viewer.classList.remove("show");

  image.src = "";

  document.body.style.overflow =
    "";

}


document.addEventListener(
  "keydown",
  function(event){

    if(event.key === "Escape"){
      closeImage();
    }

  }
);


/* =========================================================
   OWNER CHECK
========================================================= */

async function checkOwner(){

  const uploadButton =
    document.getElementById(
      "ownerUploadButton"
    );

  if(!uploadButton){
    return;
  }

  uploadButton.style.display =
    "none";

  try{

    const {
      data,
      error
    } =
      await authClient
        .auth
        .getUser();

    console.log(
      "Keyboard owner check:",
      data?.user?.id
    );

    if(
      !error &&
      data?.user &&
      data.user.id === OWNER_ID
    ){

      uploadButton.style.display =
        "flex";

      console.log(
        "Wallora owner detected ✔"
      );

    }

  }catch(error){

    console.error(
      "Owner check error:",
      error
    );

  }

}


/* =========================================================
   AUTH STATE
========================================================= */

authClient
  .auth
  .onAuthStateChange(
    function(event,session){

      console.log(
        "Auth event:",
        event
      );

      setTimeout(
        checkOwner,
        300
      );

    }
  );


/* =========================================================
   OPEN UPLOAD
========================================================= */

async function openUpload(){

  const {
    data,
    error
  } =
    await authClient
      .auth
      .getUser();

  if(
    error ||
    !data?.user
  ){

    alert(
      "Please login as Wallora owner first."
    );

    return;

  }

  if(
    data.user.id !== OWNER_ID
  ){

    alert(
      "Only Wallora owner can upload."
    );

    return;

  }

  document
    .getElementById(
      "uploadOverlay"
    )
    .classList
    .add("show");

}


/* =========================================================
   CLOSE UPLOAD
========================================================= */

function closeUpload(){

  document
    .getElementById(
      "uploadOverlay"
    )
    .classList
    .remove("show");

  document
    .getElementById(
      "uploadStatus"
    )
    .innerText = "";

}


/* =========================================================
   UPLOAD KEYBOARD WALLPAPER
========================================================= */

async function uploadWallpaper(){

  const status =
    document.getElementById(
      "uploadStatus"
    );

  try{

    /* OWNER CHECK */

    const {
      data,
      error
    } =
      await authClient
        .auth
        .getUser();

    if(
      error ||
      !data?.user ||
      data.user.id !== OWNER_ID
    ){

      status.innerText =
        "Only Wallora owner can upload.";

      return;

    }


    /* FILE */

    const file =
      document
        .getElementById(
          "wallpaperFile"
        )
        .files[0];


    if(!file){

      status.innerText =
        "Please select an image.";

      return;

    }


    if(
      !file.type.startsWith(
        "image/"
      )
    ){

      status.innerText =
        "Only image files are allowed.";

      return;

    }


    if(
      file.size >
      15 * 1024 * 1024
    ){

      status.innerText =
        "Maximum file size is 15 MB.";

      return;

    }


    status.innerText =
      "☁️ Uploading keyboard wallpaper...";


    const safeName =
      file.name.replace(
        /[^a-zA-Z0-9._-]/g,
        "_"
      );


    /*
       KEYBOARD FOLDER ONLY
    */

    const filePath =
      "keyboard/" +
      Date.now() +
      "_" +
      safeName;


    const {
      error:uploadError
    } =
      await dataClient
        .storage
        .from("wallpapers")
        .upload(
          filePath,
          file,
          {
            cacheControl:"3600",
            upsert:false
          }
        );


    if(uploadError){

      console.error(
        "Keyboard upload error:",
        uploadError
      );

      status.innerText =
        "Upload failed: " +
        uploadError.message;

      return;

    }


    status.innerText =
      "✅ Keyboard wallpaper uploaded successfully!";


    document
      .getElementById(
        "wallpaperFile"
      )
      .value = "";


    setTimeout(
      function(){

        closeUpload();

        loadWallpapers();

      },
      1200
    );


  }catch(error){

    console.error(
      "Upload error:",
      error
    );

    status.innerText =
      "Upload failed: " +
      error.message;

  }

}


/* =========================================================
   UPLOAD MODAL BACKDROP
========================================================= */

document
  .getElementById(
    "uploadOverlay"
  )
  .addEventListener(
    "click",
    function(event){

      if(
        event.target === this
      ){

        closeUpload();

      }

    }
  );


/* =========================================================
   START
========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  async function(){

    await checkOwner();

    await loadWallpapers();

  }
);

</script>

</body>
</html>
