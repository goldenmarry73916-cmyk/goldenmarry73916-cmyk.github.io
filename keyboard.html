<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wallora • Keyboard Wallpapers</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

:root{
  --bg:#070812;
  --card:#101321;
  --card2:#171b30;
  --text:#ffffff;
  --muted:#9299b5;
  --border:#292f4b;
  --purple:#7c5cff;
  --blue:#00c8ff;
  --gold:#ffc857;
}

body.light{
  --bg:#f5f7fb;
  --card:#ffffff;
  --card2:#eef1f7;
  --text:#111827;
  --muted:#687083;
  --border:#dfe3ec;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:
    radial-gradient(circle at 10% 5%,#38218a55,transparent 30%),
    radial-gradient(circle at 90% 15%,#006f9250,transparent 28%),
    var(--bg);
  color:var(--text);
  min-height:100vh;
  transition:.3s ease;
}

/* HEADER */

header{
  position:sticky;
  top:0;
  z-index:1000;
  height:70px;
  padding:0 5%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:rgba(8,10,20,.88);
  backdrop-filter:blur(18px);
  border-bottom:1px solid var(--border);
}

body.light header{
  background:rgba(255,255,255,.88);
}

.logo{
  font-size:27px;
  font-weight:900;
}

.logo span{
  background:linear-gradient(
    90deg,
    var(--purple),
    var(--blue),
    var(--gold)
  );
  -webkit-background-clip:text;
  color:transparent;
}

.header-actions{
  display:flex;
  align-items:center;
  gap:8px;
}

.back,
.theme-btn{
  padding:10px 15px;
  border:1px solid var(--border);
  border-radius:12px;
  background:var(--card);
  color:var(--text);
  text-decoration:none;
  font-size:13px;
  cursor:pointer;
}

.theme-btn{
  width:43px;
  height:43px;
  padding:0;
  font-size:18px;
}

/* HERO */

.hero{
  text-align:center;
  padding:60px 20px 35px;
}

.hero h1{
  font-size:48px;
  font-weight:900;
}

.hero h1 span{
  background:linear-gradient(
    90deg,
    var(--purple),
    var(--blue)
  );
  -webkit-background-clip:text;
  color:transparent;
}

.hero p{
  margin-top:10px;
  color:var(--muted);
  font-size:14px;
}

/* SEARCH */

.search{
  max-width:650px;
  margin:25px auto 0;
}

.search input{
  width:100%;
  padding:16px 22px;
  border-radius:30px;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  outline:none;
  font-size:15px;
}

.search input:focus{
  border-color:var(--purple);
}

/* GALLERY */

.gallery{
  padding:20px 6% 60px;
}

.gallery-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:20px;
}

.gallery-head h2{
  font-size:24px;
}

.gallery-head span{
  color:var(--muted);
  font-size:13px;
}

/* GRID */

.grid{
  display:grid;
  grid-template-columns:repeat(
    auto-fill,
    minmax(220px,1fr)
  );
  gap:20px;
}

/* CARD */

.card{
  background:
    linear-gradient(
      145deg,
      var(--card),
      var(--card2)
    );
  border:1px solid var(--border);
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 10px 30px #0006;
  transition:.3s ease;
}

.card:hover{
  transform:translateY(-6px);
  border-color:var(--purple);
}

.card img{
  width:100%;
  height:190px;
  object-fit:cover;
  display:block;
  cursor:pointer;
  transition:.35s;
}

.card:hover img{
  transform:scale(1.03);
}

/* INFO */

.info{
  padding:13px;
}

.info h3{
  font-size:14px;
  margin-bottom:6px;
}

.brand{
  font-size:10px;
  color:var(--gold);
  font-weight:bold;
  letter-spacing:1.5px;
}

.owner{
  font-size:11px;
  color:var(--muted);
  margin:4px 0 12px;
}

/* ACTIONS */

.actions{
  display:flex;
  gap:7px;
}

.like,
.comment{
  border:0;
  border-radius:9px;
  padding:9px 11px;
  background:#252a40;
  color:white;
  cursor:pointer;
}

body.light .like,
body.light .comment{
  background:#e7eaf1;
  color:#111827;
}

.like.liked{
  background:#e53935;
  color:white;
}

.download{
  flex:1;
  padding:9px;
  border-radius:9px;
  background:
    linear-gradient(
      90deg,
      var(--purple),
      var(--blue)
    );
  color:white;
  text-align:center;
  text-decoration:none;
  font-size:12px;
  font-weight:bold;
}

/* COMMENTS */

.comments{
  display:none;
  margin-top:10px;
}

.comments.show{
  display:block;
}

.comments input{
  width:100%;
  padding:9px;
  border:1px solid var(--border);
  border-radius:8px;
  background:var(--bg);
  color:var(--text);
  outline:none;
}

.comments button{
  margin-top:6px;
  padding:8px 12px;
  border:0;
  border-radius:7px;
  background:var(--gold);
  cursor:pointer;
}

.comment-list{
  margin-top:8px;
  font-size:12px;
  color:var(--muted);
}

/* EMPTY */

.empty{
  grid-column:1/-1;
  text-align:center;
  padding:60px 20px;
  color:var(--muted);
}

/* FULL SCREEN */

.image-viewer{
  position:fixed;
  inset:0;
  z-index:5000;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:#000f;
}

.image-viewer.show{
  display:flex;
}

.image-viewer img{
  max-width:100%;
  max-height:92vh;
  object-fit:contain;
  border-radius:10px;
}

.close-viewer{
  position:absolute;
  top:18px;
  right:22px;
  width:45px;
  height:45px;
  border:0;
  border-radius:50%;
  background:#222;
  color:white;
  font-size:28px;
  cursor:pointer;
}

/* OWNER UPLOAD BUTTON */

.upload-btn{
  position:fixed;
  right:22px;
  bottom:25px;
  z-index:4000;

  width:58px;
  height:58px;

  border:0;
  border-radius:50%;

  background:
    linear-gradient(
      135deg,
      var(--purple),
      var(--blue)
    );

  color:white;
  font-size:34px;
  font-weight:300;

  cursor:pointer;

  display:none;
  align-items:center;
  justify-content:center;

  box-shadow:
    0 12px 35px #0008;

  transition:.25s;
}

.upload-btn:hover{
  transform:scale(1.08) rotate(90deg);
}

/* UPLOAD MODAL */

.upload-overlay{
  position:fixed;
  inset:0;
  z-index:6000;

  display:none;
  align-items:center;
  justify-content:center;

  padding:20px;

  background:#000b;
  backdrop-filter:blur(8px);
}

.upload-overlay.show{
  display:flex;
}

.upload-box{
  width:min(450px,100%);
  background:var(--card);
  border:1px solid var(--border);
  border-radius:22px;
  padding:25px;
}

.upload-box h2{
  margin-bottom:8px;
}

.upload-box p{
  color:var(--muted);
  font-size:13px;
  margin-bottom:20px;
}

.upload-box input{
  width:100%;
  padding:13px;
  border-radius:11px;
  border:1px solid var(--border);
  background:var(--bg);
  color:var(--text);
  margin-bottom:12px;
}

.upload-main{
  width:100%;
  padding:13px;
  border:0;
  border-radius:11px;
  background:
    linear-gradient(
      90deg,
      var(--purple),
      var(--blue)
    );
  color:white;
  font-weight:bold;
  cursor:pointer;
}

.upload-close{
  width:100%;
  margin-top:8px;
  padding:11px;
  border:1px solid var(--border);
  border-radius:11px;
  background:var(--card2);
  color:var(--text);
  cursor:pointer;
}

.upload-status{
  margin-top:12px;
  color:var(--muted);
  font-size:12px;
  text-align:center;
}

/* FOOTER */

footer{
  padding:40px 20px;
  text-align:center;
  border-top:1px solid var(--border);
  color:var(--muted);
}

.footer-logo{
  font-size:22px;
  font-weight:900;
  margin-bottom:8px;
}

.footer-logo span{
  color:var(--purple);
}

footer strong{
  color:var(--gold);
}

/* MOBILE */

@media(max-width:700px){

  header{
    padding:0 4%;
  }

  .hero h1{
    font-size:38px;
  }

  .gallery{
    padding:15px 4% 40px;
  }

  .grid{
    grid-template-columns:repeat(2,1fr);
    gap:12px;
  }

  .card img{
    height:140px;
  }

  .back{
    padding:9px 11px;
  }

}

@media(max-width:380px){

  .grid{
    grid-template-columns:1fr;
  }

  .card img{
    height:220px;
  }

}

</style>

</head>

<body>


<!-- FULL SCREEN IMAGE -->

<div
  class="image-viewer"
  id="imageViewer"
  onclick="closeImage(event)"
>

  <button
    class="close-viewer"
    onclick="closeImage(event)"
  >
    ×
  </button>

  <img
    id="fullImage"
    src=""
    alt="Keyboard Wallpaper"
  >

</div>


<!-- HEADER -->

<header>

  <div class="logo">
    Wall<span>ora</span>
  </div>

  <div class="header-actions">

    <button
      class="theme-btn"
      id="themeButton"
      onclick="toggleTheme()"
      aria-label="Change Theme">
      🌙
    </button>

    <a
      href="index.html"
      class="back">
      ← Home
    </a>

  </div>

</header>


<!-- HERO -->

<section class="hero">

  <h1>
    Keyboard <span>Wallpapers</span>
  </h1>

  <p>
    Beautiful wallpapers for your keyboard setup
  </p>

  <div class="search">

    <input
      id="search"
      type="text"
      placeholder="🔍 Search keyboard wallpapers..."
      oninput="searchWallpaper()"
    >

  </div>

</section>


<!-- GALLERY -->

<section class="gallery">

  <div class="gallery-head">

    <h2>
      ⌨️ Keyboard Wallpapers
    </h2>

    <span id="count">
      Loading...
    </span>

  </div>

  <div
    class="grid"
    id="grid">

    <div class="empty">
      Loading wallpapers...
    </div>

  </div>

</section>


<!-- OWNER PLUS BUTTON -->

<button
  class="upload-btn"
  id="ownerUploadButton"
  onclick="openUpload()"
  title="Upload Wallpaper"
  aria-label="Upload Wallpaper">
  +
</button>


<!-- UPLOAD MODAL -->

<div
  class="upload-overlay"
  id="uploadOverlay">

  <div class="upload-box">

    <h2>
      Upload Keyboard Wallpaper
    </h2>

    <p>
      Only the Wallora owner can upload wallpapers.
    </p>

    <input
      type="file"
      id="wallpaperFile"
      accept="image/*">

    <button
      class="upload-main"
      onclick="uploadWallpaper()">
      Upload Wallpaper
    </button>

    <button
      class="upload-close"
      onclick="closeUpload()">
      Cancel
    </button>

    <div
      class="upload-status"
      id="uploadStatus">
    </div>

  </div>

</div>


<!-- FOOTER -->

<footer>

  <div class="footer-logo">
    Wall<span>ora</span>
  </div>

  <p>
    Premium Keyboard Wallpapers
  </p>

  <p style="margin-top:8px;">
    © 2026 Wallora • Created by
    <strong>Deepak Paweria</strong>
  </p>

</footer>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://frsdscguevzqqkzbwxxy.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_fzXOjFFKz_QXtZagfGXpEA_xgf1cZfN";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


const OWNER_ID =
  "7c9261f0-a096-482f-acd7-14af34bade15";


/* =========================================================
   GLOBAL WALLORA THEME
   SAME KEY AS INDEX + MOBILE
========================================================= */

const WALLORA_THEME_KEY =
  "wallora-theme";


function getWalloraTheme(){

  const saved =
    localStorage.getItem(
      WALLORA_THEME_KEY
    );

  return saved === "light"
    ? "light"
    : "dark";

}


function applyTheme(theme){

  document.body.classList.toggle(
    "light",
    theme === "light"
  );


  const button =
    document.getElementById(
      "themeButton"
    );


  if(button){

    button.innerText =
      theme === "light"
        ? "☀️"
        : "🌙";

  }

}


function toggleTheme(){

  const current =
    getWalloraTheme();


  const newTheme =
    current === "light"
      ? "dark"
      : "light";


  localStorage.setItem(
    WALLORA_THEME_KEY,
    newTheme
  );


  applyTheme(
    newTheme
  );

}


/* =========================================================
   THEME SYNC
========================================================= */

window.addEventListener(
  "storage",
  function(event){

    if(
      event.key === WALLORA_THEME_KEY &&
      event.newValue
    ){

      applyTheme(
        event.newValue
      );

    }

  }
);


document.addEventListener(
  "visibilitychange",
  function(){

    if(!document.hidden){

      applyTheme(
        getWalloraTheme()
      );

    }

  }
);


window.addEventListener(
  "focus",
  function(){

    applyTheme(
      getWalloraTheme()
    );

  }
);


/* =========================================================
   GITHUB
========================================================= */

const GITHUB_USER =
  "goldenmarry73916-cmyk";

const GITHUB_REPO =
  "goldenmarry73916-cmyk.github.io";

const BRANCH =
  "main";

let wallpapers = [];


/* =========================================================
   GET KEYBOARD FILES
========================================================= */

async function getFiles(){

  const url =
    `https://api.github.com/repos/` +
    `${GITHUB_USER}/` +
    `${GITHUB_REPO}/contents/keyboard?ref=${BRANCH}`;

  try{

    const response =
      await fetch(url);

    if(!response.ok){
      return [];
    }

    const data =
      await response.json();

    return Array.isArray(data)
      ? data
      : [];

  }catch(error){

    console.log(error);

    return [];

  }

}


/* =========================================================
   IMAGE CHECK
========================================================= */

function isImage(file){

  return file &&
    file.type === "file" &&
    /\.(jpg|jpeg|png|webp|gif|avif)$/i
    .test(file.name);

}


/* =========================================================
   LOAD WALLPAPERS
========================================================= */

async function loadWallpapers(){

  const files =
    await getFiles();


  const images =
    files.filter(
      file => isImage(file)
    );


  wallpapers =
    images.map(
      (file,index)=>({

        name:
          "Keyboard " +
          (index + 1),

        url:
          `https://raw.githubusercontent.com/` +
          `${GITHUB_USER}/` +
          `${GITHUB_REPO}/` +
          `${BRANCH}/` +
          `${file.path}`

      })
    );


  render(wallpapers);

}


/* =========================================================
   RENDER
========================================================= */

function render(list){

  const grid =
    document.getElementById(
      "grid"
    );


  const count =
    document.getElementById(
      "count"
    );


  grid.innerHTML = "";


  count.innerText =
    list.length +
    " Wallpapers";


  if(list.length === 0){

    grid.innerHTML = `

      <div class="empty">

        <h3>
          No keyboard wallpapers found
        </h3>

        <p style="margin-top:8px;">
          GitHub ke
          <b>keyboard</b>
          folder me wallpapers upload karo.
        </p>

      </div>

    `;

    return;

  }


  list.forEach(
    wallpaper=>{

      const card =
        document.createElement(
          "div"
        );


      card.className =
        "card";


      card.innerHTML = `

        <img
          src="${wallpaper.url}"
          loading="lazy"
          alt="${wallpaper.name}"
        >

        <div class="info">

          <h3>
            ${wallpaper.name}
          </h3>

          <div class="brand">
            WALLORA
          </div>

          <div class="owner">
            Deepak Paweria
          </div>

          <div class="actions">

            <button
              class="like"
              onclick="likeWallpaper(this)">
              ❤️ <span>0</span>
            </button>

            <button
              class="comment"
              onclick="toggleComments(this)">
              💬
            </button>

            <a
              class="download"
              href="${wallpaper.url}"
              download>
              Download
            </a>

          </div>

          <div class="comments">

            <input
              type="text"
              placeholder="Write a comment..."
            >

            <button
              onclick="addComment(this)">
              Post
            </button>

            <div
              class="comment-list">
            </div>

          </div>

        </div>

      `;


      const image =
        card.querySelector(
          "img"
        );


      image.onclick =
        function(){

          openImage(
            wallpaper.url
          );

        };


      grid.appendChild(
        card
      );

    }
  );

}


/* =========================================================
   SEARCH
========================================================= */

function searchWallpaper(){

  const text =
    document
      .getElementById("search")
      .value
      .toLowerCase()
      .trim();


  const filtered =
    wallpapers.filter(
      wallpaper =>
        wallpaper.name
          .toLowerCase()
          .includes(text)
    );


  render(
    filtered
  );

}


/* =========================================================
   FULL SCREEN
========================================================= */

function openImage(url){

  const viewer =
    document.getElementById(
      "imageViewer"
    );


  const image =
    document.getElementById(
      "fullImage"
    );


  image.src =
    url;


  viewer.classList.add(
    "show"
  );

}


function closeImage(event){

  if(event){
    event.stopPropagation();
  }


  const viewer =
    document.getElementById(
      "imageViewer"
    );


  const image =
    document.getElementById(
      "fullImage"
    );


  viewer.classList.remove(
    "show"
  );


  image.src = "";

}


document.addEventListener(
  "keydown",
  function(event){

    if(event.key === "Escape"){
      closeImage();
    }

  }
);


/* =========================================================
   LIKE
========================================================= */

function likeWallpaper(button){

  const number =
    button.querySelector(
      "span"
    );


  let value =
    parseInt(
      number.innerText
    ) || 0;


  if(
    button.classList.contains(
      "liked"
    )
  ){

    value--;

    button.classList.remove(
      "liked"
    );

  }else{

    value++;

    button.classList.add(
      "liked"
    );

  }


  number.innerText =
    value;

}


/* =========================================================
   COMMENTS
========================================================= */

function toggleComments(button){

  const info =
    button.closest(
      ".info"
    );


  const area =
    info.querySelector(
      ".comments"
    );


  area.classList.toggle(
    "show"
  );

}


function addComment(button){

  const area =
    button.closest(
      ".comments"
    );


  const input =
    area.querySelector(
      "input"
    );


  const list =
    area.querySelector(
      ".comment-list"
    );


  const text =
    input.value.trim();


  if(!text){
    return;
  }


  const div =
    document.createElement(
      "div"
    );


  div.innerText =
    "💬 " + text;


  list.appendChild(
    div
  );


  input.value = "";

}


/* =========================================================
   OWNER LOGIN CHECK
========================================================= */

async function checkOwner(){

  const {
    data
  } =
    await supabaseClient.auth.getUser();


  const uploadButton =
    document.getElementById(
      "ownerUploadButton"
    );


  if(
    data &&
    data.user &&
    data.user.id === OWNER_ID
  ){

    uploadButton.style.display =
      "flex";

  }else{

    uploadButton.style.display =
      "none";

  }

}


/* =========================================================
   OPEN UPLOAD
========================================================= */

async function openUpload(){

  const {
    data
  } =
    await supabaseClient.auth.getUser();


  if(
    !data.user ||
    data.user.id !== OWNER_ID
  ){

    alert(
      "Owner login required."
    );

    return;

  }


  document
    .getElementById(
      "uploadOverlay"
    )
    .classList.add(
      "show"
    );

}


/* =========================================================
   CLOSE UPLOAD
========================================================= */

function closeUpload(){

  document
    .getElementById(
      "uploadOverlay"
    )
    .classList.remove(
      "show"
    );


  document
    .getElementById(
      "uploadStatus"
    )
    .innerText = "";

}


/* =========================================================
   UPLOAD WALLPAPER
========================================================= */

async function uploadWallpaper(){

  const {
    data
  } =
    await supabaseClient.auth.getUser();


  if(
    !data.user ||
    data.user.id !== OWNER_ID
  ){

    alert(
      "Owner login required."
    );

    return;

  }


  const file =
    document
      .getElementById(
        "wallpaperFile"
      )
      .files[0];


  const status =
    document.getElementById(
      "uploadStatus"
    );


  if(!file){

    status.innerText =
      "Please select an image.";

    return;

  }


  if(!file.type.startsWith("image/")){

    status.innerText =
      "Only image files are allowed.";

    return;

  }


  if(file.size > 15 * 1024 * 1024){

    status.innerText =
      "Maximum file size is 15 MB.";

    return;

  }


  status.innerText =
    "Uploading...";


  const safeName =
    file.name
      .replace(
        /[^a-zA-Z0-9._-]/g,
        "_"
      );


  const filePath =
    "keyboard/" +
    Date.now() +
    "_" +
    safeName;


  const {
    error
  } =
    await supabaseClient
      .storage
      .from("wallpapers")
      .upload(
        filePath,
        file,
        {
          cacheControl:"3600",
          upsert:false
        }
      );


  if(error){

    console.error(error);

    status.innerText =
      "Upload failed: " +
      error.message;

    return;

  }


  status.innerText =
    "Wallpaper uploaded successfully!";


  document
    .getElementById(
      "wallpaperFile"
    )
    .value = "";


  setTimeout(
    function(){

      closeUpload();

    },
    1000
  );

}


/* =========================================================
   INITIALIZE
========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  function(){

    /* Global theme */

    applyTheme(
      getWalloraTheme()
    );


    /* Owner button */

    checkOwner();


    /* GitHub wallpapers */

    loadWallpapers();

  }
);


/* =========================================================
   SUPABASE AUTH STATE
========================================================= */

supabaseClient.auth.onAuthStateChange(
  function(){

    checkOwner();

  }
);

</script>
