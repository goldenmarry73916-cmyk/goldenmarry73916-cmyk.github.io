<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0">

<title>Wallora • Live Skin Preview</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    min-height:100vh;
    color:white;
    background:
      radial-gradient(circle at 20% 0%,#35145f 0%,transparent 35%),
      radial-gradient(circle at 90% 20%,#24104d 0%,transparent 35%),
      #08050e;
}

header{
    padding:18px;
    text-align:center;
    border-bottom:1px solid rgba(255,255,255,.08);
    background:rgba(8,5,14,.75);
    backdrop-filter:blur(15px);
}

header h1{
    font-size:25px;
}

header p{
    margin-top:5px;
    color:#bdaed5;
    font-size:13px;
}

.container{
    width:min(1100px,94%);
    margin:auto;
    padding:22px 0 50px;
}

.panel{
    background:rgba(255,255,255,.055);
    border:1px solid rgba(255,255,255,.1);
    border-radius:22px;
    padding:18px;
    margin-bottom:18px;
    box-shadow:0 20px 60px rgba(0,0,0,.25);
}

select,
button{
    width:100%;
    padding:13px 15px;
    margin-top:10px;
    border-radius:13px;
    border:1px solid rgba(255,255,255,.12);
    background:#151020;
    color:white;
    font-size:15px;
    outline:none;
}

button{
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    background:#24163a;
}

.primary{
    background:linear-gradient(135deg,#7c35d8,#b64dff);
}

.controls{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
}

.viewer{
    min-height:540px;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow:hidden;
    border-radius:22px;
    background:
      radial-gradient(circle,#26163d 0%,#0d0914 65%);
}

/* ---------------- PHONE ---------------- */

.phone-stage{
    perspective:1200px;
    width:250px;
    height:490px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.phone{
    width:220px;
    height:445px;
    position:relative;
    transform-style:preserve-3d;
    transition:transform .12s linear;
    cursor:grab;
}

.phone:active{
    cursor:grabbing;
}

.phone-body{
    position:absolute;
    inset:0;
    border-radius:38px;
    background:
      linear-gradient(145deg,#d7d7dc,#73737b 45%,#25252a);
    box-shadow:
      0 35px 60px rgba(0,0,0,.65),
      inset 0 0 8px rgba(255,255,255,.4);
    transform-style:preserve-3d;
}

/* FRONT */

.front{
    position:absolute;
    inset:7px;
    border-radius:32px;
    background:#050505;
    transform:translateZ(7px);
    overflow:hidden;
}

.screen{
    position:absolute;
    inset:4px;
    border-radius:29px;
    background:
      radial-gradient(circle at 30% 20%,#493274,#110d19 45%,#020205);
    overflow:hidden;
}

.screen::before{
    content:"";
    position:absolute;
    width:90px;
    height:25px;
    left:50%;
    top:9px;
    transform:translateX(-50%);
    background:#000;
    border-radius:20px;
}

.screen-glow{
    position:absolute;
    inset:0;
    background:
      linear-gradient(
        120deg,
        transparent 35%,
        rgba(255,255,255,.12),
        transparent 65%
      );
}

/* BACK */

.backside{
    position:absolute;
    inset:7px;
    border-radius:32px;
    background:
      linear-gradient(145deg,#36363c,#111116);
    transform:rotateY(180deg) translateZ(7px);
    overflow:hidden;
}

.back-skin{
    position:absolute;
    inset:0;
    border-radius:32px;
    overflow:hidden;
}

.back-skin img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

/* CAMERA */

.camera-module{
    position:absolute;
    top:18px;
    left:18px;
    width:78px;
    height:105px;
    border-radius:20px;
    background:#17171b;
    box-shadow:0 5px 15px rgba(0,0,0,.6);
    z-index:5;
}

.lens{
    position:absolute;
    width:29px;
    height:29px;
    border-radius:50%;
    background:
      radial-gradient(circle at 35% 30%,#777,#111 35%,#000 65%);
    border:3px solid #29292d;
}

.l1{top:10px;left:10px}
.l2{top:10px;right:10px}
.l3{bottom:10px;left:10px}

.flash{
    position:absolute;
    right:13px;
    bottom:17px;
    width:13px;
    height:13px;
    border-radius:50%;
    background:#d8cfa0;
}

/* SIDE */

.side{
    position:absolute;
    top:17px;
    bottom:17px;
    width:15px;
    border-radius:9px;
    background:linear-gradient(90deg,#202025,#a3a3aa,#222228);
    transform-style:preserve-3d;
}

.side.left{
    left:-8px;
    transform:rotateY(90deg) translateZ(105px);
}

.side.right{
    right:-8px;
    transform:rotateY(90deg) translateZ(-105px);
}

/* GALLERY */

.gallery{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(110px,1fr));
    gap:10px;
    margin-top:12px;
}

.gallery-item{
    aspect-ratio:1/1.2;
    border-radius:14px;
    overflow:hidden;
    border:2px solid transparent;
    cursor:pointer;
}

.gallery-item.active{
    border-color:#b65cff;
}

.gallery-item img{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* CAMERA */

.camera-box{
    display:none;
}

.camera-box.active{
    display:block;
}

.camera-preview{
    position:relative;
    width:100%;
    max-width:600px;
    margin:15px auto;
    border-radius:20px;
    overflow:hidden;
    background:#000;
}

#cameraVideo{
    display:block;
    width:100%;
}

.camera-overlay{
    position:absolute;
    left:50%;
    top:50%;
    width:55%;
    height:65%;
    transform:translate(-50%,-50%);
    border:2px dashed #c36cff;
    border-radius:30px;
    box-shadow:0 0 35px rgba(180,70,255,.35);
    pointer-events:none;
}

.camera-overlay span{
    position:absolute;
    bottom:-35px;
    width:100%;
    text-align:center;
    color:#ddd;
    font-size:12px;
}

/* CAMERA CAPTURE */

#capturedCanvas{
    display:none;
}

/* MODEL INFO */

.model-info{
    text-align:center;
    margin-top:12px;
    color:#c9bed7;
    font-size:13px;
}

@media(max-width:650px){

    .controls{
        grid-template-columns:repeat(2,1fr);
    }

    .viewer{
        min-height:500px;
    }

    .phone-stage{
        transform:scale(.85);
    }
}
</style>
</head>

<body>

<header>
    <h1>Wallora • Live Skin Preview</h1>
    <p>Choose your phone and try a Wallora skin</p>
</header>

<div class="container">

<!-- PHONE SELECT -->

<div class="panel">

    <select id="brandSelect">
        <option value="">Select Brand</option>
    </select>

    <select id="seriesSelect" disabled>
        <option value="">Select Series</option>
    </select>

    <select id="modelSelect" disabled>
        <option value="">Select Model</option>
    </select>

    <div class="model-info" id="modelInfo">
        Select your phone
    </div>

</div>


<!-- VIEWER -->

<div class="panel">

    <div class="viewer">

        <div class="phone-stage" id="phoneStage">

            <div class="phone" id="phone">

                <div class="phone-body">

                    <div class="front">
                        <div class="screen">
                            <div class="screen-glow"></div>
                        </div>
                    </div>

                    <div class="backside">

                        <div class="back-skin">
                            <img id="skinImage"
                                 src=""
                                 alt="">
                        </div>

                        <div class="camera-module">

                            <div class="lens l1"></div>
                            <div class="lens l2"></div>
                            <div class="lens l3"></div>

                            <div class="flash"></div>

                        </div>

                    </div>

                    <div class="side left"></div>
                    <div class="side right"></div>

                </div>

            </div>

        </div>

    </div>

    <div class="controls">

        <button onclick="setView('front')">Front</button>
        <button onclick="setView('back')">Back</button>
        <button onclick="setView('side')">Side</button>
        <button onclick="resetView()">Reset</button>

    </div>

</div>


<!-- WALLORA GALLERY -->

<div class="panel">

    <h3>Choose Skin From Wallora</h3>

    <div id="gallery"
         class="gallery">
    </div>

</div>


<!-- UNKNOWN PHONE -->

<div class="panel">

    <h3>📷 My Phone Isn't Listed?</h3>

    <p style="color:#aaa;margin-top:7px;font-size:13px">
        Camera open karo, apna phone camera ke saamne rakho
        aur Wallora skin ko live preview karo.
    </p>

    <button class="primary"
            onclick="openCamera()">
        📷 Open Live Camera
    </button>

    <div class="camera-box"
         id="cameraBox">

        <div class="camera-preview">

            <video id="cameraVideo"
                   autoplay
                   playsinline></video>

            <div class="camera-overlay">
                <span>
                    Phone ko frame ke andar rakho
                </span>
            </div>

        </div>

        <button onclick="capturePhone()">
            📸 Capture Phone
        </button>

        <button onclick="closeCamera()">
            ✕ Close Camera
        </button>

        <canvas id="capturedCanvas"></canvas>

    </div>

</div>

</div>

/* =========================================================
   ELEMENTS
   ========================================================= */

const brandSelect =
    document.getElementById("brandSelect");

const seriesSelect =
    document.getElementById("seriesSelect");

const modelSelect =
    document.getElementById("modelSelect");

const modelInfo =
    document.getElementById("modelInfo");

const phone =
    document.getElementById("phone");

const gallery =
    document.getElementById("gallery");

const skinImage =
    document.getElementById("skinImage");


/* =========================================================
   LOAD BRANDS
   ========================================================= */

Object.keys(phoneData).forEach(brand=>{

    const option =
        document.createElement("option");

    option.value=brand;
    option.textContent=brand;

    brandSelect.appendChild(option);

});


/* =========================================================
   BRAND
   ========================================================= */

brandSelect.addEventListener("change",()=>{

    seriesSelect.innerHTML =
        '<option value="">Select Series</option>';

    modelSelect.innerHTML =
        '<option value="">Select Model</option>';

    modelSelect.disabled=true;

    const brand =
        brandSelect.value;

    if(!brand){
        seriesSelect.disabled=true;
        return;
    }

    Object.keys(phoneData[brand]).forEach(series=>{

        const option =
            document.createElement("option");

        option.value=series;
        option.textContent=series;

        seriesSelect.appendChild(option);

    });

    seriesSelect.disabled=false;

});


/* =========================================================
   SERIES
   ========================================================= */

seriesSelect.addEventListener("change",()=>{

    modelSelect.innerHTML =
        '<option value="">Select Model</option>';

    const brand =
        brandSelect.value;

    const series =
        seriesSelect.value;

    if(!series){
        modelSelect.disabled=true;
        return;
    }

    phoneData[brand][series].forEach(model=>{

        const option =
            document.createElement("option");

        option.value=model;
        option.textContent=model;

        modelSelect.appendChild(option);

    });

    modelSelect.disabled=false;

});


/* =========================================================
   MODEL
   ========================================================= */

modelSelect.addEventListener("change",()=>{

    const model =
        modelSelect.value;

    if(!model) return;

    modelInfo.textContent =
        "Selected: "+model;

    /*
       YAHAN FUTURE ME HAR MODEL KI EXACT
       BODY/CAMERA SHAPE APPLY KI JA SAKTI HAI.
    */

    applyModelDesign(model);

});


/* =========================================================
   MODEL DESIGN
   ========================================================= */

function applyModelDesign(model){

    const camera =
        document.querySelector(".camera-module");

    /*
       Different camera arrangements.
       Later exact model profiles add kiye ja sakte hain.
    */

    if(
        model.includes("iPhone")
    ){

        camera.style.left="auto";
        camera.style.right="18px";
        camera.style.top="18px";

        camera.style.width="82px";
        camera.style.height="82px";

        camera.style.borderRadius="24px";

    }else{

        camera.style.left="18px";
        camera.style.right="auto";
        camera.style.top="18px";

        camera.style.width="78px";
        camera.style.height="105px";

        camera.style.borderRadius="20px";

    }

}


/* =========================================================
   3D ROTATION
   ========================================================= */

let rotateX=-8;
let rotateY=0;

function updateRotation(){

    phone.style.transform =
        `rotateX(${rotateX}deg)
         rotateY(${rotateY}deg)`;

}

function setView(view){

    if(view==="front"){
        rotateX=0;
        rotateY=0;
    }

    if(view==="back"){
        rotateX=0;
        rotateY=180;
    }

    if(view==="side"){
        rotateX=0;
        rotateY=90;
    }

    updateRotation();
}

function resetView(){

    rotateX=-8;
    rotateY=0;

    phone.style.transform=
        `rotateX(${rotateX}deg)
         rotateY(${rotateY}deg)
         scale(1)`;

}


/* =========================================================
   DRAG ROTATION
   ========================================================= */

let dragging=false;
let startX=0;
let startY=0;
let startRotateY=0;
let startRotateX=0;

phone.addEventListener("pointerdown",e=>{

    dragging=true;

    startX=e.clientX;
    startY=e.clientY;

    startRotateY=rotateY;
    startRotateX=rotateX;

    phone.setPointerCapture(e.pointerId);

});

phone.addEventListener("pointermove",e=>{

    if(!dragging) return;

    const dx=e.clientX-startX;
    const dy=e.clientY-startY;

    rotateY=startRotateY+dx*.55;
    rotateX=startRotateX-dy*.35;

    rotateX=Math.max(-70,
              Math.min(70,rotateX));

    updateRotation();

});

phone.addEventListener("pointerup",()=>{
    dragging=false;
});

phone.addEventListener("pointercancel",()=>{
    dragging=false;
});


/* =========================================================
   WALLORA GALLERY
   ========================================================= */

function loadWalloraGallery(){

    gallery.innerHTML="";

    let items=[];

    try{

        if(
            window.WALLORA_GALLERY &&
            Array.isArray(window.WALLORA_GALLERY)
        ){
            items=window.WALLORA_GALLERY;
        }

    }catch(e){}

    /*
       Existing Wallora localStorage support
    */

    if(!items.length){

        try{

            const saved =
                JSON.parse(
                    localStorage.getItem(
                        "wallora-wallpapers"
                    ) || "[]"
                );

            if(Array.isArray(saved))
                items=saved;

        }catch(e){}

    }

    if(!items.length){

        gallery.innerHTML=
            `<div style="
              grid-column:1/-1;
              text-align:center;
              color:#aaa;
              padding:25px">
              Wallora gallery loading...
            </div>`;

        return;

    }

    items.forEach((item,index)=>{

        const url =
            item.url ||
            item.src ||
            item.image;

        if(!url) return;

        const div =
            document.createElement("div");

        div.className="gallery-item";

        div.innerHTML=
            `<img src="${url}" alt="Wallora Skin">`;

        div.onclick=()=>{

            document
              .querySelectorAll(".gallery-item")
              .forEach(x=>
                x.classList.remove("active")
              );

            div.classList.add("active");

            skinImage.src=url;

            /*
              Selected skin ko camera mode me bhi
              use kiya ja sakta hai.
            */

            activeSkin=url;

        };

        gallery.appendChild(div);

    });

}

let activeSkin="";

loadWalloraGallery();


/* =========================================================
   LIVE CAMERA
   ========================================================= */

const cameraBox =
    document.getElementById("cameraBox");

const cameraVideo =
    document.getElementById("cameraVideo");

const capturedCanvas =
    document.getElementById("capturedCanvas");

let cameraStream=null;


/* OPEN CAMERA */

async function openCamera(){

    try{

        cameraStream =
            await navigator.mediaDevices.getUserMedia({
                video:{
                    facingMode:{
                        ideal:"environment"
                    }
                },
                audio:false
            });

        cameraVideo.srcObject=
            cameraStream;

        cameraBox.classList.add("active");

    }catch(error){

        alert(
          "Camera permission allow karo. " +
          "HTTPS website par camera feature chalega."
        );

    }

}


/* CLOSE CAMERA */

function closeCamera(){

    if(cameraStream){

        cameraStream
            .getTracks()
            .forEach(track=>track.stop());

        cameraStream=null;

    }

    cameraVideo.srcObject=null;

    cameraBox.classList.remove("active");

}


/* =========================================================
   CAPTURE PHONE
   ========================================================= */

function capturePhone(){

    if(
        !cameraVideo.videoWidth ||
        !cameraVideo.videoHeight
    ){

        alert("Camera ready hone do.");
        return;

    }

    capturedCanvas.width=
        cameraVideo.videoWidth;

    capturedCanvas.height=
        cameraVideo.videoHeight;

    const ctx=
        capturedCanvas.getContext("2d");

    ctx.drawImage(
        cameraVideo,
        0,
        0,
        capturedCanvas.width,
        capturedCanvas.height
    );

    /*
       Captured image ko temporarily use kiya ja sakta hai.
    */

    alert(
      "Phone capture ho gaya. " +
      "Ab Wallora gallery se skin select karo."
    );

}


/* =========================================================
   START DEFAULT
   ========================================================= */

updateRotation();

</script>
