<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Wallora • Laptop Wallpapers</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --bg:#070812;
    --card:#101321;
    --card2:#171b30;
    --text:#ffffff;
    --muted:#9299b5;
    --border:#292f4b;
    --purple:#7c5cff;
    --blue:#00c8ff;
    --gold:#ffc857;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:
        radial-gradient(circle at 10% 5%,#38218a55,transparent 30%),
        radial-gradient(circle at 90% 15%,#006f9250,transparent 28%),
        var(--bg);
    color:var(--text);
    min-height:100vh;
    transition:.3s ease;
}

body.light{
    --bg:#f4f6fb;
    --card:#ffffff;
    --card2:#eef1f8;
    --text:#151827;
    --muted:#667085;
    --border:#dfe3ed;

    background:
        radial-gradient(circle at 10% 5%,#7c5cff22,transparent 30%),
        radial-gradient(circle at 90% 15%,#00c8ff20,transparent 28%),
        var(--bg);
}

body.light header{
    background:#ffffffdd;
}

body.light .search input,
body.light .upload-panel input,
body.light .upload-panel select,
body.light .comment-input{
    color:var(--text);
}

/* HEADER */

header{
    position:sticky;
    top:0;
    z-index:1000;

    height:70px;
    padding:0 5%;

    display:flex;
    align-items:center;
    justify-content:space-between;

    background:#080a14dd;
    backdrop-filter:blur(18px);

    border-bottom:1px solid var(--border);
}

.logo{
    font-size:27px;
    font-weight:900;
    letter-spacing:-1px;
}

.logo span{
    background:linear-gradient(
        90deg,
        var(--purple),
        var(--blue),
        var(--gold)
    );

    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}

.header-actions{
    display:flex;
    align-items:center;
    gap:8px;
}

.theme-btn,
.back,
.owner-btn{
    padding:10px 14px;

    border:1px solid var(--border);
    border-radius:12px;

    background:var(--card);
    color:var(--text);

    text-decoration:none;
    font-size:13px;

    cursor:pointer;
    transition:.25s;
}

.theme-btn{
    width:44px;
    height:42px;
    padding:0;
    font-size:17px;
}

.theme-btn:hover,
.back:hover{
    border-color:var(--purple);
    transform:translateY(-2px);
}

.owner-btn{
    background:linear-gradient(
        90deg,
        var(--purple),
        var(--blue)
    );

    border:0;
    color:white;
    font-weight:bold;
}

.owner-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 25px #7c5cff55;
}

/* HERO */

.hero{
    text-align:center;
    padding:60px 20px 35px;
}

.hero h1{
    font-size:48px;
    font-weight:900;
    letter-spacing:-1.5px;
}

.hero h1 span{
    background:linear-gradient(
        90deg,
        var(--purple),
        var(--blue)
    );

    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}

.hero p{
    margin-top:10px;
    color:var(--muted);
    font-size:14px;
}

/* SEARCH */

.search{
    max-width:650px;
    margin:25px auto 0;
}

.search input{
    width:100%;

    padding:16px 22px;

    border-radius:30px;
    border:1px solid var(--border);

    background:var(--card);
    color:var(--text);

    outline:none;
    font-size:15px;
}

.search input:focus{
    border-color:var(--purple);
    box-shadow:0 0 0 3px #7c5cff18;
}

/* GALLERY */

.gallery{
    padding:20px 6% 60px;
}

.gallery-head{
    display:flex;
    align-items:center;
    justify-content:space-between;

    margin-bottom:20px;
}

.gallery-head h2{
    font-size:24px;
}

.gallery-head span{
    color:var(--muted);
    font-size:13px;
}

/* GRID */

.grid{
    display:grid;
    grid-template-columns:
        repeat(auto-fill,minmax(220px,1fr));
    gap:20px;
}

/* CARD */

.card{
    background:
        linear-gradient(
            145deg,
            var(--card),
            var(--card2)
        );

    border:1px solid var(--border);
    border-radius:18px;

    overflow:hidden;

    box-shadow:0 10px 30px #0006;

    transition:.3s ease;
}

.card:hover{
    transform:translateY(-6px);
    border-color:var(--purple);

    box-shadow:
        0 20px 45px #0009;
}

/* IMAGE */

.image-wrap{
    width:100%;
    height:190px;
    overflow:hidden;
    cursor:pointer;
    position:relative;
}

.image-wrap img{
    width:100%;
    height:100%;

    object-fit:cover;
    display:block;

    transition:.35s;
}

.card:hover .image-wrap img{
    transform:scale(1.04);
}

.image-wrap::after{
    content:"⛶  Tap to view";

    position:absolute;
    left:50%;
    bottom:12px;

    transform:translateX(-50%);

    padding:7px 12px;

    border-radius:20px;

    background:#000b;
    color:white;

    font-size:11px;
    font-weight:bold;

    opacity:0;
    transition:.25s;

    pointer-events:none;
}

.card:hover .image-wrap::after{
    opacity:1;
}

/* INFO */

.info{
    padding:13px;
}

.info h3{
    font-size:14px;
    margin-bottom:6px;
}

.brand{
    font-size:10px;
    color:var(--gold);
    font-weight:bold;
    letter-spacing:1.5px;
}

.owner{
    font-size:11px;
    color:var(--muted);
    margin:4px 0 12px;
}

/* CARD ACTIONS */

.actions{
    display:flex;
    gap:7px;
}

.like,
.comment{
    border:0;
    border-radius:9px;

    padding:9px 11px;

    background:#252a40;
    color:white;

    cursor:pointer;
}

body.light .like,
body.light .comment{
    background:#e8ebf3;
    color:#171b30;
}

.like.liked{
    background:#e53935 !important;
    color:white !important;
}

.download{
    flex:1;

    padding:9px;

    border-radius:9px;

    background:linear-gradient(
        90deg,
        var(--purple),
        var(--blue)
    );

    color:white;

    text-align:center;
    text-decoration:none;

    font-size:12px;
    font-weight:bold;
}

/* COMMENTS */

.comments{
    display:none;
    margin-top:10px;
}

.comments.show{
    display:block;
}

.comments input{
    width:100%;

    padding:9px;

    border:1px solid var(--border);
    border-radius:8px;

    background:var(--bg);
    color:var(--text);

    outline:none;
}

.comments button{
    margin-top:6px;

    padding:8px 12px;

    border:0;
    border-radius:7px;

    background:var(--gold);

    cursor:pointer;
}

.comment-list{
    margin-top:8px;

    display:flex;
    flex-direction:column;
    gap:5px;

    font-size:12px;
    color:var(--muted);
}

.comment-item{
    padding:7px 9px;
    border-radius:8px;
    background:rgba(127,127,127,.10);
}

/* EMPTY */

.empty{
    grid-column:1/-1;

    text-align:center;

    padding:60px 20px;

    color:var(--muted);
}

/* =========================================
   FULL SCREEN VIEWER
========================================= */

.viewer{
    position:fixed;
    inset:0;

    z-index:5000;

    display:none;
    flex-direction:column;

    background:rgba(0,0,0,.97);
}

.viewer.show{
    display:flex;
}

/* TOP */

.viewer-top{
    height:64px;
    flex:0 0 64px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 15px;

    color:white;

    background:
        linear-gradient(
            rgba(0,0,0,.85),
            transparent
        );
}

.viewer-title{
    font-size:15px;
    font-weight:800;

    max-width:75%;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.close-viewer{
    width:45px;
    height:45px;

    border:0;
    border-radius:50%;

    background:rgba(255,255,255,.12);
    color:white;

    font-size:25px;

    cursor:pointer;
}

/* IMAGE */

.viewer-image-area{
    flex:1;
    min-height:0;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:8px 12px;
}

.viewer-image-area img{
    max-width:100%;
    max-height:100%;

    width:auto;
    height:auto;

    object-fit:contain;

    display:block;

    border-radius:8px;
}

/* BOTTOM */

.viewer-bottom{
    flex:0 0 auto;

    padding:
        12px
        12px
        calc(12px + env(safe-area-inset-bottom));

    background:
        linear-gradient(
            transparent,
            rgba(0,0,0,.97) 18%
        );
}

.viewer-actions{
    width:100%;
    max-width:700px;

    margin:auto;

    display:grid;

    grid-template-columns:
        1fr 1fr 1.25fr;

    gap:9px;
}

.viewer-actions button{
    min-height:48px;

    border:1px solid rgba(255,255,255,.08);
    border-radius:14px;

    background:rgba(255,255,255,.12);
    color:white;

    font-size:14px;
    font-weight:800;

    cursor:pointer;
}

.viewer-actions button.liked{
    background:#e53935;
}

.viewer-actions .download-btn{
    background:white;
    color:#111;
}

.viewer-actions button:disabled{
    opacity:.65;
    cursor:not-allowed;
}

/* VIEWER COMMENTS */

.viewer-comments{
    display:none;

    width:100%;
    max-width:700px;

    margin:10px auto 0;
}

.viewer-comments.show{
    display:block;
}

.comment-row{
    display:flex;
    gap:7px;
}

.comment-row input{
    flex:1;

    min-width:0;

    padding:12px;

    border:1px solid rgba(255,255,255,.15);
    border-radius:10px;

    outline:none;

    background:rgba(255,255,255,.1);
    color:white;
}

.comment-row button{
    padding:0 15px;

    border:0;
    border-radius:10px;

    background:var(--gold);
    color:#111;

    font-weight:bold;
    cursor:pointer;
}

.viewer-comment-list{
    margin-top:8px;

    max-height:130px;
    overflow:auto;

    display:flex;
    flex-direction:column;
    gap:5px;
}

.viewer-comment-item{
    padding:8px 10px;

    border-radius:9px;

    background:rgba(255,255,255,.08);

    color:#ddd;

    font-size:12px;
}

/* UPLOAD BOX */

.upload-box{
    position:fixed;
    inset:0;

    z-index:6000;

    display:none;

    align-items:center;
    justify-content:center;

    padding:20px;

    background:#000c;
}

.upload-box.show{
    display:flex;
}

.upload-panel{
    width:100%;
    max-width:450px;

    padding:25px;

    border-radius:22px;

    background:var(--card);

    border:1px solid var(--border);

    box-shadow:0 30px 80px #000;

    animation:uploadPop .25s ease;
}

@keyframes uploadPop{

    from{
        opacity:0;
        transform:scale(.94);
    }

    to{
        opacity:1;
        transform:scale(1);
    }

}

.upload-panel h2{
    margin-bottom:18px;
}

.upload-panel input,
.upload-panel select{
    width:100%;

    padding:13px;

    margin-top:10px;

    border-radius:10px;

    border:1px solid var(--border);

    background:var(--bg);

    color:var(--text);

    outline:none;
}

.upload-actions{
    display:flex;
    gap:10px;
    margin-top:15px;
}

.upload-actions button{
    flex:1;

    padding:12px;

    border:0;
    border-radius:10px;

    cursor:pointer;
}

.upload{
    background:
        linear-gradient(
            90deg,
            var(--purple),
            var(--blue)
        );

    color:white;
    font-weight:bold;
}

.cancel{
    background:#292f4b;
    color:white;
}

body.light .cancel{
    background:#e4e7ef;
    color:#171b30;
}

#uploadStatus{
    margin-top:12px;
    color:var(--muted);
    font-size:13px;
}

/* FOOTER */

footer{
    padding:40px 20px;

    text-align:center;

    border-top:1px solid var(--border);

    color:var(--muted);
}

.footer-logo{
    font-size:22px;
    font-weight:900;

    margin-bottom:8px;
}

.footer-logo span{
    color:var(--purple);
}

footer strong{
    color:var(--gold);
}

/* MOBILE */

@media(max-width:700px){

    header{
        padding:0 4%;
    }

    .hero{
        padding:45px 18px 30px;
    }

    .hero h1{
        font-size:38px;
    }

    .gallery{
        padding:15px 4% 40px;
    }

    .grid{
        grid-template-columns:repeat(2,1fr);
        gap:12px;
    }

    .image-wrap{
        height:140px;
    }

    .back{
        display:none;
    }

    .owner-btn{
        padding:9px 11px;
    }

    .viewer-actions{
        gap:7px;
    }

    .viewer-actions button{
        min-height:46px;
        font-size:12px;
        border-radius:12px;
    }

}

@media(max-width:380px){

    .grid{
        grid-template-columns:1fr;
    }

    .image-wrap{
        height:220px;
    }

    .viewer-actions{
        grid-template-columns:1fr 1fr;
    }

    .viewer-actions .download-btn{
        grid-column:1/-1;
    }

}

</style>
</head>

<body>

<!-- =========================================
     FULL SCREEN VIEWER
========================================= -->

<div
    id="viewer"
    class="viewer"
>

    <div class="viewer-top">

        <div
            id="viewerTitle"
            class="viewer-title"
        >
            Laptop Wallpaper
        </div>

        <button
            class="close-viewer"
            onclick="closeViewer()"
        >
            ✕
        </button>

    </div>


    <div class="viewer-image-area">

        <img
            id="viewerImage"
            src=""

    </div>


    <div class="viewer-bottom">

        <div class="viewer-actions">

            <button

                onclick="viewerLike()"

            </button>

            <button
                onclick="toggleViewerComments()"
            >

            <button

            >

            ></div>

</div>


<!-- =========================================

========================================= -->

<div

>

    <div class="upload-panel">

        <h2>➕ Upload Laptop Wallpaper</h2>

        <input
            type="file"
            id="wallpaperFile"
            accept="image/*"
        >


        <select id="wallpaperCategory">

            <option value="laptop">
                Laptop
            </option>

            <option value="gaming">
                Gaming
            </option>

            <option value="cars">
                Cars
            </option>

            <option value="nature">
                Nature
            </option>

            <option value="anime">
                Anime
            </option>

            <option value="dark">
                Dark
            </option>

            <option value="minimal">
                Minimal
            </option>

        </select>


        <div class="upload-actions">

            <button
                class="cancel"
                onclick="closeUpload()"
            >
                Cancel
            </button>

            <button
                class="upload"
                onclick="uploadWallpaper()"
            >
                Upload
            </button>

        </div>


        <div id="uploadStatus"></div>

    </div>

</div>


<!-- =========================================
     HEADER
========================================= -->

<header>

    <div class="logo">
        Wall<span>ora</span>
    </div>


    <div class="header-actions">

        <button
            class="theme-btn"
            id="themeButton"
            onclick="toggleTheme()"
        >
            🌙
        </button>


        <button
            class="owner-btn"
            id="ownerButton"
            onclick="openUpload()"

            ＋ Upload
        </button>


        <a
            href="index.html"

        >
            ← Home
        </a>

    </div>

</header>


<!-- =========================================
     HERO
========================================= -->

<section class="hero">

    <h1>
        Laptop <span>Wallpapers</span>
    </h1>

    <p>
        Premium HD & 4K wallpapers for laptop and desktop
    </p>


    <div class="search">

        <input
            id="search"
            type="text"
            placeholder="🔍 Search laptop wallpapers..."
            oninput="searchWallpaper()"
        >

    </div>

</section>


<!-- =========================================
     GALLERY
========================================= -->

<section class="gallery">

    <div class="gallery-head">

        <h2>
            💻 Laptop Wallpapers
        </h2>

        <span id="count">
            Loading...

    </div>

        </div>

<!-- =========================================
     FOOTER
========================================= -->

<footer>

    <div class="footer-logo">
        Wall<span>ora</span>
    </div>

    <p>
        Premium Laptop Wallpapers
    </p>

    <p style="margin-top:8px;">
        © 2026 Wallora • Created by
        <strong>Deepak Paweria</strong>
    </p>

</footer>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://frsdscguevzqqkzbwxxy.supabase.co";

const SUPABASE_KEY =
"sb_publishable_fzXOjFFKz_QXtZagfGXpEA_xgf1cZfN";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================================
   OWNER
========================================= */

const OWNER_UID =
"7c9261f0-a096-482f-acd7-14af34bade15";


/* =========================================
   CLOUDINARY
========================================= */

const CLOUDINARY_CLOUD =
"igtv8px2";

const CLOUDINARY_PRESET =
"wallora_upload";


/* =========================================
   THEME
========================================= */

const WALLORA_THEME_KEY =
"wallora-theme";


function getWalloraTheme(){

    const saved =
        localStorage.getItem(
            WALLORA_THEME_KEY
        );

    return saved === "light"
        ? "light"
        : "dark";
}


function applyTheme(theme){

    document.body.classList.toggle(
        "light",
        theme === "light"
    );


    const button =
        document.getElementById(
            "themeButton"
        );


    if(button){

        button.innerText =
            theme === "light"
                ? "☀️"
                : "🌙";

    }

}


function toggleTheme(){

    const current =
        getWalloraTheme();

    const newTheme =
        current === "light"
            ? "dark"
            : "light";


    localStorage.setItem(
        WALLORA_THEME_KEY,
        newTheme
    );


    applyTheme(newTheme);

}


/* =========================================
   THEME SYNC
========================================= */

window.addEventListener(
    "storage",
    function(event){

        if(
            event.key ===
            WALLORA_THEME_KEY
        ){

            applyTheme(
                event.newValue === "light"
                    ? "light"
                    : "dark"
            );

        }

    }
);


window.addEventListener(
    "focus",
    function(){

        applyTheme(
            getWalloraTheme()
        );

    }
);


document.addEventListener(
    "visibilitychange",
    function(){

        if(!document.hidden){

            applyTheme(
                getWalloraTheme()
            );

        }

    }
);


/* =========================================
   WALLPAPERS
========================================= */

let wallpapers = [];


/* =========================================
   CURRENT VIEWER
========================================= */

let currentWallpaper = null;

let viewerLiked = false;

let viewerLikeNumber = 0;


/* =========================================
   CHECK OWNER
========================================= */

async function checkOwner(){

    const {
        data
    } =
    await supabaseClient
        .auth
        .getUser();


    const button =
        document.getElementById(
            "ownerButton"
        );


    if(
        data &&
        data.user &&
        data.user.id === OWNER_UID
    ){

        button.style.display =
            "block";

    }else{

        button.style.display =
            "none";

    }

}


/* =========================================
   OPEN UPLOAD
========================================= */

async function openUpload(){

    const {
        data
    } =
    await supabaseClient
        .auth
        .getUser();


    if(
        !data.user ||
        data.user.id !== OWNER_UID
    ){

        alert(
            "Only Wallora owner can upload."
        );

        return;

    }


    document
        .getElementById("uploadBox")
        .classList
        .add("show");

}


/* =========================================
   CLOSE UPLOAD
========================================= */

function closeUpload(){

    document
        .getElementById("uploadBox")
        .classList
        .remove("show");


    document
        .getElementById("uploadStatus")
        .innerText = "";

}


/* =========================================
   CLOUDINARY UPLOAD
========================================= */

async function uploadWallpaper(){

    const file =
        document
            .getElementById(
                "wallpaperFile"
            )
            .files[0];


    const category =
        document
            .getElementById(
                "wallpaperCategory"
            )
            .value;


    const status =
        document
            .getElementById(
                "uploadStatus"
            );


    if(!file){

        status.innerText =
            "Please select a wallpaper.";

        return;

    }


    if(
        !file.type.startsWith("image/")
    ){

        status.innerText =
            "Only image files are allowed.";

        return;

    }


    if(
        file.size >
        15 * 1024 * 1024
    ){

        status.innerText =
            "Maximum file size is 15 MB.";

        return;

    }


    /* OWNER CHECK */

    const {
        data
    } =
    await supabaseClient
        .auth
        .getUser();


    if(
        !data.user ||
        data.user.id !== OWNER_UID
    ){

        status.innerText =
            "Only Wallora owner can upload.";

        return;

    }


    try{

        status.innerText =
            "☁️ Uploading to Cloudinary...";


        const formData =
            new FormData();


        formData.append(
            "file",
            file
        );


        formData.append(
            "upload_preset",
            CLOUDINARY_PRESET
        );


        formData.append(
            "folder",
            "wallora/laptop/" + category
        );


        const response =
            await fetch(
                "https://api.cloudinary.com/v1_1/" +
                CLOUDINARY_CLOUD +
                "/image/upload",
                {
                    method:"POST",
                    body:formData
                }
            );


        const cloudData =
            await response.json();


        if(
            !response.ok ||
            !cloudData.secure_url
        ){

            console.error(
                cloudData
            );

            throw new Error(
                cloudData.error?.message ||
                "Cloudinary upload failed."
            );

        }


        status.innerText =
            "☁️ Saving wallpaper...";


        /* SAVE URL TO SUPABASE */

        const {
            error
        } =
        await supabaseClient
            .from("wallpapers")
            .insert({

                name:
                    file.name,

                category:
                    category,

                url:
                    cloudData.secure_url

            });


        if(error){

            console.error(error);

            throw new Error(
                "Database save failed: " +
                error.message
            );

        }


        status.innerText =
            "✅ Wallpaper uploaded successfully!";


        document
            .getElementById(
                "wallpaperFile"
            )
            .value = "";


        setTimeout(
            function(){

                closeUpload();

                loadWallpapers();

            },
            1000
        );


    }catch(error){

        console.error(
            "Upload error:",
            error
        );


        status.innerText =
            "❌ " + error.message;

    }

}


/* =========================================
   LOAD WALLPAPERS
========================================= */

async function loadWallpapers(){

    const grid =
        document.getElementById(
            "grid"
        );


    grid.innerHTML = `
        <div class="empty">
            Loading wallpapers...
        </div>
    `;


    const {
        data,
        error
    } =
    await supabaseClient
        .from("wallpapers")
        .select("*")
        .order(
            "created_at",
            {
                ascending:false
            }
        );


    if(error){

        console.error(
            "Database error:",
            error
        );


        grid.innerHTML = `
            <div class="empty">
                <h3>
                    Unable to load wallpapers
                </h3>

                <p style="margin-top:8px;">
                    ${error.message}
                </p>
            </div>
        `;

        return;

    }


    wallpapers =
        (data || []).filter(
            wallpaper => {

                const category =
                    String(
                        wallpaper.category || ""
                    ).toLowerCase();

                return [
                    "laptop",
                    "gaming",
                    "cars",
                    "nature",
                    "anime",
                    "dark",
                    "minimal"
                ].includes(category);

            }
        );


    render(wallpapers);

}


/* =========================================
   RENDER
========================================= */

function render(list){

    const grid =
        document.getElementById(
            "grid"
        );


    const count =
        document.getElementById(
            "count"
        );


    grid.innerHTML = "";


    count.innerText =
        list.length +
        " Wallpapers";


    if(list.length === 0){

        grid.innerHTML = `

            <div class="empty">

                <h3>
                    No laptop wallpapers found
                </h3>

                <p style="margin-top:8px;">
                    Owner upload button se
                    wallpapers add karo.
                </p>

            </div>

        `;

        return;

    }


    list.forEach(
        (wallpaper,index) => {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "card";


            card.innerHTML = `

                <div
                    class="image-wrap"
                    data-id="${wallpaper.id}"
                >

                    <img
                        src="${escapeHTML(wallpaper.url)}"
                        loading="lazy"
                        alt="Wallora Laptop Wallpaper"
                    >

                </div>


                <div class="info">

                    <h3>
                        ${escapeHTML(
                            wallpaper.name ||
                            "Laptop Wallpaper " +
                            (index + 1)
                        )}
                    </h3>


                    <div class="brand">
                        WALLORA
                    </div>


                    <div class="owner">
                        Deepak Paweria
                    </div>


                    <div class="actions">

                        <button
                            class="like"
                            onclick="likeWallpaper(this)"
                        >
                            ❤️ <span>0</span>
                        </button>


                        <button
                            class="comment"
                            onclick="toggleComments(this)"
                        >
                            💬
                        </button>


                        <a
                            class="download"
                            href="${escapeHTML(wallpaper.url)}"
                            target="_blank"
                            rel="noopener"
                        >
                            Download
                        </a>

                    </div>


                    <div class="comments">

                        <input
                            type="text"
                            maxlength="200"
                            placeholder="Write a comment..."
                        >


                        <button
                            onclick="addComment(this)"
                        >
                            Post
                        </button>


                        <div class="comment-list"></div>

                    </div>

                </div>

            `;


            card
                .querySelector(
                    ".image-wrap"
                )
                .addEventListener(
                    "click",
                    function(){

                        openViewer(
                            wallpaper.id
                        );

                    }
                );


            grid.appendChild(card);

        }
    );

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHTML(value){

    return String(value || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================
   SEARCH
========================================= */

function searchWallpaper(){

    const text =
        document
            .getElementById(
                "search"
            )
            .value
            .toLowerCase()
            .trim();


    const filtered =
        wallpapers.filter(
            wallpaper => {

                const name =
                    String(
                        wallpaper.name || ""
                    ).toLowerCase();


                const category =
                    String(
                        wallpaper.category || ""
                    ).toLowerCase();


                return (
                    name.includes(text) ||
                    category.includes(text)
                );

            }
        );


    render(filtered);

}


/* =========================================
   OPEN VIEWER
========================================= */

function openViewer(id){

    const wallpaper =
        wallpapers.find(
            item =>
                String(item.id) ===
                String(id)
        );


    if(!wallpaper){
        return;
    }


    currentWallpaper =
        wallpaper;


    viewerLiked =
        false;


    viewerLikeNumber =
        0;


    document
        .getElementById(
            "viewerTitle"
        )
        .innerText =
            wallpaper.name ||
            "Wallora Laptop Wallpaper";


    document
        .getElementById(
            "viewerImage"
        )
        .src =
            wallpaper.url;


    document
        .getElementById(
            "likeCount"
        )
        .innerText =
            "0";


    document
        .getElementById(
            "viewerLike"
        )
        .innerHTML =
            `❤️ <span id="likeCount">0</span>`;


    document
        .getElementById(
            "viewerComments"
        )
        .classList
        .remove("show");


    document
        .getElementById(
            "commentInput"
        )
        .value = "";


    document
        .getElementById(
            "commentList"
        )
        .innerHTML = "";


    document
        .getElementById(
            "viewer"
        )
        .classList
        .add("show");


    document.body.style.overflow =
        "hidden";

}


/* =========================================
   CLOSE VIEWER
========================================= */

function closeViewer(){

    document
        .getElementById(
            "viewer"
        )
        .classList
        .remove("show");


    document.body.style.overflow =
        "";


    document
        .getElementById(
            "viewerImage"
        )
        .src = "";


    currentWallpaper =
        null;

}


/* =========================================
   VIEWER LIKE
========================================= */

function viewerLike(){

    viewerLiked =
        !viewerLiked;


    viewerLikeNumber +=
        viewerLiked
            ? 1
            : -1;


    const button =
        document.getElementById(
            "viewerLike"
        );


    button.classList.toggle(
        "liked",
        viewerLiked
    );


    button.innerHTML =
        `❤️ <span id="likeCount">${viewerLikeNumber}</span>`;

}


/* =========================================
   VIEWER COMMENTS
========================================= */

function toggleViewerComments(){

    const box =
        document.getElementById(
            "viewerComments"
        );


    box.classList.toggle(
        "show"
    );


    if(
        box.classList.contains("show")
    ){

        setTimeout(
            function(){

                document
                    .getElementById(
                        "commentInput"
                    )
                    .focus();

            },
            100
        );

    }

}


/* =========================================
   ADD VIEWER COMMENT
========================================= */

function addViewerComment(){

    const input =
        document.getElementById(
            "commentInput"
        );


    const list =
        document.getElementById(
            "commentList"
        );


    const text =
        input.value.trim();


    if(!text){
        return;
    }


    const comment =
        document.createElement(
            "div"
        );


    comment.className =
        "viewer-comment-item";


    comment.textContent =
        "💬 " + text;


    list.appendChild(
        comment
    );


    input.value = "";

}


/* =========================================
   VIEWER DOWNLOAD
========================================= */

async function viewerDownload(button){

    if(!currentWallpaper){
        return;
    }


    const original =
        button.innerText;


    try{

        button.disabled =
            true;


        button.innerText =
            "⏳ Preparing...";


        let downloadURL =
            currentWallpaper.url;


        /* CLOUDINARY DOWNLOAD */

        if(
            downloadURL.includes(
                "res.cloudinary.com"
            ) &&
            downloadURL.includes(
                "/upload/"
            )
        ){

            downloadURL =
                downloadURL.replace(
                    "/upload/",
                    "/upload/fl_attachment/"
                );

        }


        const response =
            await fetch(
                downloadURL,
                {
                    method:"GET",
                    mode:"cors"
                }
            );


        if(!response.ok){

            throw new Error(
                "Download failed"
            );

        }


        const blob =
            await response.blob();


        const blobURL =
            URL.createObjectURL(
                blob
            );


        const link =
            document.createElement(
                "a"
            );


        link.href =
            blobURL;


        link.download =
            (
                currentWallpaper.name ||
                "Wallora-Laptop-Wallpaper"
            )
            .replace(
                /[^a-zA-Z0-9-_]/g,
                "-"
            ) +
            ".jpg";


        document.body.appendChild(
            link
        );


        link.click();


        link.remove();


        setTimeout(
            function(){

                URL.revokeObjectURL(
                    blobURL
                );

            },
            1500
        );


        button.innerText =
            "✅ Downloaded";


        setTimeout(
            function(){

                button.innerText =
                    original;

                button.disabled =
                    false;

            },
            1500
        );


    }catch(error){

        console.error(
            "Download error:",
            error
        );


        let fallback =
            currentWallpaper.url;


        if(
            fallback.includes(
                "res.cloudinary.com"
            ) &&
            fallback.includes(
                "/upload/"
            )
        ){

            fallback =
                fallback.replace(
                    "/upload/",
                    "/upload/fl_attachment/"
                );

        }


        window.open(
            fallback,
            "_blank"
        );


        button.innerText =
            "⬇ Download";


        button.disabled =
            false;

    }

}


/* =========================================
   CARD LIKE
========================================= */

function likeWallpaper(button){

    const number =
        button.querySelector(
            "span"
        );


    let value =
        parseInt(
            number.innerText
        );


    if(
        button.classList.contains(
            "liked"
        )
    ){

        value--;

        button.classList.remove(
            "liked"
        );

    }else{

        value++;

        button.classList.add(
            "liked"
        );

    }


    number.innerText =
        value;

}


/* =========================================
   CARD COMMENTS
========================================= */

function toggleComments(button){

    const area =
        button
            .closest(".info")
            .querySelector(
                ".comments"
            );


    area
        .classList
        .toggle("show");

}


/* =========================================
   ADD CARD COMMENT
========================================= */

function addComment(button){

    const area =
        button.closest(
            ".comments"
        );


    const input =
        area.querySelector(
            "input"
        );


    const list =
        area.querySelector(
            ".comment-list"
        );


    const text =
        input.value.trim();


    if(!text){
        return;
    }


    const div =
        document.createElement(
            "div"
        );


    div.className =
        "comment-item";


    div.innerText =
        "💬 " + text;


    list.appendChild(
        div
    );


    input.value = "";

}


/* =========================================
   ESC KEY
========================================= */

document.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Escape"
        ){

            closeViewer();

            closeUpload();

        }

    }
);


/* =========================================
   VIEWER BACKDROP CLOSE
========================================= */

document
    .getElementById("viewer")
    .addEventListener(
        "click",
        function(event){

            if(
                event.target ===
                this
            ){

                closeViewer();

            }

        }
    );


/* =========================================
   START
========================================= */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        applyTheme(
            getWalloraTheme()
        );


        checkOwner();


        loadWallpapers();

    }
);


/* =========================================
   AUTH CHANGE
========================================= */

supabaseClient
    .auth
    .onAuthStateChange(
        function(){

            checkOwner();

        }
    );

</script>
