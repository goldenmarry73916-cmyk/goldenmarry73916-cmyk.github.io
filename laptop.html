<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wallora - Laptop Wallpapers</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

:root{
  --bg:#070812;
  --card:#101321;
  --card2:#171b30;
  --text:#ffffff;
  --muted:#9299b5;
  --border:#292f4b;
  --purple:#7c5cff;
  --blue:#00c8ff;
  --gold:#ffc857;
}

body{

  font-family:Arial,Helvetica,sans-serif;

  background:
    radial-gradient(
      circle at 10% 5%,
      #38218a55,
      transparent 30%
    ),
    radial-gradient(
      circle at 90% 15%,
      #006f9250,
      transparent 28%
    ),
    var(--bg);

  color:var(--text);

  min-height:100vh;

}


/* =========================
   HEADER
========================= */

header{

  position:sticky;

  top:0;

  z-index:1000;

  height:70px;

  padding:0 5%;

  display:flex;

  align-items:center;

  justify-content:space-between;

  background:#080a14dd;

  backdrop-filter:blur(18px);

  border-bottom:
  1px solid var(--border);

}

.logo{

  font-size:27px;

  font-weight:900;

}

.logo span{

  background:
    linear-gradient(
      90deg,
      var(--purple),
      var(--blue),
      var(--gold)
    );

  -webkit-background-clip:text;

  color:transparent;

}

.back{

  padding:10px 15px;

  border:
  1px solid var(--border);

  border-radius:12px;

  background:var(--card);

  color:white;

  text-decoration:none;

  font-size:13px;

}


/* =========================
   HERO
========================= */

.hero{

  text-align:center;

  padding:
  60px 20px 35px;

}

.hero h1{

  font-size:48px;

  font-weight:900;

}

.hero h1 span{

  background:
    linear-gradient(
      90deg,
      var(--purple),
      var(--blue)
    );

  -webkit-background-clip:text;

  color:transparent;

}

.hero p{

  margin-top:10px;

  color:var(--muted);

  font-size:14px;

}


/* =========================
   SEARCH
========================= */

.search{

  max-width:650px;

  margin:25px auto 0;

}

.search input{

  width:100%;

  padding:16px 22px;

  border-radius:30px;

  border:
  1px solid var(--border);

  background:var(--card);

  color:white;

  outline:none;

  font-size:15px;

}

.search input:focus{

  border-color:
  var(--purple);

}


/* =========================
   GALLERY
========================= */

.gallery{

  padding:
  20px 6% 60px;

}

.gallery-head{

  display:flex;

  align-items:center;

  justify-content:space-between;

  margin-bottom:20px;

}

.gallery-head h2{

  font-size:24px;

}

.gallery-head span{

  color:var(--muted);

  font-size:13px;

}


/* =========================
   GRID
========================= */

.grid{

  display:grid;

  grid-template-columns:
  repeat(
    auto-fill,
    minmax(220px,1fr)
  );

  gap:20px;

}


/* =========================
   CARD
========================= */

.card{

  background:
    linear-gradient(
      145deg,
      var(--card),
      var(--card2)
    );

  border:
  1px solid var(--border);

  border-radius:18px;

  overflow:hidden;

  box-shadow:
  0 10px 30px #0006;

  transition:.3s;

}

.card:hover{

  transform:
  translateY(-6px);

  border-color:
  var(--purple);

  box-shadow:
  0 20px 45px #0009;

}

.card img{

  width:100%;

  height:190px;

  object-fit:cover;

  display:block;

  cursor:pointer;

  transition:.35s;

}

.card:hover img{

  transform:
  scale(1.03);

}


/* =========================
   INFO
========================= */

.info{

  padding:13px;

}

.info h3{

  font-size:14px;

  margin-bottom:6px;

}

.brand{

  font-size:10px;

  color:var(--gold);

  font-weight:bold;

  letter-spacing:1.5px;

}

.owner{

  font-size:11px;

  color:var(--muted);

  margin:
  4px 0 12px;

}


/* =========================
   ACTIONS
========================= */

.actions{

  display:flex;

  gap:7px;

}

.like,
.comment{

  border:0;

  border-radius:9px;

  padding:9px 11px;

  background:#252a40;

  color:white;

  cursor:pointer;

}

.like.liked{

  background:#e53935;

}

.download{

  flex:1;

  padding:9px;

  border-radius:9px;

  background:
    linear-gradient(
      90deg,
      var(--purple),
      var(--blue)
    );

  color:white;

  text-align:center;

  text-decoration:none;

  font-size:12px;

  font-weight:bold;

}


/* =========================
   COMMENTS
========================= */

.comments{

  display:none;

  margin-top:10px;

}

.comments.show{

  display:block;

}

.comments input{

  width:100%;

  padding:9px;

  border:
  1px solid var(--border);

  border-radius:8px;

  background:var(--bg);

  color:white;

  outline:none;

}

.comments button{

  margin-top:6px;

  padding:8px 12px;

  border:0;

  border-radius:7px;

  background:var(--gold);

  cursor:pointer;

}

.comment-list{

  margin-top:8px;

  font-size:12px;

  color:var(--muted);

}


/* =========================
   EMPTY
========================= */

.empty{

  grid-column:1/-1;

  text-align:center;

  padding:60px 20px;

  color:var(--muted);

}


/* =========================
   FULL SCREEN
========================= */

.image-viewer{

  position:fixed;

  inset:0;

  z-index:5000;

  display:none;

  align-items:center;

  justify-content:center;

  padding:20px;

  background:#000f;

}

.image-viewer.show{

  display:flex;

}

.image-viewer img{

  max-width:100%;

  max-height:92vh;

  object-fit:contain;

  border-radius:10px;

}

.close-viewer{

  position:absolute;

  top:18px;

  right:22px;

  width:45px;

  height:45px;

  border:0;

  border-radius:50%;

  background:#222;

  color:white;

  font-size:28px;

  cursor:pointer;

}


/* =========================
   FOOTER
========================= */

footer{

  padding:40px 20px;

  text-align:center;

  border-top:
  1px solid var(--border);

  color:var(--muted);

}

.footer-logo{

  font-size:22px;

  font-weight:900;

  margin-bottom:8px;

}

.footer-logo span{

  color:var(--purple);

}

footer strong{

  color:var(--gold);

}


/* =========================
   MOBILE
========================= */

@media(max-width:700px){

  .hero h1{

    font-size:38px;

  }

  .gallery{

    padding:
    15px 4% 40px;

  }

  .grid{

    grid-template-columns:
    repeat(2,1fr);

    gap:12px;

  }

  .card img{

    height:140px;

  }

}

@media(max-width:380px){

  .grid{

    grid-template-columns:1fr;

  }

  .card img{

    height:220px;

  }

}

</style>

</head>


<body>


<!-- FULL SCREEN VIEWER -->

<div
  class="image-viewer"
  id="imageViewer"
  onclick="closeImage()"
>

  <button
    class="close-viewer"
    onclick="closeImage(event)"
  >
    ×
  </button>

  <img
    id="fullImage"
    src=""
    alt="Laptop Wallpaper"
  >

</div>


<!-- HEADER -->

<header>

  <div class="logo">

    Wall<span>ora</span>

  </div>


  <a
    href="index.html"
    class="back"
  >
    ← Home
  </a>

</header>


<!-- HERO -->

<section class="hero">

  <h1>

    Laptop <span>Wallpapers</span>

  </h1>


  <p>

    Premium HD & 4K wallpapers
    for laptop and desktop

  </p>


  <div class="search">

    <input
      id="search"
      type="text"
      placeholder="🔍 Search laptop wallpapers..."
      oninput="searchWallpaper()"
    >

  </div>

</section>


<!-- GALLERY -->

<section class="gallery">

  <div class="gallery-head">

    <h2>
      💻 Laptop Wallpapers
    </h2>

    <span id="count">
      Loading...
    </span>

  </div>


  <div
    class="grid"
    id="grid"
  >

    <div class="empty">

      Loading wallpapers...

    </div>

  </div>

</section>


<!-- FOOTER -->

<footer>

  <div class="footer-logo">

    Wall<span>ora</span>

  </div>

  <p>
    Premium Laptop Wallpapers
  </p>

  <p style="margin-top:8px;">

    © 2026 Wallora • Created by
    <strong>Deepak Paweria</strong>

  </p>

</footer>


<script>


/* =========================
   GITHUB
========================= */

const GITHUB_USER =
"goldenmarry73916-cmyk";

const GITHUB_REPO =
"goldenmarry73916-cmyk.github.io";

const BRANCH =
"main";


let wallpapers = [];


/* =========================
   GET FILES
========================= */

async function getFiles(){

  const url =
  `https://api.github.com/repos/`+
  `${GITHUB_USER}/`+
  `${GITHUB_REPO}/contents/desktop?ref=${BRANCH}`;


  try{

    const response =
    await fetch(url);


    if(!response.ok){

      return [];

    }


    const data =
    await response.json();


    return Array.isArray(data)
      ? data
      : [];


  }catch(error){

    console.log(error);

    return [];

  }

}


/* =========================
   CHECK IMAGE
========================= */

function isImage(file){

  return file &&
  file.type === "file" &&
  /\.(jpg|jpeg|png|webp|gif|avif)$/i
  .test(file.name);

}


/* =========================
   LOAD WALLPAPERS
========================= */

async function loadWallpapers(){

  const files =
  await getFiles();


  const images =
  files.filter(
    file => isImage(file)
  );


  wallpapers =
  images.map(
    (file,index)=>({

      name:
      "Laptop " +
      (index + 1),

      url:
      `https://raw.githubusercontent.com/`+
      `${GITHUB_USER}/`+
      `${GITHUB_REPO}/`+
      `${BRANCH}/`+
      `${file.path}`

    })
  );


  render(wallpapers);

}


/* =========================
   RENDER
========================= */

function render(list){

  const grid =
  document.getElementById(
    "grid"
  );


  const count =
  document.getElementById(
    "count"
  );


  grid.innerHTML = "";


  count.innerText =
  list.length +
  " Wallpapers";


  if(list.length === 0){

    grid.innerHTML = `

      <div class="empty">

        <h3>
          No laptop wallpapers found
        </h3>

        <p style="margin-top:8px;">

          desktop folder me
          wallpapers upload karo.

        </p>

      </div>

    `;

    return;

  }


  list.forEach(
    wallpaper=>{

      const card =
      document.createElement(
        "div"
      );


      card.className =
      "card";


      card.innerHTML = `

        <img
          src="${wallpaper.url}"
          loading="lazy"
          alt="${wallpaper.name}"
        >


        <div class="info">

          <h3>
            ${wallpaper.name}
          </h3>


          <div class="brand">
            WALLORA
          </div>


          <div class="owner">
            Deepak Paweria
          </div>


          <div class="actions">

            <button
              class="like"
              onclick="likeWallpaper(this)"
            >
              ❤️ <span>0</span>
            </button>


            <button
              class="comment"
              onclick="toggleComments(this)"
            >
              💬
            </button>


            <a
              class="download"
              href="${wallpaper.url}"
              download
            >
              Download
            </a>

          </div>


          <div class="comments">

            <input
              type="text"
              placeholder="Write a comment..."
            >


            <button
              onclick="addComment(this)"
            >
              Post
            </button>


            <div
              class="comment-list"
            ></div>

          </div>

        </div>

      `;


      const image =
      card.querySelector(
        "img"
      );


      image.onclick =
      function(){

        openImage(
          wallpaper.url
        );

      };


      grid.appendChild(card);

    }
  );

}


/* =========================
   SEARCH
========================= */

function searchWallpaper(){

  const text =
  document
  .getElementById("search")
  .value
  .toLowerCase()
  .trim();


  const filtered =
  wallpapers.filter(
    wallpaper =>
    wallpaper.name
    .toLowerCase()
    .includes(text)
  );


  render(filtered);

}


/* =========================
   FULL SCREEN
========================= */

function openImage(url){

  const viewer =
  document.getElementById(
    "imageViewer"
  );


  const image =
  document.getElementById(
    "fullImage"
  );


  image.src =
  url;


  viewer.classList
  .add("show");

}


function closeImage(event){

  if(event){

    event.stopPropagation();

  }


  document
  .getElementById(
    "imageViewer"
  )
  .classList
  .remove("show");


  document
  .getElementById(
    "fullImage"
  )
  .src = "";

}


document.addEventListener(
  "keydown",
  function(event){

    if(event.key === "Escape"){

      closeImage();

    }

  }
);


/* =========================
   LIKE
========================= */

function likeWallpaper(button){

  const number =
  button.querySelector(
    "span"
  );


  let value =
  parseInt(
    number.innerText
  );


  if(
    button.classList
    .contains("liked")
  ){

    value--;

    button.classList
    .remove("liked");

  }else{

    value++;

    button.classList
    .add("liked");

  }


  number.innerText =
  value;

}


/* =========================
   COMMENTS
========================= */

function toggleComments(button){

  const area =
  button
  .closest(".info")
  .querySelector(
    ".comments"
  );


  area.classList
  .toggle("show");

}


function addComment(button){

  const area =
  button.closest(
    ".comments"
  );


  const input =
  area.querySelector(
    "input"
  );


  const list =
  area.querySelector(
    ".comment-list"
  );


  const text =
  input.value.trim();


  if(!text){

    return;

  }


  const div =
  document.createElement(
    "div"
  );


  div.innerText =
  "💬 " + text;


  list.appendChild(
    div
  );


  input.value = "";

}


/* =========================
   START
========================= */

loadWallpapers();

</script>

</body>

</html>
