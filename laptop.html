<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Wallora • Laptop Wallpapers</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --bg:#05050b;
    --bg2:#0b0a18;
    --card:rgba(20,17,39,.72);
    --card2:rgba(30,24,55,.72);
    --text:#fff;
    --muted:#9693ad;
    --border:rgba(255,255,255,.09);
    --purple:#8b5cf6;
    --violet:#a855f7;
    --blue:#22d3ee;
    --pink:#ec4899;
    --gold:#f5c451;
    --shadow:rgba(0,0,0,.45);
}

body{
    font-family:
        Inter,
        Arial,
        Helvetica,
        sans-serif;

    background:
        radial-gradient(
            circle at 10% 0%,
            rgba(124,92,255,.25),
            transparent 28%
        ),
        radial-gradient(
            circle at 90% 8%,
            rgba(0,200,255,.16),
            transparent 25%
        ),
        radial-gradient(
            circle at 50% 80%,
            rgba(168,85,247,.09),
            transparent 30%
        ),
        linear-gradient(
            135deg,
            var(--bg),
            var(--bg2)
        );

    color:var(--text);
    min-height:100vh;
    overflow-x:hidden;
    transition:.3s ease;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background:
        linear-gradient(
            rgba(255,255,255,.018) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.018) 1px,
            transparent 1px
        );
    background-size:45px 45px;
    mask-image:linear-gradient(
        to bottom,
        black,
        transparent 75%
    );
    z-index:-1;
}

body.light{
    --bg:#f5f6fb;
    --bg2:#eef0f8;
    --card:rgba(255,255,255,.78);
    --card2:rgba(245,246,252,.9);
    --text:#151625;
    --muted:#686d80;
    --border:rgba(20,20,40,.10);
    --shadow:rgba(40,40,80,.15);

    background:
        radial-gradient(
            circle at 10% 0%,
            rgba(124,92,255,.16),
            transparent 28%
        ),
        radial-gradient(
            circle at 90% 8%,
            rgba(0,200,255,.12),
            transparent 25%
        ),
        linear-gradient(
            135deg,
            var(--bg),
            var(--bg2)
        );
}

body.light header{
    background:rgba(255,255,255,.78);
}

body.light .search input{
    color:var(--text);
}

body.light .upload-panel input{
    color:var(--text);
}


/* =========================
   HEADER
========================= */

header{
    position:sticky;
    top:0;
    z-index:1000;

    height:76px;
    padding:0 5%;

    display:flex;
    align-items:center;
    justify-content:space-between;

    background:rgba(6,6,15,.72);

    backdrop-filter:blur(22px);
    -webkit-backdrop-filter:blur(22px);

    border-bottom:1px solid var(--border);
}

.logo{
    position:relative;

    font-size:28px;
    font-weight:950;
    letter-spacing:-1.5px;

    user-select:none;
}

.logo::after{
    content:"";
    position:absolute;

    width:7px;
    height:7px;

    right:-10px;
    top:3px;

    border-radius:50%;

    background:var(--blue);

    box-shadow:
        0 0 12px var(--blue);
}

.logo span{
    background:
        linear-gradient(
            100deg,
            var(--purple),
            var(--pink),
            var(--blue)
        );

    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
}

.header-actions{
    display:flex;
    align-items:center;
    gap:10px;
}

.back,
.owner-btn{
    min-height:42px;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:0 15px;

    border:1px solid var(--border);
    border-radius:13px;

    background:rgba(255,255,255,.045);
    color:var(--text);

    text-decoration:none;
    font-size:13px;
    font-weight:700;

    cursor:pointer;

    transition:
        transform .25s ease,
        border-color .25s ease,
        box-shadow .25s ease,
        background .25s ease;
}

.back:hover{
    transform:translateY(-2px);

    border-color:
        rgba(139,92,246,.6);

    background:
        rgba(139,92,246,.1);

    box-shadow:
        0 8px 25px rgba(139,92,246,.12);
}

.owner-btn{
    border:0;

    background:
        linear-gradient(
            100deg,
            var(--purple),
            var(--pink),
            var(--blue)
        );

    color:white;

    box-shadow:
        0 8px 25px rgba(124,92,246,.22);
}

.owner-btn:hover{
    transform:translateY(-2px);

    box-shadow:
        0 12px 35px rgba(124,92,246,.38);
}


/* =========================
   HERO
========================= */

.hero{
    position:relative;

    text-align:center;

    padding:
        82px
        20px
        48px;
}

.hero::before{
    content:"";

    position:absolute;

    width:350px;
    height:180px;

    left:50%;
    top:20px;

    transform:translateX(-50%);

    background:
        radial-gradient(
            ellipse,
            rgba(124,92,246,.18),
            transparent 70%
        );

    pointer-events:none;
}

.hero-label{
    display:inline-flex;
    align-items:center;
    gap:7px;

    padding:7px 13px;

    border:1px solid
        rgba(139,92,246,.25);

    border-radius:999px;

    background:
        rgba(139,92,246,.08);

    color:#b9a8ff;

    font-size:10px;
    font-weight:900;

    letter-spacing:2px;

    margin-bottom:17px;
}

.hero-label::before{
    content:"";
    width:6px;
    height:6px;

    border-radius:50%;

    background:var(--blue);

    box-shadow:
        0 0 12px var(--blue);
}

.hero h1{
    position:relative;

    font-size:
        clamp(40px,6vw,68px);

    line-height:1.05;

    font-weight:950;

    letter-spacing:-3px;
}

.hero h1 span{
    background:
        linear-gradient(
            100deg,
            var(--purple),
            var(--pink),
            var(--blue)
        );

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;
}

.hero p{
    margin-top:15px;

    color:var(--muted);

    font-size:15px;
    line-height:1.6;
}


/* =========================
   SEARCH
========================= */

.search{
    position:relative;

    max-width:680px;

    margin:30px auto 0;
}

.search::before{
    content:"⌕";

    position:absolute;

    left:19px;
    top:50%;

    transform:translateY(-51%);

    color:#aaa2cf;

    font-size:22px;

    pointer-events:none;

    z-index:2;
}

.search input{
    width:100%;

    height:58px;

    padding:
        0
        22px
        0
        52px;

    border-radius:18px;

    border:1px solid var(--border);

    outline:none;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.075),
            rgba(255,255,255,.025)
        );

    backdrop-filter:blur(16px);

    color:var(--text);

    font-size:14px;

    box-shadow:
        0 15px 45px rgba(0,0,0,.16);

    transition:.25s ease;
}

.search input::placeholder{
    color:#858198;
}

.search input:focus{
    border-color:
        rgba(139,92,246,.65);

    box-shadow:
        0 0 0 4px
            rgba(139,92,246,.09),
        0 18px 55px
            rgba(0,0,0,.2);
}


/* =========================
   GALLERY
========================= */

.gallery{
    width:100%;

    padding:
        10px
        5%
        75px;
}

.gallery-head{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;

    margin-bottom:23px;

    padding-bottom:15px;

    border-bottom:
        1px solid var(--border);
}

.gallery-head h2{
    font-size:23px;
    font-weight:900;
    letter-spacing:-.5px;
}

.gallery-head span{
    color:var(--muted);

    font-size:12px;
    font-weight:700;

    padding:7px 11px;

    border-radius:999px;

    background:
        rgba(139,92,246,.08);

    border:
        1px solid
        rgba(139,92,246,.12);
}


/* =========================
   GRID
========================= */

.grid{
    display:grid;

    grid-template-columns:
        repeat(2,minmax(0,1fr));

    gap:22px;

    width:100%;
}


/* =========================
   CARD
========================= */

.card{
    position:relative;

    overflow:hidden;

    border-radius:21px;

    border:1px solid var(--border);

    background:
        linear-gradient(
            145deg,
            var(--card),
            var(--card2)
        );

    box-shadow:
        0 18px 50px var(--shadow);

    transition:
        transform .35s ease,
        border-color .35s ease,
        box-shadow .35s ease;
}

.card::before{
    content:"";

    position:absolute;

    inset:0;

    background:
        linear-gradient(
            135deg,
            rgba(139,92,246,.12),
            transparent 35%,
            rgba(34,211,238,.06)
        );

    pointer-events:none;

    opacity:.7;
}

.card:hover{
    transform:translateY(-8px);

    border-color:
        rgba(139,92,246,.55);

    box-shadow:
        0 28px 65px
            rgba(0,0,0,.42),
        0 0 0 1px
            rgba(139,92,246,.08);
}


/* =========================
   IMAGE
========================= */

.image-wrap{
    position:relative;

    width:100%;

    aspect-ratio:16 / 9;

    overflow:hidden;

    cursor:pointer;

    background:#030308;
}

.image-wrap::before{
    content:"";

    position:absolute;
    inset:0;

    z-index:2;

    background:
        linear-gradient(
            to bottom,
            transparent 50%,
            rgba(0,0,0,.45)
        );

    opacity:.45;

    pointer-events:none;
}

.image-wrap img{
    width:100%;
    height:100%;

    object-fit:cover;

    display:block;

    transition:
        transform .6s cubic-bezier(.2,.7,.2,1),
        filter .4s ease;
}

.card:hover
.image-wrap img{
    transform:scale(1.055);

    filter:
        brightness(1.05)
        saturate(1.08);
}

.image-wrap::after{
    content:"VIEW WALLPAPER  ↗";

    position:absolute;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%)
        translateY(10px);

    padding:
        11px
        17px;

    border-radius:999px;

    background:
        rgba(8,7,16,.72);

    backdrop-filter:blur(12px);

    border:
        1px solid
        rgba(255,255,255,.17);

    color:white;

    font-size:10px;
    font-weight:900;

    letter-spacing:1.2px;

    opacity:0;

    transition:.3s ease;

    pointer-events:none;

    white-space:nowrap;

    box-shadow:
        0 10px 35px rgba(0,0,0,.35);
}

.card:hover
.image-wrap::after{
    opacity:1;

    transform:
        translate(-50%,-50%)
        translateY(0);
}


/* =========================
   INFO
========================= */

.info{
    position:relative;

    padding:
        15px
        16px
        17px;
}

.info h3{
    font-size:14px;

    font-weight:800;

    margin-bottom:7px;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.brand{
    display:inline-block;

    font-size:9px;

    color:#b6a4ff;

    font-weight:900;

    letter-spacing:1.8px;

    padding:4px 7px;

    border-radius:6px;

    background:
        rgba(139,92,246,.09);
}

.owner{
    margin-top:7px;

    font-size:11px;

    color:var(--muted);
}


/* =========================
   EMPTY
========================= */

.empty{
    grid-column:1/-1;

    text-align:center;

    padding:80px 20px;

    border:
        1px dashed
        var(--border);

    border-radius:20px;

    color:var(--muted);

    background:
        rgba(255,255,255,.025);
}

.empty h3{
    color:var(--text);

    font-size:18px;

    margin-bottom:8px;
}


/* =========================
   VIEWER
========================= */

.viewer{
    position:fixed;
    inset:0;

    z-index:5000;

    display:none;
    flex-direction:column;

    width:100vw;
    height:100dvh;

    background:
        rgba(2,2,7,.97);

    backdrop-filter:blur(18px);
}

.viewer.show{
    display:flex;
}

.viewer::before{
    content:"";

    position:absolute;
    inset:0;

    background:
        radial-gradient(
            circle at 50% 35%,
            rgba(124,92,246,.15),
            transparent 42%
        );

    pointer-events:none;
}

.viewer-top{
    position:relative;

    height:70px;
    flex:0 0 70px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 18px;

    color:white;

    background:
        linear-gradient(
            rgba(0,0,0,.88),
            transparent
        );
}

.viewer-title{
    font-size:15px;
    font-weight:850;

    max-width:75%;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.close-viewer{
    width:44px;
    height:44px;

    border:1px solid
        rgba(255,255,255,.12);

    border-radius:50%;

    background:
        rgba(255,255,255,.09);

    color:white;

    font-size:21px;

    cursor:pointer;

    transition:.25s;
}

.close-viewer:hover{
    background:
        rgba(255,255,255,.17);

    transform:rotate(90deg);
}

.viewer-image-area{
    position:relative;

    flex:1;
    min-height:0;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:15px;
}

.viewer-image-frame{
    position:relative;

    width:min(94vw,1250px);

    aspect-ratio:16 / 9;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;

    border-radius:16px;

    background:#020207;

    border:
        1px solid
        rgba(255,255,255,.08);

    box-shadow:
        0 30px 100px rgba(0,0,0,.7),
        0 0 80px rgba(124,92,246,.08);
}

.viewer-image-frame img{
    width:100%;
    height:100%;

    object-fit:contain;

    display:block;
}


/* =========================
   VIEWER BOTTOM
========================= */

.viewer-bottom{
    position:relative;

    flex:0 0 auto;

    padding:
        12px
        15px
        calc(
            15px +
            env(safe-area-inset-bottom)
        );

    background:
        linear-gradient(
            transparent,
            rgba(0,0,0,.98) 22%
        );
}

.viewer-actions{
    width:100%;
    max-width:720px;

    margin:auto;

    display:grid;

    grid-template-columns:
        1fr 1fr 1.25fr;

    gap:9px;
}

.viewer-actions button{
    min-height:50px;

    border:
        1px solid
        rgba(255,255,255,.1);

    border-radius:14px;

    background:
        rgba(255,255,255,.09);

    color:white;

    font-size:13px;
    font-weight:850;

    cursor:pointer;

    transition:.25s;
}

.viewer-actions button:hover{
    background:
        rgba(255,255,255,.15);

    transform:translateY(-2px);
}

.viewer-actions button.liked{
    background:#e53935;

    border-color:#e53935;

    box-shadow:
        0 8px 25px
        rgba(229,57,53,.25);
}

.viewer-actions .download-btn{
    background:white;
    color:#111;

    border-color:white;
}

.viewer-actions .download-btn:hover{
    background:#eee;
}

.viewer-actions button:disabled{
    opacity:.65;
    cursor:not-allowed;
    transform:none;
}


/* =========================
   COMMENTS
========================= */

.viewer-comments{
    display:none;

    width:100%;
    max-width:720px;

    margin:10px auto 0;
}

.viewer-comments.show{
    display:block;
}

.comment-row{
    display:flex;
    gap:8px;
}

.comment-row input{
    flex:1;
    min-width:0;

    padding:13px 14px;

    border:
        1px solid
        rgba(255,255,255,.13);

    border-radius:11px;

    outline:none;

    background:
        rgba(255,255,255,.08);

    color:white;
}

.comment-row input:focus{
    border-color:
        rgba(139,92,246,.65);
}

.comment-row button{
    padding:0 17px;

    border:0;
    border-radius:11px;

    background:var(--gold);

    color:#111;

    font-weight:900;

    cursor:pointer;
}

.viewer-comment-list{
    margin-top:8px;

    max-height:130px;

    overflow:auto;

    display:flex;
    flex-direction:column;

    gap:5px;
}

.viewer-comment-item{
    padding:9px 11px;

    border-radius:9px;

    background:
        rgba(255,255,255,.07);

    color:#ddd;

    font-size:12px;
}


/* =========================
   UPLOAD MODAL
========================= */

.upload-box{
    position:fixed;
    inset:0;

    z-index:6000;

    display:none;

    align-items:center;
    justify-content:center;

    padding:20px;

    background:
        rgba(0,0,0,.72);

    backdrop-filter:blur(12px);
}

.upload-box.show{
    display:flex;
}

.upload-panel{
    width:100%;
    max-width:460px;

    padding:28px;

    border-radius:24px;

    background:
        linear-gradient(
            145deg,
            rgba(25,21,48,.97),
            rgba(12,11,25,.97)
        );

    border:
        1px solid
        rgba(139,92,246,.25);

    box-shadow:
        0 35px 100px rgba(0,0,0,.75),
        0 0 60px rgba(124,92,246,.1);

    animation:
        uploadPop .25s ease;
}

body.light .upload-panel{
    background:
        rgba(255,255,255,.97);
}

@keyframes uploadPop{

    from{
        opacity:0;
        transform:
            translateY(12px)
            scale(.96);
    }

    to{
        opacity:1;
        transform:
            translateY(0)
            scale(1);
    }
}

.upload-panel h2{
    font-size:20px;

    margin-bottom:20px;
}

.upload-panel input{
    width:100%;

    padding:14px;

    margin-top:5px;

    border-radius:12px;

    border:
        1px solid
        var(--border);

    background:
        rgba(255,255,255,.045);

    color:var(--text);

    outline:none;
}

.upload-panel input:focus{
    border-color:
        var(--purple);

    box-shadow:
        0 0 0 3px
        rgba(139,92,246,.08);
}

.upload-actions{
    display:flex;

    gap:10px;

    margin-top:18px;
}

.upload-actions button{
    flex:1;

    min-height:45px;

    padding:12px;

    border:0;

    border-radius:12px;

    cursor:pointer;

    font-weight:800;

    transition:.2s;
}

.upload-actions button:hover{
    transform:translateY(-2px);
}

.upload{
    background:
        linear-gradient(
            100deg,
            var(--purple),
            var(--blue)
        );

    color:white;

    box-shadow:
        0 8px 25px
        rgba(124,92,246,.22);
}

.cancel{
    background:#292f4b;
    color:white;
}

body.light .cancel{
    background:#e4e7ef;
    color:#171b30;
}

#uploadStatus{
    margin-top:13px;

    color:var(--muted);

    font-size:13px;

    line-height:1.5;
}


/* =========================
   FOOTER
========================= */

footer{
    padding:55px 20px 45px;

    text-align:center;

    border-top:
        1px solid
        var(--border);

    color:var(--muted);

    background:
        rgba(0,0,0,.08);
}

.footer-logo{
    font-size:25px;

    font-weight:950;

    letter-spacing:-1px;

    margin-bottom:8px;
}

.footer-logo span{
    background:
        linear-gradient(
            100deg,
            var(--purple),
            var(--blue)
        );

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;
}

footer p{
    font-size:12px;
}

footer strong{
    color:var(--gold);
}


/* =========================
   TABLET
========================= */

@media(max-width:850px){

    .grid{
        gap:15px;
    }

    .gallery{
        padding-left:4%;
        padding-right:4%;
    }

}


/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    header{
        height:68px;

        padding:
            0 4%;
    }

    .logo{
        font-size:24px;
    }

    .hero{
        padding:
            58px
            18px
            35px;
    }

    .hero h1{
        font-size:40px;

        letter-spacing:-2px;
    }

    .hero p{
        font-size:13px;
    }

    .search{
        margin-top:25px;
    }

    .search input{
        height:54px;

        border-radius:16px;
    }

    .gallery{
        padding:
            8px
            4%
            50px;
    }

    .gallery-head{
        align-items:center;

        margin-bottom:17px;
    }

    .gallery-head h2{
        font-size:18px;
    }

    .gallery-head span{
        font-size:10px;
    }

    .grid{
        grid-template-columns:1fr;

        gap:15px;
    }

    .card{
        border-radius:18px;
    }

    .image-wrap{
        aspect-ratio:16 / 9;
    }

    .image-wrap::after{
        display:none;
    }

    .back{
        display:none;
    }

    .owner-btn{
        min-height:39px;

        padding:
            0 11px;

        font-size:12px;
    }

    .viewer-top{
        height:62px;

/* UPLOAD WALLPAPER */

async function uploadWallpaper(){

    const file =
        document
            .getElementById(
                "wallpaperFile"
            )
            .files[0];

    const status =
        document
            .getElementById(
                "uploadStatus"
            );

    if(!file){

        status.innerText =
            "Please select a wallpaper.";

        return;

    }

    if(
        !file.type.startsWith("image/")
    ){

        status.innerText =
            "Only image files are allowed.";

        return;

    }

    if(
        file.size >
        15 * 1024 * 1024
    ){

        status.innerText =
            "Maximum file size is 15 MB.";

        return;

    }

    const {data} =
        await walloraSupabase
            .auth
            .getUser();

    if(
        !data.user ||
        data.user.id !== OWNER_UID
    ){

        status.innerText =
            "Only Wallora owner can upload.";

        return;

    }

    try{

        status.innerText =
            "☁️ Uploading to Cloudinary...";

        const formData =
            new FormData();

        formData.append(
            "file",
            file
        );

        formData.append(
            "upload_preset",
            CLOUDINARY_PRESET
        );

        formData.append(
            "folder",
            "wallora/laptop"
        );

        const response =
            await fetch(
                "https://api.cloudinary.com/v1_1/" +
                CLOUDINARY_CLOUD +
                "/image/upload",
                {
                    method:"POST",
                    body:formData
                }
            );

        const cloudData =
            await response.json();

        if(
            !response.ok ||
            !cloudData.secure_url
        ){

            throw new Error(
                cloudData.error?.message ||
                "Cloudinary upload failed."
            );

        }

        status.innerText =
            "☁️ Saving wallpaper...";

        const {error} =
            await walloraSupabase
                .from("wallpapers")
                .insert({

                    name:file.name,

                    category:"laptop",

                    url:cloudData.secure_url

                });

        if(error){

            throw new Error(
                "Database save failed: " +
                error.message
            );

        }

        status.innerText =
            "✅ Laptop wallpaper uploaded successfully!";

        document
            .getElementById(
                "wallpaperFile"
            )
            .value = "";

        setTimeout(
            function(){

                closeUpload();

                loadWallpapers();

            },
            1000
        );

    }catch(error){

        console.error(
            "Upload error:",
            error
        );

        status.innerText =
            "❌ " + error.message;

    }

}

    const allowedCategories = [

        "laptop",
        "gaming",
        "cars",
        "nature",
        "anime",

    ];


    const oldFiltered =

/* ESCAPE HTML */

function escapeHTML(value){

    return String(value || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}

                const category =
                    String(
                        wallpaper.category ||
                        ""
                    ).toLowerCase();

                return (
                    name.includes(text) ||
                    category.includes(text)
                );

            }
        );


    render(filtered);

}

/* =====================================================
   WALLORA DOWNLOAD SYSTEM
   3 FREE DOWNLOADS
   4TH DOWNLOAD = LOGIN / SIGNUP
   MOBILE + LAPTOP SAME COUNT
===================================================== */

const WALLORA_FREE_DOWNLOAD_LIMIT = 3;

const WALLORA_DOWNLOAD_COUNT_KEY =
    "wallora-free-download-count";


/* GET COUNT */

function getWalloraDownloadCount(){

    return Number(
        localStorage.getItem(
            WALLORA_DOWNLOAD_COUNT_KEY
        ) || 0
    );

}


/* SAVE COUNT */

function setWalloraDownloadCount(count){

    localStorage.setItem(
        WALLORA_DOWNLOAD_COUNT_KEY,
        String(count)
    );

}


/* CHECK LOGIN */

async function isWalloraLoggedIn(){

    try{

        const {
            data,
            error
        } =
            await walloraSupabase
                .auth
                .getSession();


        if(error){

            console.error(
                "Session check error:",
                error
            );

            return false;

        }


        return !!data?.session;

    }catch(error){

        console.error(
            "Login check error:",
            error
        );

        return false;

    }

}


/* ACTUAL DOWNLOAD */

async function startLaptopDownload(button){

    if(!currentWallpaper){
        return false;
    }


    const original =
        button.innerText;


    try{

        button.disabled =
            true;

        button.innerText =
            "⏳ Preparing...";


        let downloadURL =
            currentWallpaper.url;


        if(
            downloadURL.includes(
                "res.cloudinary.com"
            ) &&
            downloadURL.includes(
                "/upload/"
            )
        ){

            downloadURL =
                downloadURL.replace(
                    "/upload/",
                    "/upload/fl_attachment/"
                );

        }


        const response =
            await fetch(
                downloadURL,
                {
                    method:"GET",
                    mode:"cors"
                }
            );


        if(!response.ok){

            throw new Error(
                "Download failed"
            );

        }


        const blob =
            await response.blob();


        const blobURL =
            URL.createObjectURL(
                blob
            );


        const link =
            document.createElement(
                "a"
            );


        link.href =
            blobURL;


        link.download =
            (
                currentWallpaper.name ||
                "Wallora-Laptop-Wallpaper"
            )
            .replace(
                /[^a-zA-Z0-9-_]/g,
                "-"
            ) +
            ".jpg";


        document.body.appendChild(
            link
        );


        link.click();


        link.remove();


        setTimeout(
            function(){

                URL.revokeObjectURL(
                    blobURL
                );

            },
            1500
        );


        button.innerText =
            "✅ Downloaded";


        setTimeout(
            function(){

                button.innerText =
                    original;

                button.disabled =
                    false;

            },
            1500
        );


        return true;


    }catch(error){

        console.error(
            "Download error:",
            error
        );


        let fallback =
            currentWallpaper.url;


        if(
            fallback.includes(
                "res.cloudinary.com"
            ) &&
            fallback.includes(
                "/upload/"
            )
        ){

            fallback =
                fallback.replace(
                    "/upload/",
                    "/upload/fl_attachment/"
                );

        }


        window.open(
            fallback,
            "_blank"
        );


        button.innerText =
            "⬇ Download";


        button.disabled =
            false;


        return true;

    }

}


/* MAIN DOWNLOAD */

async function viewerDownload(button){

    if(!currentWallpaper){
        return;
    }


    const loggedIn =
        await isWalloraLoggedIn();


    if(loggedIn){

        await startLaptopDownload(
            button
        );

        return;

    }


    const count =
        getWalloraDownloadCount();


    if(
        count <
        WALLORA_FREE_DOWNLOAD_LIMIT
    ){

        const newCount =
            count + 1;


        setWalloraDownloadCount(
            newCount
        );


        console.log(
            "Wallora free download:",
            newCount,
            "/",
            WALLORA_FREE_DOWNLOAD_LIMIT
        );


        await startLaptopDownload(
            button
        );

        return;

    }


    alert(
        "🔐 Login / Signup Required\n\n" +
        "Aapke 3 free downloads complete ho gaye hain.\n\n" +
        "4th download ke liye Wallora account me login ya signup karein."
    );


    window.location.href =
        "index.html";

}
