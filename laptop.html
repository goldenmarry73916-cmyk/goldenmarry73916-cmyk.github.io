<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Wallora • Laptop Wallpapers</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

:root{
  --bg:#070812;
  --card:#101321;
  --card2:#171b30;
  --text:#ffffff;
  --muted:#9299b5;
  --border:#292f4b;
  --purple:#7c5cff;
  --blue:#00c8ff;
  --gold:#ffc857;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:
    radial-gradient(circle at 10% 5%,#38218a55,transparent 30%),
    radial-gradient(circle at 90% 15%,#006f9250,transparent 28%),
    var(--bg);
  color:var(--text);
  min-height:100vh;
  transition:
    background .3s ease,
    color .3s ease;
}

/* LIGHT THEME */

body.light{
  --bg:#f4f6fb;
  --card:#ffffff;
  --card2:#eef1f8;
  --text:#151827;
  --muted:#667085;
  --border:#dfe3ed;

  background:
    radial-gradient(circle at 10% 5%,#7c5cff22,transparent 30%),
    radial-gradient(circle at 90% 15%,#00c8ff20,transparent 28%),
    var(--bg);
}

body.light header{
  background:#ffffffdd;
}

body.light .search input,
body.light .comments input,
body.light .upload-panel input,
body.light .upload-panel select{
  color:var(--text);
}

body.light .like,
body.light .comment{
  background:#e8ebf3;
  color:#171b30;
}

body.light .cancel{
  background:#e4e7ef;
  color:#171b30;
}


/* HEADER */

header{
  position:sticky;
  top:0;
  z-index:1000;
  height:70px;
  padding:0 5%;
  display:flex;
  align-items:center;
  justify-content:space-between;

  background:#080a14dd;
  backdrop-filter:blur(18px);

  border-bottom:1px solid var(--border);

  transition:.3s;
}

.logo{
  font-size:27px;
  font-weight:900;
  letter-spacing:-1px;
}

.logo span{
  background:
    linear-gradient(
      90deg,
      var(--purple),
      var(--blue),
      var(--gold)
    );

  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.header-actions{
  display:flex;
  gap:8px;
  align-items:center;
}

.theme-btn,
.back,
.owner-btn{
  padding:10px 14px;

  border:1px solid var(--border);
  border-radius:12px;

  background:var(--card);
  color:var(--text);

  text-decoration:none;
  font-size:13px;
  cursor:pointer;

  transition:.25s;
}

.theme-btn{
  font-size:17px;
  width:44px;
  height:42px;
  padding:0;
}

.theme-btn:hover,
.back:hover{
  border-color:var(--purple);
  transform:translateY(-2px);
}

.owner-btn{
  background:
    linear-gradient(
      90deg,
      var(--purple),
      var(--blue)
    );

  border:0;
  color:white;
  font-weight:bold;
}

.owner-btn:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 25px #7c5cff55;
}


/* HERO */

.hero{
  text-align:center;
  padding:60px 20px 35px;
}

.hero h1{
  font-size:48px;
  font-weight:900;
  letter-spacing:-1.5px;
}

.hero h1 span{
  background:
    linear-gradient(
      90deg,
      var(--purple),
      var(--blue)
    );

  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.hero p{
  margin-top:10px;
  color:var(--muted);
  font-size:14px;
}


/* SEARCH */

.search{
  max-width:650px;
  margin:25px auto 0;
}

.search input{
  width:100%;
  padding:16px 22px;

  border-radius:30px;
  border:1px solid var(--border);

  background:var(--card);
  color:var(--text);

  outline:none;
  font-size:15px;

  transition:.25s;
}

.search input:focus{
  border-color:var(--purple);
  box-shadow:0 0 0 3px #7c5cff18;
}


/* GALLERY */

.gallery{
  padding:20px 6% 60px;
}

.gallery-head{
  display:flex;
  align-items:center;
  justify-content:space-between;

  margin-bottom:20px;
}

.gallery-head h2{
  font-size:24px;
}

.gallery-head span{
  color:var(--muted);
  font-size:13px;
}


/* GRID */

.grid{
  display:grid;

  grid-template-columns:
    repeat(auto-fill,minmax(220px,1fr));

  gap:20px;
}


/* CARD */

.card{
  background:
    linear-gradient(
      145deg,
      var(--card),
      var(--card2)
    );

  border:1px solid var(--border);
  border-radius:18px;

  overflow:hidden;

  box-shadow:0 10px 30px #0006;

  transition:.3s ease;
}

.card:hover{
  transform:translateY(-6px);

  border-color:var(--purple);

  box-shadow:
    0 20px 45px #0009;
}

.card img{
  width:100%;
  height:190px;

  object-fit:cover;
  display:block;
  cursor:pointer;

  transition:.35s;
}

.card:hover img{
  transform:scale(1.03);
}

.info{
  padding:13px;
}

.info h3{
  font-size:14px;
  margin-bottom:6px;
}

.brand{
  font-size:10px;
  color:var(--gold);
  font-weight:bold;
  letter-spacing:1.5px;
}

.owner{
  font-size:11px;
  color:var(--muted);
  margin:4px 0 12px;
}


/* ACTIONS */

.actions{
  display:flex;
  gap:7px;
}

.like,
.comment{
  border:0;
  border-radius:9px;

  padding:9px 11px;

  background:#252a40;
  color:white;

  cursor:pointer;
}

.like.liked{
  background:#e53935;
}

.download{
  flex:1;

  padding:9px;

  border-radius:9px;

  background:
    linear-gradient(
      90deg,
      var(--purple),
      var(--blue)
    );

  color:white;

  text-align:center;
  text-decoration:none;

  font-size:12px;
  font-weight:bold;
}


/* COMMENTS */

.comments{
  display:none;
  margin-top:10px;
}

.comments.show{
  display:block;
}

.comments input{
  width:100%;

  padding:9px;

  border:1px solid var(--border);
  border-radius:8px;

  background:var(--bg);
  color:var(--text);

  outline:none;
}

.comments button{
  margin-top:6px;

  padding:8px 12px;

  border:0;
  border-radius:7px;

  background:var(--gold);

  cursor:pointer;
}

.comment-list{
  margin-top:8px;

  font-size:12px;
  color:var(--muted);
}


/* EMPTY */

.empty{
  grid-column:1/-1;

  text-align:center;

  padding:60px 20px;

  color:var(--muted);
}


/* IMAGE VIEWER */

.image-viewer{
  position:fixed;
  inset:0;

  z-index:5000;

  display:none;

  align-items:center;
  justify-content:center;

  padding:20px;

  background:#000f;
}

.image-viewer.show{
  display:flex;
}

.image-viewer img{
  max-width:100%;
  max-height:92vh;

  object-fit:contain;

  border-radius:10px;
}

.close-viewer{
  position:absolute;

  top:18px;
  right:22px;

  width:45px;
  height:45px;

  border:0;
  border-radius:50%;

  background:#222;
  color:white;

  font-size:28px;

  cursor:pointer;
}


/* UPLOAD BOX */

.upload-box{
  position:fixed;
  inset:0;

  z-index:6000;

  display:none;

  align-items:center;
  justify-content:center;

  padding:20px;

  background:#000c;
}

.upload-box.show{
  display:flex;
}

.upload-panel{
  width:100%;
  max-width:450px;

  padding:25px;

  border-radius:22px;

  background:var(--card);

  border:1px solid var(--border);

  box-shadow:0 30px 80px #000;

  animation:uploadPop .25s ease;
}

@keyframes uploadPop{

  from{
    opacity:0;
    transform:scale(.94);
  }

  to{
    opacity:1;
    transform:scale(1);
  }

}

.upload-panel h2{
  margin-bottom:18px;
}

.upload-panel input,
.upload-panel select{
  width:100%;

  padding:13px;

  margin-top:10px;

  border-radius:10px;

  border:1px solid var(--border);

  background:var(--bg);

  color:var(--text);
}

.upload-actions{
  display:flex;

  gap:10px;

  margin-top:15px;
}

.upload-actions button{
  flex:1;

  padding:12px;

  border:0;

  border-radius:10px;

  cursor:pointer;
}

.upload{
  background:
    linear-gradient(
      90deg,
      var(--purple),
      var(--blue)
    );

  color:white;
  font-weight:bold;
}

.cancel{
  background:#292f4b;
  color:white;
}

#uploadStatus{
  margin-top:12px;

  color:var(--muted);

  font-size:13px;
}


/* FOOTER */

footer{
  padding:40px 20px;

  text-align:center;

  border-top:1px solid var(--border);

  color:var(--muted);
}

.footer-logo{
  font-size:22px;
  font-weight:900;

  margin-bottom:8px;
}

.footer-logo span{
  color:var(--purple);
}

footer strong{
  color:var(--gold);
}


/* MOBILE */

@media(max-width:700px){

  header{
    padding:0 4%;
  }

  .hero{
    padding:45px 18px 30px;
  }

  .hero h1{
    font-size:38px;
  }

  .gallery{
    padding:15px 4% 40px;
  }

  .grid{
    grid-template-columns:repeat(2,1fr);
    gap:12px;
  }

  .card img{
    height:140px;
  }

  .back{
    display:none;
  }

  .owner-btn{
    padding:9px 11px;
  }

}

@media(max-width:380px){

  .grid{
    grid-template-columns:1fr;
  }

  .card img{
    height:220px;
  }

}

</style>
</head>


<body>


<!-- IMAGE VIEWER -->

<div
  class="image-viewer"
  id="imageViewer"
  onclick="closeImage(event)"
>

  <button
    class="close-viewer"
    onclick="closeImage(event)"
  >
    ×
  </button>

  <img
    id="fullImage"
    src=""
    alt="Laptop Wallpaper"
  >

</div>


<!-- UPLOAD -->

<div
  class="upload-box"
  id="uploadBox"
>

  <div class="upload-panel">

    <h2>➕ Upload Laptop Wallpaper</h2>

    <input

      id="wallpaperFile"

    >

    <select id="wallpaperCategory">

      <option value="laptop">

      </option>

      <option value="cars">

      </option>

      <option value="anime">

      </option>

      </option>

    <div class="upload-actions">

      <button
        class="cancel"
        onclick="closeUpload()"
      >
        Cancel
      </button>

      <button
        class="upload"
        onclick="uploadWallpaper()"
      >
        Upload
      </button>

    </div>

    <div id="uploadStatus"></div>

  </div>

</div>


<!-- HEADER -->

<header>

  <div class="logo">
    Wall<span>ora</span>
  </div>

  <div class="header-actions">

    <!-- THEME -->

    <button
      class="theme-btn"
      id="themeButton"
      onclick="toggleTheme()"
      title="Change Theme"
    >
      🌙
    </button>


    <!-- OWNER UPLOAD -->

    <button
      class="owner-btn"
      id="ownerButton"
      onclick="openUpload()"
      style="display:none;"
    >
      ＋ Upload
    </button>


    <a
      href="index.html"
      class="back"
    >
      ← Home
    </a>

  </div>

</header>


<!-- HERO -->

<section class="hero">

  <h1>
    Laptop <span>Wallpapers</span>
  </h1>

  <p>
    Premium HD & 4K wallpapers for laptop and desktop
  </p>

  <div class="search">

    <input
      id="search"
      type="text"
      placeholder="🔍 Search laptop wallpapers..."
      oninput="searchWallpaper()"
    >

  </div>

</section>


<!-- GALLERY -->

<section class="gallery">

  <div class="gallery-head">

    <h2>
      💻 Laptop Wallpapers
    </h2>

    <span id="count">
      Loading...
    </span>

  </div>

  <div
    class="grid"
    id="grid"
  >

    <div class="empty">
      Loading wallpapers...
    </div>

  </div>

</section>


<!-- FOOTER -->

<footer>

  <div class="footer-logo">
    Wall<span>ora</span>
  </div>

  <p>
    Premium Laptop Wallpapers
  </p>

  <p style="margin-top:8px;">
    © 2026 Wallora • Created by
    <strong>Deepak Paweria</strong>
  </p>

</footer>


<script>

/* =====================================
   SUPABASE
===================================== */

const SUPABASE_URL =
"https://frsdscguevzqqkzbwxxy.supabase.co";


const SUPABASE_KEY =
"sb_publishable_fzXOjFFKz_QXtZagfGXpEA_xgf1cZfN";


const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =====================================
   OWNER
===================================== */

const OWNER_UID =
"7c9261f0-a096-482f-acd7-14af34bade15";


/* =====================================
   BUCKET
===================================== */

const BUCKET =
"wallpapers";


/* =====================================
   THEME
   SAME KEY AS INDEX + MOBILE + KEYBOARD
===================================== */

const WALLORA_THEME_KEY =
"wallora-theme";


function getWalloraTheme(){

  const saved =
    localStorage.getItem(
      WALLORA_THEME_KEY
    );

  return saved === "light"
    ? "light"
    : "dark";

}


function applyTheme(theme){

  document.body.classList.toggle(
    "light",
    theme === "light"
  );


  const button =
    document.getElementById(
      "themeButton"
    );


  if(button){

    button.innerText =
      theme === "light"
        ? "☀️"
        : "🌙";

  }

}


function toggleTheme(){

  const current =
    getWalloraTheme();


  const newTheme =
    current === "light"
      ? "dark"
      : "light";


  localStorage.setItem(
    WALLORA_THEME_KEY,
    newTheme
  );


  applyTheme(newTheme);

}


/* =====================================
   THEME SYNC
===================================== */

window.addEventListener(
  "storage",
  function(event){

    if(
      event.key ===
      WALLORA_THEME_KEY
    ){

      applyTheme(
        event.newValue === "light"
          ? "light"
          : "dark"
      );

    }

  }
);


document.addEventListener(
  "visibilitychange",
  function(){

    if(!document.hidden){

      applyTheme(
        getWalloraTheme()
      );

    }

  }
);


window.addEventListener(
  "focus",
  function(){

    applyTheme(
      getWalloraTheme()
    );

  }
);


/* =====================================
   WALLPAPERS
===================================== */

let wallpapers = [];


/* =====================================
   CHECK OWNER
===================================== */

async function checkOwner(){

  const {
    data
  } =
  await supabaseClient
    .auth
    .getUser();


  const button =
    document.getElementById(
      "ownerButton"
    );


  if(
    data &&
    data.user &&
    data.user.id === OWNER_UID
  ){

    button.style.display =
      "block";

  }else{

    button.style.display =
      "none";

  }

}


/* =====================================
   OPEN UPLOAD
===================================== */

async function openUpload(){

  const {
    data
  } =
  await supabaseClient
    .auth
    .getUser();


  if(
    !data.user ||
    data.user.id !== OWNER_UID
  ){

    alert(
      "Only Wallora owner can upload."
    );

    return;

  }


  document
    .getElementById("uploadBox")
    .classList
    .add("show");

}


/* =====================================
   CLOSE UPLOAD
===================================== */

function closeUpload(){

  document
    .getElementById("uploadBox")
    .classList
    .remove("show");

  document
    .getElementById("uploadStatus")
    .innerText = "";

}


/* =====================================
   UPLOAD WALLPAPER
===================================== */

async function uploadWallpaper(){

  const file =
    document
      .getElementById(
        "wallpaperFile"
      )
      .files[0];


  const category =
    document
      .getElementById(
        "wallpaperCategory"
      )
      .value;


  const status =
    document
      .getElementById(
        "uploadStatus"
      );


  if(!file){

    status.innerText =
      "Please select a wallpaper.";

    return;

  }


  if(
    !file.type.startsWith("image/")
  ){

    status.innerText =
      "Only image files are allowed.";

    return;

  }


  if(
    file.size >
    15 * 1024 * 1024
  ){

    status.innerText =
      "Maximum file size is 15 MB.";

    return;

  }


  const {
    data
  } =
  await supabaseClient
    .auth
    .getUser();


  if(
    !data.user ||
    data.user.id !== OWNER_UID
  ){

    status.innerText =
      "Only Wallora owner can upload.";

    return;

  }


  status.innerText =
    "Uploading...";


  const safeName =
    file.name
      .replace(
        /[^a-zA-Z0-9._-]/g,
        "_"
      );


  const filePath =
    "laptop/" +
    category +
    "/" +
    Date.now() +
    "_" +
    safeName;


  const {
    error
  } =
  await supabaseClient
    .storage
    .from(BUCKET)
    .upload(
      filePath,
      file,
      {
        cacheControl:"3600",
        upsert:false
      }
    );


  if(error){

    console.error(error);

    status.innerText =
      "Upload failed: " +
      error.message;

    return;

  }


  status.innerText =
    "Wallpaper uploaded successfully!";


  document
    .getElementById(
      "wallpaperFile"
    )
    .value = "";


  setTimeout(
    function(){

      closeUpload();

      loadWallpapers();

    },
    1000
  );

}


/* =====================================
   GET CATEGORY FILES
===================================== */

async function getCategoryFiles(
  category
){

  const {
    data,
    error
  } =
  await supabaseClient
    .storage
    .from(BUCKET)
    .list(
      "laptop/" + category,
      {
        limit:100,

        sort:{
          column:"created_at",
          order:"desc"
        }

      }
    );


  if(error){

    console.log(
      "Storage error:",
      error
    );

    return [];

  }


  return data || [];

}


/* =====================================
   LOAD WALLPAPERS
===================================== */

async function loadWallpapers(){

  const categories = [

    "laptop",
    "gaming",
    "cars",
    "nature",
    "anime",
    "dark",
    "minimal"

  ];


  wallpapers = [];


  for(
    const category of categories
  ){

    const files =
      await getCategoryFiles(
        category
      );


    files
      .filter(
        file =>
          /\.(jpg|jpeg|png|webp|gif|avif)$/i
            .test(file.name)
      )
      .forEach(
        file => {

          const path =
            "laptop/" +
            category +
            "/" +
            file.name;


          const {
            data
          } =
          supabaseClient
            .storage
            .from(BUCKET)
            .getPublicUrl(
              path
            );


          wallpapers.push({

            name:
              category +
              " • " +
              file.name,

            url:
              data.publicUrl

          });

        }
      );

  }


  render(wallpapers);

}


/* =====================================
   RENDER
===================================== */

function render(list){

  const grid =
    document.getElementById(
      "grid"
    );


  const count =
    document.getElementById(
      "count"
    );


  grid.innerHTML = "";


  count.innerText =
    list.length +
    " Wallpapers";


  if(list.length === 0){

    grid.innerHTML = `

      <div class="empty">

        <h3>
          No laptop wallpapers found
        </h3>

        <p style="margin-top:8px;">
          Owner upload button se
          wallpapers add karo.
        </p>

      </div>

    `;

    return;

  }


  list.forEach(
    (wallpaper,index) => {

      const card =
        document.createElement(
          "div"
        );


      card.className =
        "card";


      card.innerHTML = `

        <img
          src="${wallpaper.url}"
          loading="lazy"
          alt="${wallpaper.name}"
        >

        <div class="info">

          <h3>
            Laptop Wallpaper ${index + 1}
          </h3>

          <div class="brand">
            WALLORA
          </div>

          <div class="owner">
            Deepak Paweria
          </div>

          <div class="actions">

            <button
              class="like"
              onclick="likeWallpaper(this)"
            >
              ❤️ <span>0</span>
            </button>

            <button
              class="comment"
              onclick="toggleComments(this)"
            >
              💬
            </button>

            <a
              class="download"
              href="${wallpaper.url}"
              download
            >
              Download
            </a>

          </div>


          <div class="comments">

            <input
              type="text"
              placeholder="Write a comment..."
            >

            <button
              onclick="addComment(this)"
            >
              Post
            </button>

            <div class="comment-list"></div>

          </div>

        </div>

      `;


      card
        .querySelector("img")
        .onclick =
        function(){

          openImage(
            wallpaper.url
          );

        };


      grid.appendChild(card);

    }
  );

}


/* =====================================
   SEARCH
===================================== */

function searchWallpaper(){

  const text =
    document
      .getElementById("search")
      .value
      .toLowerCase()
      .trim();


  const filtered =
    wallpapers.filter(
      wallpaper =>
        wallpaper.name
          .toLowerCase()
          .includes(text)
    );


  render(filtered);

}


/* =====================================
   IMAGE VIEWER
===================================== */

function openImage(url){

  document
    .getElementById(
      "fullImage"
    )
    .src = url;


  document
    .getElementById(
      "imageViewer"
    )
    .classList
    .add("show");

}


function closeImage(event){

  if(event){

    event.stopPropagation();

  }


  document
    .getElementById(
      "imageViewer"
    )
    .classList
    .remove("show");


  document
    .getElementById(
      "fullImage"
    )
    .src = "";

}


/* =====================================
   ESC KEY
===================================== */

document.addEventListener(
  "keydown",
  function(event){

    if(
      event.key === "Escape"
    ){

      closeImage();

      closeUpload();

    }

  }
);


/* =====================================
   LIKE
===================================== */

function likeWallpaper(button){

  const number =
    button.querySelector(
      "span"
    );


  let value =
    parseInt(
      number.innerText
    );


  if(
    button
      .classList
      .contains("liked")
  ){

    value--;

    button
      .classList
      .remove("liked");

  }else{

    value++;

    button
      .classList
      .add("liked");

  }


  number.innerText =
    value;

}


/* =====================================
   COMMENTS
===================================== */

function toggleComments(button){

  const area =
    button
      .closest(".info")
      .querySelector(
        ".comments"
      );


  area
    .classList
    .toggle("show");

}


function addComment(button){

  const area =
    button.closest(
      ".comments"
    );


  const input =
    area.querySelector(
      "input"
    );


  const list =
    area.querySelector(
      ".comment-list"
    );


  const text =
    input.value.trim();


  if(!text)return;


  const div =
    document.createElement(
      "div"
    );


  div.innerText =
    "💬 " + text;


  list.appendChild(
    div
  );


  input.value = "";

}


/* =====================================
   START
===================================== */

document.addEventListener(
  "DOMContentLoaded",
  function(){

    applyTheme(
      getWalloraTheme()
    );

    checkOwner();

    loadWallpapers();

  }
);


/* =====================================
   AUTH CHANGE
===================================== */

supabaseClient
  .auth
  .onAuthStateChange(
    function(){

      checkOwner();

    }
  );
