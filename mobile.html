<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wallora - Mobile Wallpapers</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}

:root{
--bg:#070812;
--card:#101321;
--card2:#171b30;
--text:#fff;
--muted:#9299b5;
--border:#292f4b;
--purple:#7c5cff;
--blue:#00c8ff;
--gold:#ffc857
}

body{
font-family:Arial,Helvetica,sans-serif;
background:
radial-gradient(circle at 10% 5%,#38218a55,transparent 30%),
radial-gradient(circle at 90% 15%,#006f9250,transparent 28%),
var(--bg);
color:var(--text);
min-height:100vh
}

header{
position:sticky;
top:0;
z-index:1000;
height:70px;
padding:0 5%;
display:flex;
align-items:center;
justify-content:space-between;
background:#080a14dd;
backdrop-filter:blur(18px);
border-bottom:1px solid var(--border)
}

.logo{
font-size:27px;
font-weight:900
}

.logo span,
.hero h1 span{
background:linear-gradient(90deg,var(--purple),var(--blue),var(--gold));
-webkit-background-clip:text;
color:transparent
}

.header-right{
display:flex;
gap:8px;
align-items:center
}

.back,
.login-btn{
padding:10px 13px;
border-radius:12px;
border:1px solid var(--border);
color:white;
text-decoration:none;
font-size:12px;
cursor:pointer
}

.back{background:var(--card)}

.login-btn{
background:linear-gradient(90deg,var(--purple),var(--blue));
font-weight:bold
}

.hero{
text-align:center;
padding:55px 20px 30px
}

.hero h1{
font-size:46px;
font-weight:900
}

.hero p{
margin-top:10px;
color:var(--muted);
font-size:14px
}

.login-panel,
.upload-panel,
.image-viewer{
position:fixed;
inset:0;
z-index:7000;
display:none;
align-items:center;
justify-content:center;
padding:20px;
background:#000d;
backdrop-filter:blur(10px)
}

.login-panel.show,
.upload-panel.show,
.image-viewer.show{
display:flex
}

.login-box,
.upload-box{
width:100%;
max-width:430px;
padding:25px;
border-radius:24px;
background:linear-gradient(145deg,var(--card),var(--card2));
border:1px solid var(--border);
box-shadow:0 25px 80px #000b
}

.login-close,
.upload-close{
float:right;
width:35px;
height:35px;
border:0;
border-radius:50%;
background:#252a40;
color:white;
font-size:22px;
cursor:pointer
}

.login-box h2,
.upload-box h2{
margin-bottom:10px
}

.login-box p{
color:var(--muted);
font-size:13px;
margin-bottom:18px
}

.login-box input,
.upload-box input,
.upload-box select{
width:100%;
padding:13px;
margin-top:10px;
border-radius:11px;
border:1px solid var(--border);
background:var(--bg);
color:white;
outline:none
}

.login-submit,
.upload-submit{
width:100%;
margin-top:18px;
padding:14px;
border:0;
border-radius:12px;
background:linear-gradient(90deg,var(--purple),var(--blue));
color:white;
font-weight:bold;
cursor:pointer
}

#loginStatus,
.upload-status{
text-align:center;
margin-top:12px;
font-size:13px;
color:var(--muted);
min-height:18px
}

.upload-btn{
position:fixed;
right:22px;
bottom:25px;
z-index:4000;
width:62px;
height:62px;
border:0;
border-radius:50%;
background:linear-gradient(135deg,var(--purple),var(--blue));
color:white;
font-size:32px;
font-weight:bold;
cursor:pointer;
box-shadow:0 12px 35px #0009;
display:none
}

.upload-btn.show{
display:block
}

.upload-box label{
display:block;
margin-top:15px;
margin-bottom:5px;
font-size:13px;
color:var(--muted)
}

.category-section{
padding:20px 6% 35px
}

.category-title{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:15px
}

.category-title h2{
font-size:23px
}

.category-title span{
color:var(--muted);
font-size:12px
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
gap:18px
}

.card{
background:linear-gradient(145deg,var(--card),var(--card2));
border:1px solid var(--border);
border-radius:18px;
overflow:hidden;
box-shadow:0 10px 30px #0006;
transition:.35s
}

.card:hover{
transform:translateY(-6px);
border-color:var(--purple)
}

.card img{
width:100%;
height:280px;
object-fit:cover;
display:block;
cursor:pointer
}

.info{
padding:12px
}

.info h3{
font-size:14px;
margin-bottom:5px
}

.brand{
font-size:10px;
font-weight:bold;
color:var(--gold);
letter-spacing:1.5px
}

.owner{
font-size:10px;
color:var(--muted);
margin:4px 0 11px
}

.actions{
display:flex;
gap:7px
}

.like,
.comment{
border:0;
border-radius:9px;
padding:9px 11px;
background:#252a40;
color:white;
cursor:pointer
}

.like.liked{
background:#e53935
}

.download{
flex:1;
padding:9px;
border-radius:9px;
background:linear-gradient(90deg,var(--purple),var(--blue));
color:white;
text-decoration:none;
text-align:center;
font-size:12px;
font-weight:bold
}

.empty{
padding:30px;
color:var(--muted);
text-align:center;
grid-column:1/-1
}

.image-viewer{
z-index:8000
}

.image-viewer img{
max-width:100%;
max-height:92vh;
object-fit:contain;
border-radius:10px
}

.close-viewer{
position:absolute;
top:18px;
right:22px;
width:45px;
height:45px;
border:0;
border-radius:50%;
background:#222;
color:white;
font-size:28px;
cursor:pointer
}

footer{
margin-top:30px;
padding:40px 20px;
text-align:center;
border-top:1px solid var(--border);
color:var(--muted)
}

.footer-logo{
font-size:22px;
font-weight:900;
margin-bottom:7px
}

.footer-logo span{
color:var(--purple)
}

footer strong{
color:var(--gold)
}

@media(max-width:700px){

header{
padding:0 4%
}

.logo{
font-size:23px
}

.back,
.login-btn{
padding:9px;
font-size:11px
}

.hero h1{
font-size:38px
}

.category-section{
padding:15px 4% 30px
}

.grid{
grid-template-columns:repeat(2,1fr);
gap:12px
}

.card img{
height:230px
}

}

@media(max-width:380px){

.grid{
grid-template-columns:1fr
}

.card img{
height:350px
}

}
</style>
</head>

<body>

<!-- IMAGE VIEWER -->
<div class="image-viewer" id="imageViewer" onclick="closeImage()">
<button class="close-viewer" onclick="closeImage(event)">×</button>
<img id="fullImage" src="" alt="Wallpaper">
</div>

<!-- HEADER -->
<header>
<div class="logo">
Wall<span>ora</span>
</div>
<div class="header-right">
<a href="index.html" class="back">← Home</a>
<button class="login-btn" id="loginButton" onclick="openLogin()">🔐 Login</button>
</div>
</header>

<!-- LOGIN -->
<div class="login-panel" id="loginPanel">
<div class="login-box">
<button class="login-close" onclick="closeLogin()">×</button>
<h2>Wallora Owner Login</h2>
<p>Only Wallora owner can upload wallpapers.</p>
<input type="email" id="loginEmail" placeholder="Owner Email">
<input type="password" id="loginPassword" placeholder="Password">
<button class="login-submit" onclick="ownerLogin()">Login</button>
<div id="loginStatus"></div>
</div>
</div>

<!-- HERO -->
<section class="hero">
<h1>Mobile <span>Wallpapers</span></h1>
<p>Explore premium wallpapers for your phone</p>
</section>

<!-- WALLPAPERS -->
<div id="mobileContainer"></div>

<!-- OWNER UPLOAD BUTTON -->
<button class="upload-btn" id="ownerUploadButton" onclick="openUpload()" title="Upload Wallpaper">+</button>

<!-- UPLOAD -->
<div class="upload-panel" id="uploadPanel">
<div class="upload-box">
<button class="upload-close" onclick="closeUpload()">×</button>
<h2>Upload Wallpaper</h2>
<label>Wallpaper</label>
<input type="file" id="wallpaperFile" accept="image/*">
<label>Category</label>
<select id="wallpaperCategory">
<option value="cartoon">🎨 Cartoon</option>
<option value="anime">👾 Anime</option>
<option value="dark">🖤 Dark</option>
<option value="nature">🌿 Nature</option>
<option value="cars">🚗 Cars</option>
<option value="bike">🏍️ Bike</option>
<option value="abstract">🌌 Abstract</option>
<option value="gaming">🎮 Gaming</option>
<option value="minimal">🤍 Minimal</option>
<option value="3d">🔷 3D</option>
</select>
<button class="upload-submit" id="uploadButton" onclick="uploadWallpaper()">Upload Wallpaper</button>
<div class="upload-status" id="uploadStatus"></div>
</div>
</div>

<!-- FOOTER -->
<footer>
<div class="footer-logo">Wall<span>ora</span></div>
<p>Premium Mobile Wallpapers</p>
<p style="margin-top:8px;">© 2026 Wallora • Created by <strong>Deepak Paweria</strong></p>
</footer>

<script>
const SUPABASE_URL = "https://frsdscguevzqqkzbwxxy.supabase.co";
const SUPABASE_KEY = "sb_publishable_fzXOjFFKz_QXtZagfGXpEA_xgf1cZfN";

/* Bucket name set to 'wallpapers' (Make sure your Supabase bucket name is also 'wallpapers') */
const STORAGE_BUCKET = "wallpapers";

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
});

const GITHUB_USER = "goldenmarry73916-cmyk";
const GITHUB_REPO = "goldenmarry73916-cmyk.github.io";
const BRANCH = "main";

const OWNER_ID = "7c9261f0-a096-482f-acd7-14af34bade15";

const categories = [
  ["cartoon","🎨","Cartoon"],
  ["anime","👾","Anime"],
  ["dark","🖤","Dark"],
  ["nature","🌿","Nature"],
  ["cars","🚗","Cars"],
  ["bike","🏍️","Bike"],
  ["abstract","🌌","Abstract"],
  ["gaming","🎮","Gaming"],
  ["minimal","🤍","Minimal"],
  ["3d","🔷","3D"]
];

function timeoutPromise(promise, milliseconds){
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => reject(new Error("Request timeout")), milliseconds))
  ]);
}

function openLogin(){ document.getElementById("loginPanel").classList.add("show"); }
function closeLogin(){ document.getElementById("loginPanel").classList.remove("show"); }

async function ownerLogin(){
  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value;
  const status = document.getElementById("loginStatus");

  if(!email || !password){
    status.innerText = "Email aur password dono bharo.";
    return;
  }

  status.innerText = "Logging in...";

  try{
    const result = await timeoutPromise(
      supabaseClient.auth.signInWithPassword({ email: email, password: password }),
      10000
    );

    if(result.error){
      status.innerText = "Login failed: " + result.error.message;
      return;
    }

    const user = result.data?.user;
    if(!user){
      status.innerText = "Login failed.";
      return;
    }

    if(user.id !== OWNER_ID){
      await supabaseClient.auth.signOut();
      status.innerText = "Ye Wallora owner account nahi hai.";
      return;
    }

    status.innerText = "✅ Owner login successful!";
    updateOwnerUI(user);
    setTimeout(() => { closeLogin(); }, 800);
  }catch(error){
    console.log(error);
    status.innerText = "Login failed. Please try again.";
  }
}

function updateOwnerUI(user){
  const uploadButton = document.getElementById("ownerUploadButton");
  const loginButton = document.getElementById("loginButton");

  if(user && user.id === OWNER_ID){
    uploadButton.classList.add("show");
    loginButton.innerText = "✅ Owner";
  }else{
    uploadButton.classList.remove("show");
    loginButton.innerText = "🔐 Login";
  }
}

async function checkOwner(){
  try{
    const result = await timeoutPromise(supabaseClient.auth.getSession(), 5000);
    const session = result.data?.session;
    if(!session){
      return { ok: false, message: "Please login as Wallora owner first." };
    }
    const user = session.user;
    if(user.id !== OWNER_ID){
      return { ok: false, message: "You are not the Wallora owner." };
    }
    return { ok: true, user: user };
  }catch(error){
    console.log(error);
    return { ok: false, message: "Login check failed." };
  }
}

async function initializeOwner(){
  const result = await checkOwner();
  if(result.ok){
    updateOwnerUI(result.user);
  }else{
    updateOwnerUI(null);
  }
}

supabaseClient.auth.onAuthStateChange(function(event, session){
  if(session?.user){
    updateOwnerUI(session.user);
  }else{
    updateOwnerUI(null);
  }
});

async function getFiles(path){
  const url = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${path}?ref=${BRANCH}`;
  try{
    const response = await timeoutPromise(fetch(url), 8000);
    if(!response.ok) return [];
    const data = await response.json();
    return Array.isArray(data) ? data : [];
  }catch(error){
    console.log(error);
    return [];
  }
}

function isImage(file){
  return file && file.type==="file" && /\.(jpg|jpeg|png|webp|gif|avif)$/i.test(file.name);
}

async function getSupabaseImages(category){
  try{
    const result = await timeoutPromise(
      supabaseClient.storage.from(STORAGE_BUCKET).list(`mobile/${category}`, {
        limit: 100,
        sort: { column: "created_at", order: "desc" }
      }),
      8000
    );

    if(result.error){
      console.log("Supabase bucket error:", result.error);
      return [];
    }

    return (result.data || [])
      .filter(file => file && file.name && /\.(jpg|jpeg|png|webp|gif|avif)$/i.test(file.name))
      .map(file => {
        const path = `mobile/${category}/${file.name}`;
        const publicResult = supabaseClient.storage.from(STORAGE_BUCKET).getPublicUrl(path);
        return { name: file.name, url: publicResult.data.publicUrl };
      });
  }catch(error){
    console.log("Storage error:", error);
    return [];
  }
}

function createCard(grid, url, name, title){
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `
    <img src="${url}" loading="lazy" alt="${title} wallpaper">
    <div class="info">
      <h3>${name}</h3>
      <div class="brand">WALLORA</div>
      <div class="owner">Deepak Paweria</div>
      <div class="actions">
        <button class="like" onclick="likeWallpaper(this)">❤️ <span>0</span></button>
        <button class="comment" onclick="alert('Comments coming soon')">💬</button>
        <a class="download" href="${url}" download>Download</a>
      </div>
    </div>
  `;
  const image = card.querySelector("img");
  image.addEventListener("click", () => openImage(url));
  grid.appendChild(card);
}

async function loadCategory(folder, icon, title){
  const section = document.createElement("section");
  section.className = "category-section";
  section.innerHTML = `
    <div class="category-title">
      <h2>${icon} ${title}</h2>
      <span>Loading...</span>
    </div>
    <div class="grid">
      <div class="empty">Loading wallpapers...</div>
    </div>
  `;
  document.getElementById("mobileContainer").appendChild(section);

  const grid = section.querySelector(".grid");
  const counter = section.querySelector(".category-title span");

  try{
    const results = await Promise.allSettled([
      getFiles("mobile/" + folder),
      getSupabaseImages(folder)
    ]);

    const githubFiles = results[0].status === "fulfilled" ? results[0].value : [];
    const supabaseImages = results[1].status === "fulfilled" ? results[1].value : [];
    const githubImages = githubFiles.filter(file => isImage(file));

    const allImages = [];

    githubImages.forEach((file, index) => {
      const url = `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/${BRANCH}/${file.path}`;
      allImages.push({ url: url, name: `${title} ${index+1}` });
    });

    supabaseImages.forEach(file => {
      allImages.push({ url: file.url, name: file.name });
    });

    counter.innerText = `${allImages.length} Wallpapers`;
    grid.innerHTML = "";

    if(allImages.length === 0){
      grid.innerHTML = `<div class="empty">No wallpapers available yet.</div>`;
      return;
    }

    allImages.forEach(image => {
      createCard(grid, image.url, image.name, title);
    });
  }catch(error){
    console.log(error);
    grid.innerHTML = `<div class="empty">Unable to load wallpapers.</div>`;
  }
}

async function loadAllCategories(){
  const container = document.getElementById("mobileContainer");
  container.innerHTML = "";
  for(const category of categories){
    await loadCategory(category[0], category[1], category[2]);
  }
}

async function openUpload(){
  const owner = await checkOwner();
  if(!owner.ok){
    alert("Please login as Wallora owner first.");
    return;
  }
  document.getElementById("uploadPanel").classList.add("show");
}

function closeUpload(){
  document.getElementById("uploadPanel").classList.remove("show");
}

async function uploadWallpaper(){
  const fileInput = document.getElementById("wallpaperFile");
  const category = document.getElementById("wallpaperCategory").value;
  const status = document.getElementById("uploadStatus");
  const button = document.getElementById("uploadButton");

  const file = fileInput.files[0];

  if(!file){
    status.innerText = "Please select a wallpaper.";
    return;
  }

  if(file.size > 15*1024*1024){
    status.innerText = "Image must be smaller than 15 MB.";
    return;
  }

  button.disabled = true;
  status.innerText = "Checking owner login...";

  try{
    const owner = await checkOwner();
    if(!owner.ok){
      status.innerText = owner.message;
      button.disabled = false;
      return;
    }

    let extension = file.name.split(".").pop().toLowerCase();
    if(extension === "jpeg"){
      extension = "jpg";
    }

    const fileName = `${Date.now()}-${Math.random().toString(36).substring(2,10)}.${extension}`;
    const path = `mobile/${category}/${fileName}`;

    status.innerText = "Uploading wallpaper...";

    const uploadResult = await timeoutPromise(
      supabaseClient.storage.from(STORAGE_BUCKET).upload(path, file, {
        contentType: file.type,
        upsert: false
      }),
      30000
    );

    if(uploadResult.error){
      console.log("UPLOAD ERROR:", uploadResult.error);
      status.innerText = "Upload failed: " + uploadResult.error.message;
      button.disabled = false;
      return;
    }

    status.innerText = "✅ Wallpaper uploaded successfully!";
    fileInput.value = "";

    setTimeout(() => {
      closeUpload();
      button.disabled = false;
      status.innerText = "";
      loadAllCategories();
    }, 1000);

  }catch(error){
    console.log("UPLOAD ERROR:", error);
    status.innerText = "Upload failed: " + (error.message || "Please try again.");
    button.disabled = false;
  }
}

function openImage(url){
  const viewer = document.getElementById("imageViewer");
  const image = document.getElementById("fullImage");
  image.src = url;
  viewer.classList.add("show");
}

function closeImage(event){
  if(event){
    event.stopPropagation();
  }
  const viewer = document.getElementById("imageViewer");
  const image = document.getElementById("fullImage");
  viewer.classList.remove("show");
  image.src = "";
}

// Initial load
initializeOwner();
loadAllCategories();
</script>

</body>
</html>
