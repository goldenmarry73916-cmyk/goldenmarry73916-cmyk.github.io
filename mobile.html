<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wallora - Mobile Wallpapers</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

:root{
  --bg:#070812;
  --card:#101321;
  --card2:#171b30;
  --text:#fff;
  --muted:#9299b5;
  --border:#292f4b;
  --purple:#7c5cff;
  --blue:#00c8ff;
  --gold:#ffc857;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:
    radial-gradient(circle at 10% 5%,#38218a55,transparent 30%),
    radial-gradient(circle at 90% 15%,#006f9250,transparent 28%),
    var(--bg);
  color:var(--text);
  min-height:100vh;
}

/* HEADER */

header{
  position:sticky;
  top:0;
  z-index:1000;
  height:70px;
  padding:0 5%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:#080a14dd;
  backdrop-filter:blur(18px);
  border-bottom:1px solid var(--border);
}

.logo{
  font-size:27px;
  font-weight:900;
}

.logo span{
  background:linear-gradient(90deg,var(--purple),var(--blue),var(--gold));
  -webkit-background-clip:text;
  color:transparent;
}

.back{
  padding:10px 15px;
  border-radius:12px;
  border:1px solid var(--border);
  background:var(--card);
  color:white;
  text-decoration:none;
  font-size:13px;
}

/* HERO */

.hero{
  text-align:center;
  padding:55px 20px 30px;
}

.hero h1{
  font-size:46px;
  font-weight:900;
}

.hero h1 span{
  background:linear-gradient(90deg,var(--purple),var(--blue));
  -webkit-background-clip:text;
  color:transparent;
}

.hero p{
  margin-top:10px;
  color:var(--muted);
  font-size:14px;
}

/* UPLOAD BUTTON */

.upload-btn{
  position:fixed;
  right:22px;
  bottom:25px;
  z-index:4000;

  width:62px;
  height:62px;

  border:0;
  border-radius:50%;

  background:linear-gradient(135deg,var(--purple),var(--blue));

  color:white;
  font-size:32px;
  font-weight:bold;

  cursor:pointer;

  box-shadow:0 12px 35px #0009;

  transition:.3s;
}

.upload-btn:hover{
  transform:scale(1.1) rotate(5deg);
}

/* UPLOAD PANEL */

.upload-panel{
  position:fixed;
  inset:0;
  z-index:6000;

  display:none;
  align-items:center;
  justify-content:center;

  padding:20px;

  background:#000c;
  backdrop-filter:blur(8px);
}

.upload-panel.show{
  display:flex;
}

.upload-box{
  width:100%;
  max-width:430px;

  background:linear-gradient(145deg,var(--card),var(--card2));

  border:1px solid var(--border);
  border-radius:24px;

  padding:25px;

  box-shadow:0 25px 80px #000b;

  animation:pop .25s ease;
}

@keyframes pop{
  from{
    opacity:0;
    transform:scale(.9);
  }
  to{
    opacity:1;
    transform:scale(1);
  }
}

.upload-box h2{
  margin-bottom:18px;
}

.upload-close{
  float:right;

  width:35px;
  height:35px;

  border:0;
  border-radius:50%;

  background:#252a40;
  color:white;

  font-size:22px;

  cursor:pointer;
}

.upload-box label{
  display:block;

  margin-top:15px;
  margin-bottom:7px;

  font-size:13px;
  color:var(--muted);
}

.upload-box input,
.upload-box select{
  width:100%;

  padding:13px;

  border-radius:11px;

  border:1px solid var(--border);

  background:var(--bg);
  color:white;

  outline:none;
}

.upload-submit{
  width:100%;

  margin-top:20px;

  padding:14px;

  border:0;
  border-radius:12px;

  background:linear-gradient(90deg,var(--purple),var(--blue));

  color:white;

  font-weight:bold;

  cursor:pointer;
}

.upload-status{
  margin-top:12px;

  font-size:12px;
  color:var(--muted);

  text-align:center;
}

/* CATEGORY */

.category-section{
  padding:20px 6% 35px;
}

.category-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:15px;
}

.category-title h2{
  font-size:23px;
}

.category-title span{
  color:var(--muted);
  font-size:12px;
}

/* GRID */

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
  gap:18px;
}

/* CARD */

.card{
  background:linear-gradient(145deg,var(--card),var(--card2));
  border:1px solid var(--border);
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 10px 30px #0006;
  transition:.35s;
}

.card:hover{
  transform:translateY(-6px);
  border-color:var(--purple);
  box-shadow:0 20px 45px #0009;
}

.card img{
  width:100%;
  height:280px;
  object-fit:cover;
  display:block;
  cursor:pointer;
  transition:.4s;
}

.card:hover img{
  transform:scale(1.04);
}

.info{
  padding:12px;
}

.info h3{
  font-size:14px;
  margin-bottom:5px;
}

.brand{
  font-size:10px;
  font-weight:bold;
  color:var(--gold);
  letter-spacing:1.5px;
}

.owner{
  font-size:10px;
  color:var(--muted);
  margin:4px 0 11px;
}

.actions{
  display:flex;
  gap:7px;
}

.like,
.comment{
  border:0;
  border-radius:9px;
  padding:9px 11px;
  background:#252a40;
  color:white;
  cursor:pointer;
}

.like.liked{
  background:#e53935;
}

.download{
  flex:1;
  padding:9px;
  border-radius:9px;
  background:linear-gradient(90deg,var(--purple),var(--blue));
  color:white;
  text-decoration:none;
  text-align:center;
  font-size:12px;
  font-weight:bold;
}

/* EMPTY */

.empty{
  padding:30px;
  color:var(--muted);
  text-align:center;
  grid-column:1/-1;
}

/* VIEWER */

.image-viewer{
  position:fixed;
  inset:0;
  z-index:5000;

  display:none;

  align-items:center;
  justify-content:center;

  padding:20px;

  background:#000f;
}

.image-viewer.show{
  display:flex;
}

.image-viewer img{
  max-width:100%;
  max-height:92vh;
  object-fit:contain;
  border-radius:10px;
}

.close-viewer{
  position:absolute;
  top:18px;
  right:22px;

  width:45px;
  height:45px;

  border:0;
  border-radius:50%;

  background:#222;
  color:white;

  font-size:28px;

  cursor:pointer;
}

/* FOOTER */

footer{
  margin-top:30px;
  padding:40px 20px;
  text-align:center;
  border-top:1px solid var(--border);
  color:var(--muted);
}

.footer-logo{
  font-size:22px;
  font-weight:900;
  margin-bottom:7px;
}

.footer-logo span{
  color:var(--purple);
}

footer strong{
  color:var(--gold);
}

/* MOBILE */

@media(max-width:700px){

  .hero h1{
    font-size:38px;
  }

  .category-section{
    padding:15px 4% 30px;
  }

  .grid{
    grid-template-columns:repeat(2,1fr);
    gap:12px;
  }

  .card img{
    height:230px;
  }

  .category-title h2{
    font-size:20px;
  }

}

@media(max-width:380px){

  .grid{
    grid-template-columns:1fr;
  }

  .card img{
    height:350px;
  }

}

</style>

</head>

<body>


<!-- IMAGE VIEWER -->

<div
  class="image-viewer"
  id="imageViewer"
  onclick="closeImage()"
>

<button
  class="close-viewer"
  onclick="closeImage(event)"
>
×
</button>

<img
  id="fullImage"
  src=""
  alt="Wallpaper"
>

</div>


<!-- HEADER -->

<header>

<div class="logo">
Wall<span>ora</span>
</div>

<a
  href="index.html"
  class="back"
>
← Home
</a>

</header>


<!-- HERO -->

<section class="hero">

<h1>
Mobile <span>Wallpapers</span>
</h1>

<p>
Explore premium wallpapers for your phone
</p>

</section>


<!-- WALLPAPERS -->

<div id="mobileContainer"></div>


<!-- OWNER UPLOAD BUTTON -->

<button
  class="upload-btn"
  onclick="openUpload()"
  title="Upload Wallpaper"
>
+
</button>


<!-- UPLOAD PANEL -->

<div
  class="upload-panel"
  id="uploadPanel"
>

<div class="upload-box">

<button
  class="upload-close"
  onclick="closeUpload()"
>
×
</button>

<h2>
Upload Wallpaper
</h2>

<label>
Wallpaper
</label>

<input
  type="file"
  id="wallpaperFile"
  accept="image/*"
>


<label>
Category
</label>

<select id="wallpaperCategory">

<option value="cartoon">
🎨 Cartoon
</option>

<option value="anime">
👾 Anime
</option>

<option value="dark">
🖤 Dark
</option>

<option value="nature">
🌿 Nature
</option>

<option value="cars">
🚗 Cars
</option>

<option value="bike">
🏍️ Bike
</option>

<option value="abstract">
🌌 Abstract
</option>

<option value="gaming">
🎮 Gaming
</option>

<option value="minimal">
🤍 Minimal
</option>

<option value="3d">
🔷 3D
</option>

</select>


<button
  class="upload-submit"
  onclick="uploadWallpaper()"
>
Upload Wallpaper
</button>


<div
  class="upload-status"
  id="uploadStatus"
>
</div>

</div>

</div>


<!-- FOOTER -->

<footer>

<div class="footer-logo">
Wall<span>ora</span>
</div>

<p>
Premium Mobile Wallpapers
</p>

<p style="margin-top:8px;">
© 2026 Wallora • Created by
<strong>Deepak Paweria</strong>
</p>

</footer>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://frsdscguevzqqkzbwxxy.supabase.co";

const SUPABASE_KEY =
"YOUR_PUBLISHABLE_KEY";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =====================================================
   GITHUB
===================================================== */

const GITHUB_USER =
"goldenmarry73916-cmyk";

const GITHUB_REPO =
"goldenmarry73916-cmyk.github.io";

const BRANCH =
"main";


/* =====================================================
   CATEGORIES
===================================================== */

const categories = [

["cartoon","🎨 Cartoon"],
["anime","👾 Anime"],
["dark","🖤 Dark"],
["nature","🌿 Nature"],
["cars","🚗 Cars"],
["bike","🏍️ Bike"],
["abstract","🌌 Abstract"],
["gaming","🎮 Gaming"],
["minimal","🤍 Minimal"],
["3d","🔷 3D"]

];


/* =====================================================
   GITHUB FILES
===================================================== */

async function getFiles(path){

const url =
`https://api.github.com/repos/`+
`${GITHUB_USER}/`+
`${GITHUB_REPO}/contents/`+
`${path}?ref=${BRANCH}`;

try{

const response =
await fetch(url);

if(!response.ok){

return [];

}

const data =
await response.json();

return Array.isArray(data)
? data
: [];

}catch(error){

console.log(error);

return [];

}

}


function isImage(file){

return file &&
file.type === "file" &&
/\.(jpg|jpeg|png|webp|gif|avif)$/i
.test(file.name);

}


/* =====================================================
   SUPABASE WALLPAPERS
===================================================== */

async function getSupabaseImages(category){

try{

const { data, error } =
await supabaseClient
.storage
.from("wallpapers")
.list(
  `mobile/${category}`,
  {
    limit:100,
    sort:{
      column:"created_at",
      order:"desc"
    }
  }
);

if(error){

console.log(error);

return [];

}

return (data || [])
.filter(file =>
  /\.(jpg|jpeg|png|webp|gif|avif)$/i
  .test(file.name)
)
.map(file => {

const path =
`mobile/${category}/${file.name}`;

const { data:urlData } =
supabaseClient
.storage
.from("wallpapers")
.getPublicUrl(path);

return {
  name:file.name,
  url:urlData.publicUrl
};

});

}catch(error){

console.log(error);

return [];

}

}


/* =====================================================
   LOAD CATEGORY
===================================================== */

async function loadCategory(
folder,
title,
icon
){

const githubFiles =
await getFiles(
"mobile/" + folder
);

const githubImages =
githubFiles.filter(
file => isImage(file)
);


/* SUPABASE */

const supabaseImages =
await getSupabaseImages(folder);


/* CREATE SECTION */

const section =
document.createElement("section");

section.className =
"category-section";

section.innerHTML = `

<div class="category-title">

<h2>
${icon} ${title}
</h2>

<span>
${githubImages.length + supabaseImages.length}
Wallpapers
</span>

</div>

<div class="grid"></div>

`;

const grid =
section.querySelector(".grid");


const allImages = [];


/* GITHUB */

githubImages.forEach(
(file,index)=>{

const url =
`https://raw.githubusercontent.com/`+
`${GITHUB_USER}/`+
`${GITHUB_REPO}/`+
`${BRANCH}/`+
`${file.path}`;

allImages.push({

url:url,
name:`${title} ${index+1}`

});

});


/* SUPABASE */

supabaseImages.forEach(
(file)=>{

allImages.push({

url:file.url,
name:file.name

});

});


if(allImages.length === 0){

grid.innerHTML = `

<div class="empty">
No wallpapers available yet.
</div>

`;

}else{

allImages.forEach(
(image,index)=>{

createCard(
grid,
image.url,
image.name,
title
);

});

}


document
.getElementById("mobileContainer")
.appendChild(section);

}


/* =====================================================
   CREATE CARD
===================================================== */

function createCard(
grid,
url,
name,
title
){

const card =
document.createElement("div");

card.className =
"card";

card.innerHTML = `

<img
src="${url}"
loading="lazy"
alt="${title} wallpaper"
>

<div class="info">

<h3>
${name}
</h3>

<div class="brand">
WALLORA
</div>

<div class="owner">
Deepak Paweria
</div>

<div class="actions">

<button
class="like"
onclick="likeWallpaper(this)"
>
❤️ <span>0</span>
</button>

<button
class="comment"
onclick="alert('Comments coming soon')"
>
💬
</button>

<a
class="download"
href="${url}"
download
>
Download
</a>

</div>

</div>

`;

const image =
card.querySelector("img");

image.addEventListener(
"click",
function(){

openImage(url);

});

grid.appendChild(card);

}


/* =====================================================
   LOAD ALL
===================================================== */

async function loadAllCategories(){

document
.getElementById("mobileContainer")
.innerHTML = "";

for(
const category
of categories
){

await loadCategory(
category[0],
category[1].substring(2),
category[1].substring(0,2)
);

}

}


/* =====================================================
   UPLOAD PANEL
===================================================== */

function openUpload(){

document
.getElementById("uploadPanel")
.classList
.add("show");

}

function closeUpload(){

document
.getElementById("uploadPanel")
.classList
.remove("show");

}


/* =====================================================
   UPLOAD
===================================================== */

async function uploadWallpaper(){

const file =
document
.getElementById("wallpaperFile")
.files[0];

const category =
document
.getElementById("wallpaperCategory")
.value;

const status =
document
.getElementById("uploadStatus");


if(!file){

status.innerText =
"Please select a wallpaper.";

return;

}


status.innerText =
"Checking owner login...";


/* CHECK USER */

const {
data:{
user
},
error:userError
} =
await supabaseClient
.auth
.getUser();


if(userError || !user){

status.innerText =
"Please login as Wallora owner first.";

return;

}


/* CHECK OWNER */

if(
user.id !==
"7c9261f0-a096-482f-acd7-14af34bade15"
){

status.innerText =
"You are not the Wallora owner.";

return;

}


/* FILE NAME */

const extension =
file.name
.split(".")
.pop()
.toLowerCase();

const fileName =
`${Date.now()}-${Math.random()
.toString(36)
.substring(2)}.${extension}`;


const path =
`mobile/${category}/${fileName}`;


/* UPLOAD */

status.innerText =
"Uploading wallpaper...";


const {
error
} =
await supabaseClient
.storage
.from("wallpapers")
.upload(
path,
file,
{
contentType:file.type,
upsert:false
}
);


if(error){

console.log(error);

status.innerText =
"Upload failed: " +
error.message;

return;

}


status.innerText =
"✅ Wallpaper uploaded successfully!";


document
.getElementById("wallpaperFile")
.value = "";


/* RELOAD */

setTimeout(
()=>{

closeUpload();

loadAllCategories();

},
800
);

}


/* =====================================================
   VIEWER
===================================================== */

function openImage(url){

const viewer =
document.getElementById(
"imageViewer"
);

const image =
document.getElementById(
"fullImage"
);

image.src = url;

viewer.classList
.add("show");

}


function closeImage(event){

if(event){

event.stopPropagation();

}

const viewer =
document.getElementById(
"imageViewer"
);

const image =
document.getElementById(
"fullImage"
);

viewer.classList
.remove("show");

image.src = "";

}


document.addEventListener(
"keydown",
function(event){

if(event.key === "Escape"){

closeImage();

}

});


/* =====================================================
   LIKE
===================================================== */

function likeWallpaper(button){

const number =
button.querySelector("span");

let value =
parseInt(
number.innerText
);

if(
button.classList
.contains("liked")
){

value--;

button.classList
.remove("liked");

}else{

value++;

button.classList
.add("liked");

}

number.innerText =
value;

}


/* =====================================================
   START
===================================================== */

loadAllCategories();

</script>

</body>
</html>
