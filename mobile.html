<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Wallora • Mobile Wallpapers</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

:root{
  --bg:#060711;
  --card:#0e1120;
  --card2:#171a2c;
  --text:#ffffff;
  --muted:#9299b5;
  --border:#292e49;
  --purple:#8066ff;
  --blue:#00cfff;
  --gold:#ffc857;
  --danger:#ff4d67;
}

body{
  font-family:Inter,Arial,Helvetica,sans-serif;
  background:
    radial-gradient(circle at 10% 0%,#6c45ff30,transparent 32%),
    radial-gradient(circle at 95% 10%,#00cfff20,transparent 30%),
    var(--bg);
  color:var(--text);
  min-height:100vh;
  transition:.3s ease;
}


/* LIGHT THEME */

body.light{
  --bg:#f5f7fc;
  --card:#ffffff;
  --card2:#eef1f8;
  --text:#151827;
  --muted:#687089;
  --border:#dfe3ed;

  background:
    radial-gradient(circle at 10% 0%,#8066ff18,transparent 32%),
    radial-gradient(circle at 95% 10%,#00cfff15,transparent 30%),
    var(--bg);
}

body.light header{
  background:#ffffffd9;
}

body.light .search input,
body.light .comments input,
body.light .upload-panel input,
body.light .upload-panel select{
  color:var(--text);
}

body.light .like,
body.light .comment{
  background:#e9ecf4;
  color:#171b30;
}

body.light .cancel{
  background:#e4e7ef;
  color:#171b30;
}


/* HEADER */

header{
  position:sticky;
  top:0;
  z-index:1000;

  height:72px;
  padding:0 5%;

  display:flex;
  align-items:center;
  justify-content:space-between;

  background:#070914d9;
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);

  border-bottom:1px solid var(--border);
}

.logo{
  font-size:28px;
  font-weight:900;
  letter-spacing:-1.4px;
}

.logo span{
  background:linear-gradient(
    90deg,
    var(--purple),
    var(--blue),
    var(--gold)
  );

  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.header-actions{
  display:flex;
  align-items:center;
  gap:8px;
}

.theme-btn,
.back,
.owner-btn{
  padding:10px 14px;

  border:1px solid var(--border);
  border-radius:13px;

  background:var(--card);
  color:var(--text);

  text-decoration:none;
  cursor:pointer;

  font-size:13px;

  transition:.25s;
}

.theme-btn:hover,
.back:hover{
  border-color:var(--purple);
  transform:translateY(-1px);
}

.theme-btn{
  width:44px;
  height:42px;
  padding:0;
  font-size:17px;
}

.owner-btn{
  background:linear-gradient(
    135deg,
    var(--purple),
    var(--blue)
  );

  border:0;
  color:white;
  font-weight:800;

  box-shadow:0 8px 25px #8066ff35;
}

.owner-btn:hover{
  transform:translateY(-2px);
  box-shadow:0 12px 30px #8066ff50;
}


/* HERO */

.hero{
  text-align:center;
  padding:65px 20px 38px;
}

.hero h1{
  font-size:50px;
  font-weight:950;
  letter-spacing:-2px;
  line-height:1.1;
}

.hero h1 span{
  background:linear-gradient(
    90deg,
    var(--purple),
    var(--blue)
  );

  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.hero p{
  margin-top:13px;
  color:var(--muted);
  font-size:14px;
  letter-spacing:.2px;
}


/* SEARCH */

.search{
  max-width:650px;
  margin:27px auto 0;
}

.search input{
  width:100%;

  padding:17px 23px;

  border-radius:30px;
  border:1px solid var(--border);

  background:var(--card);
  color:var(--text);

  outline:none;
  font-size:15px;

  box-shadow:0 12px 35px #0003;

  transition:.25s;
}

.search input:focus{
  border-color:var(--purple);
  box-shadow:
    0 0 0 3px #8066ff18,
    0 15px 40px #0004;
}


/* GALLERY */

.gallery{
  padding:22px 6% 65px;
}

.gallery-head{
  display:flex;
  align-items:center;
  justify-content:space-between;

  margin-bottom:21px;
}

.gallery-head h2{
  font-size:24px;
  font-weight:850;
}

.gallery-head span{
  color:var(--muted);
  font-size:13px;
}


/* GRID */

.grid{
  display:grid;

  grid-template-columns:
    repeat(auto-fill,minmax(190px,1fr));

  gap:18px;
}


/* CARD */

.card{
  position:relative;

  background:
    linear-gradient(
      145deg,
      var(--card),
      var(--card2)
    );

  border:1px solid var(--border);
  border-radius:20px;

  overflow:hidden;

  box-shadow:
    0 12px 35px #0005,
    inset 0 1px #ffffff08;

  transition:.3s ease;
}

.card:hover{
  transform:translateY(-6px);

  border-color:#8066ff88;

  box-shadow:
    0 22px 50px #0008,
    0 0 25px #8066ff12;
}

.card img{
  width:100%;
  height:280px;

  object-fit:cover;

  display:block;
  cursor:pointer;

  transition:.4s ease;
}

.card:hover img{
  transform:scale(1.035);
}


/* CARD INFO */

.info{
  padding:14px;
}

.info h3{
  font-size:14px;
  margin-bottom:7px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.brand{
  font-size:10px;
  color:var(--gold);

  font-weight:900;
  letter-spacing:1.7px;
}

.owner{
  font-size:11px;
  color:var(--muted);

  margin:5px 0 12px;
}


/* ACTIONS */

.actions{
  display:flex;
  gap:7px;
}

.like,
.comment{
  border:0;
  border-radius:10px;

  padding:9px 11px;

  background:#252a40;
  color:white;

  cursor:pointer;

  transition:.2s;
}

.like:hover,
.comment:hover{
  transform:translateY(-2px);
}

.like.liked{
  background:var(--danger);
  box-shadow:0 5px 15px #ff4d6735;
}

.download{
  flex:1;

  padding:9px;

  border-radius:10px;

  background:linear-gradient(
    90deg,
    var(--purple),
    var(--blue)
  );

  color:white;

  text-align:center;
  text-decoration:none;

  font-size:12px;
  font-weight:800;

  transition:.2s;
}

.download:hover{
  transform:translateY(-2px);
}


/* COMMENTS */

.comments{
  display:none;
  margin-top:11px;
}

.comments.show{
  display:block;
}

.comments input{
  width:100%;

  padding:10px;

  border:1px solid var(--border);
  border-radius:9px;

  background:var(--bg);
  color:var(--text);

  outline:none;
}

.comments input:focus{
  border-color:var(--purple);
}

.comments button{
  margin-top:6px;

  padding:8px 13px;

  border:0;
  border-radius:8px;

  background:var(--gold);

  cursor:pointer;
  font-weight:bold;
}

.comment-list{
  margin-top:8px;

  font-size:12px;
  color:var(--muted);
}

.comment-list div{
  padding:6px 0;
  border-bottom:1px solid var(--border);
}


/* EMPTY */

.empty{
  grid-column:1/-1;

  text-align:center;
  padding:70px 20px;

  color:var(--muted);
}

.empty h3{
  color:var(--text);
  margin-bottom:7px;
}


/* IMAGE VIEWER */

.image-viewer{
  position:fixed;
  inset:0;

  z-index:5000;

  display:none;

  align-items:center;
  justify-content:center;

  padding:20px;

  background:#000f;
  backdrop-filter:blur(10px);
}

.image-viewer.show{
  display:flex;
}

.image-viewer img{
  max-width:100%;
  max-height:92vh;

  object-fit:contain;

  border-radius:12px;

  box-shadow:0 25px 80px #000;
}

.close-viewer{
  position:absolute;

  top:18px;
  right:22px;

  width:45px;
  height:45px;

  border:0;
  border-radius:50%;

  background:#222b;
  color:white;

  font-size:28px;

  cursor:pointer;
}


/* UPLOAD */

.upload-box{
  position:fixed;
  inset:0;

  z-index:6000;

  display:none;

  align-items:center;
  justify-content:center;

  padding:20px;

  background:#000c;
  backdrop-filter:blur(12px);
}

.upload-box.show{
  display:flex;
}

.upload-panel{
  width:100%;
  max-width:450px;

  padding:27px;

  border-radius:23px;

  background:
    linear-gradient(
      145deg,
      var(--card),
      var(--card2)
    );

  border:1px solid var(--border);

  box-shadow:0 30px 90px #000;

  animation:uploadIn .25s ease;
}

@keyframes uploadIn{
  from{
    opacity:0;
    transform:translateY(15px) scale(.97);
  }
  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}

.upload-panel h2{
  margin-bottom:18px;
  font-size:21px;
}

.upload-panel input,
.upload-panel select{
  width:100%;

  padding:13px;

  margin-top:10px;

  border-radius:11px;

  border:1px solid var(--border);

  background:var(--bg);
  color:var(--text);

  outline:none;
}

.upload-panel input:focus,
.upload-panel select:focus{
  border-color:var(--purple);
}

.upload-actions{
  display:flex;
  gap:10px;
  margin-top:16px;
}

.upload-actions button{
  flex:1;

  padding:13px;

  border:0;
  border-radius:11px;

  cursor:pointer;

  font-weight:bold;
}

.upload{
  background:linear-gradient(
    90deg,
    var(--purple),
    var(--blue)
  );

  color:white;
}

.cancel{
  background:#292f4b;
  color:white;
}

#uploadStatus{
  margin-top:13px;

  color:var(--muted);
  font-size:13px;
  line-height:1.4;
}


/* FOOTER */

footer{
  padding:42px 20px;

  text-align:center;

  border-top:1px solid var(--border);

  color:var(--muted);
}

.footer-logo{
  font-size:23px;
  font-weight:900;

  margin-bottom:8px;
}

.footer-logo span{
  color:var(--purple);
}

footer strong{
  color:var(--gold);
}


/* MOBILE */

@media(max-width:700px){

  header{
    padding:0 4%;
  }

  .hero{
    padding:47px 18px 31px;
  }

  .hero h1{
    font-size:38px;
  }

  .gallery{
    padding:15px 4% 45px;
  }

  .grid{
    grid-template-columns:repeat(2,1fr);
    gap:12px;
  }

  .card img{
    height:250px;
  }

  .back{
    display:none;
  }

  .owner-btn{
    padding:9px 11px;
  }

  .gallery-head h2{
    font-size:20px;
  }

}

@media(max-width:380px){

  .grid{
    grid-template-columns:1fr;
  }

  .card img{
    height:380px;
  }

}

</style>
</head>


<body>


<!-- IMAGE VIEWER -->

<div
  class="image-viewer"
  id="imageViewer"
  onclick="closeImage(event)"
>

  <button
    class="close-viewer"
    onclick="closeImage(event)"
  >
    ×
  </button>

  <img
    id="fullImage"
    src=""
    alt="Mobile Wallpaper"
  >

</div>


<!-- UPLOAD -->

<div
  class="upload-box"
  id="uploadBox"
>

  <div class="upload-panel">

    <h2>➕ Upload Mobile Wallpaper</h2>

    <input
      type="file"
      id="wallpaperFile"
      accept="image/*"
    >

    <select id="wallpaperCategory">

      <option value="cartoon">Cartoon</option>

      <option value="nature">Nature</option>
      <option value="cars">Cars</option>
      <option value="bike">Bike</option>
      <option value="abstract">Abstract</option>
      <option value="gaming">Gaming</option>
      <option value="minimal">Minimal</option>
      <option value="3d">3D</option>

    </select>

    <div class="upload-actions">

      <button
        class="cancel"
        onclick="closeUpload()"
      >
        Cancel
      </button>

      <button
        class="upload"
        id="uploadButton"
        onclick="uploadWallpaper()"
      >
        Upload
      </button>

    </div>

    <div id="uploadStatus"></div>

  </div>

</div>


<!-- HEADER -->

<header>

  <div class="logo">
    Wall<span>ora</span>
  </div>

  <div class="header-actions">

    <button
      class="theme-btn"
      id="themeButton"
      onclick="toggleTheme()"
      title="Change Theme"
    >
      🌙
    </button>

    <button
      class="owner-btn"
      id="ownerButton"
      onclick="openUpload()"
      style="display:none;"
    >
      ＋ Upload
    </button>

    <a
      href="index.html"
      class="back"
    >
      ← Home
    </a>

  </div>

</header>


<!-- HERO -->

<section class="hero">

  <h1>
    Mobile <span>Wallpapers</span>
  </h1>

  <p>
    Premium HD wallpapers made for your phone
  </p>

  <div class="search">

    <input
      id="search"
      type="text"
      placeholder="🔍 Search mobile wallpapers..."
      oninput="searchWallpaper()"
    >

  </div>

</section>


<!-- GALLERY -->

<section class="gallery">

  <div class="gallery-head">

    <h2>
      📱 Mobile Wallpapers
    </h2>

    <span id="count">
      Loading...
    </span>

  </div>

  <div
    class="grid"
    id="grid"
  >

    <div class="empty">
      Loading wallpapers...
    </div>

  </div>

</section>


<!-- FOOTER -->

<footer>

  <div class="footer-logo">
    Wall<span>ora</span>
  </div>

  <p>
    Premium Mobile Wallpapers
  </p>

  <p style="margin-top:8px;">
    © 2026 Wallora • Created by
    <strong>Deepak Paweria</strong>
  </p>

</footer>


<script>

/* =====================================
   SUPABASE
===================================== */

const SUPABASE_URL =
"https://frsdscguevzqqkzbwxxy.supabase.co";

const SUPABASE_KEY =
"sb_publishable_fzXOjFFKz_QXtZagfGXpEA_xgf1cZfN";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =====================================
   CLOUDINARY
===================================== */

const CLOUDINARY_CLOUD_NAME =
"igtv8px2";

const CLOUDINARY_UPLOAD_PRESET =
"wallora_upload";


/* =====================================
   OWNER
===================================== */

const OWNER_UID =
"7c9261f0-a096-482f-acd7-14af34bade15";


/* =====================================
   THEME
===================================== */

const WALLORA_THEME_KEY =
"wallora-theme";


function getWalloraTheme(){

  const saved =
    localStorage.getItem(
      WALLORA_THEME_KEY
    );

  return saved === "light"
    ? "light"
    : "dark";

}


function applyTheme(theme){

  document.body.classList.toggle(
    "light",
    theme === "light"
  );

  const button =
    document.getElementById(
      "themeButton"
    );

  if(button){

    button.innerText =
      theme === "light"
        ? "☀️"
        : "🌙";

  }

}


function toggleTheme(){

  const current =
    getWalloraTheme();

  const newTheme =
    current === "light"
      ? "dark"
      : "light";

  localStorage.setItem(
    WALLORA_THEME_KEY,
    newTheme
  );

  applyTheme(newTheme);

}


/* =====================================
   THEME SYNC
===================================== */

window.addEventListener(
  "storage",
  function(event){

    if(
      event.key ===
      WALLORA_THEME_KEY
    ){

      applyTheme(
        event.newValue === "light"
          ? "light"
          : "dark"
      );

    }

  }
);


document.addEventListener(
  "visibilitychange",
  function(){

    if(!document.hidden){

      applyTheme(
        getWalloraTheme()
      );

    }

  }
);


window.addEventListener(
  "focus",
  function(){

    applyTheme(
      getWalloraTheme()
    );

  }
);


/* =====================================
   DATA
===================================== */

let wallpapers = [];


/* =====================================
   CHECK OWNER
===================================== */

async function checkOwner(){

  const {
    data
  } =
  await supabaseClient
    .auth
    .getUser();

  const button =
    document.getElementById(
      "ownerButton"
    );

  if(
    data &&
    data.user &&
    data.user.id === OWNER_UID
  ){

    button.style.display =
      "block";

  }else{

    button.style.display =
      "none";

  }

}


/* =====================================
   OPEN UPLOAD
===================================== */

async function openUpload(){

  const {
    data
  } =
  await supabaseClient
    .auth
    .getUser();

  if(
    !data.user ||
    data.user.id !== OWNER_UID
  ){

    alert(
      "Only Wallora owner can upload."
    );

    return;

  }

  document
    .getElementById("uploadBox")
    .classList
    .add("show");

}


/* =====================================
   CLOSE UPLOAD
===================================== */

function closeUpload(){

  document
    .getElementById("uploadBox")
    .classList
    .remove("show");

  document
    .getElementById("uploadStatus")
    .innerText = "";

}


/* =====================================
   UPLOAD TO CLOUDINARY
===================================== */

async function uploadWallpaper(){

  const file =
    document
      .getElementById(
        "wallpaperFile"
      )
      .files[0];

  const category =
    document
      .getElementById(
        "wallpaperCategory"
      )
      .value;

  const status =
    document
      .getElementById(
        "uploadStatus"
      );

  const uploadButton =
    document
      .getElementById(
        "uploadButton"
      );


  if(!file){

    status.innerText =
      "Please select a wallpaper.";

    return;

  }


  if(
    !file.type.startsWith("image/")
  ){

    status.innerText =
      "Only image files are allowed.";

    return;

  }


  if(
    file.size >
    15 * 1024 * 1024
  ){

    status.innerText =
      "Maximum file size is 15 MB.";

    return;

  }


  /* OWNER CHECK */

  const {
    data
  } =
  await supabaseClient
    .auth
    .getUser();


  if(
    !data.user ||
    data.user.id !== OWNER_UID
  ){

    status.innerText =
      "Only Wallora owner can upload.";

    return;

  }


  uploadButton.disabled = true;
  uploadButton.innerText = "Uploading...";

  status.innerText =
    "Uploading wallpaper...";


  try{

    /* CLOUDINARY */

    const formData =
      new FormData();

    formData.append(
      "file",
      file
    );

    formData.append(
      "upload_preset",
      CLOUDINARY_UPLOAD_PRESET
    );

    formData.append(
      "folder",
      "wallora/mobile/" + category
    );


    const response =
      await fetch(
        "https://api.cloudinary.com/v1_1/" +
        CLOUDINARY_CLOUD_NAME +
        "/image/upload",
        {
          method:"POST",
          body:formData
        }
      );


    const result =
      await response.json();


    if(
      !response.ok ||
      !result.secure_url
    ){

      console.error(result);

      throw new Error(
        result.error?.message ||
        "Cloudinary upload failed."
      );

    }


    status.innerText =
      "Saving wallpaper...";


    /* SAVE URL IN SUPABASE DATABASE */

    const {
      error
    } =
    await supabaseClient
      .from("wallpapers")
      .insert({

        name:file.name,

        category:category,

        url:result.secure_url

      });


    if(error){

      console.error(error);

      throw new Error(
        "Wallpaper uploaded but database save failed: " +
        error.message
      );

    }


    status.innerText =
      "✅ Wallpaper uploaded successfully!";


    document
      .getElementById(
        "wallpaperFile"
      )
      .value = "";


    setTimeout(
      function(){

        closeUpload();

        loadWallpapers();

      },
      1000
    );


  }catch(error){

    console.error(error);

    status.innerText =
      "❌ " + error.message;

  }


  uploadButton.disabled = false;
  uploadButton.innerText = "Upload";

}


/* =====================================
   LOAD WALLPAPERS FROM DATABASE
===================================== */

async function loadWallpapers(){

  const grid =
    document.getElementById(
      "grid"
    );

  const count =
    document.getElementById(
      "count"
    );


  grid.innerHTML = `

    <div class="empty">

      <h3>Loading wallpapers...</h3>

      <p style="margin-top:8px;">
        Please wait
      </p>

    </div>

  `;


  const {
    data,
    error
  } =
  await supabaseClient
    .from("wallpapers")
    .select("*")
    .order(
      "created_at",
      {
        ascending:false
      }
    );


  if(error){

    console.error(error);

    grid.innerHTML = `

      <div class="empty">

        <h3>Unable to load wallpapers</h3>

        <p style="margin-top:8px;">
          ${escapeHTML(error.message)}
        </p>

      </div>

    `;

    count.innerText =
      "Error";

    return;

  }


  wallpapers =
    (data || []).map(
      item => ({

        id:item.id,

        name:item.name,

        category:item.category,

        url:item.url

      })
    );


  render(
    wallpapers
  );

}


/* =====================================
   SEARCH
===================================== */

function searchWallpaper(){

  const text =
    document
      .getElementById("search")
      .value
      .toLowerCase()
      .trim();


  const filtered =
    wallpapers.filter(
      wallpaper =>

        (
          wallpaper.name +
          " " +
          wallpaper.category
        )
        .toLowerCase()
        .includes(text)

    );


  render(filtered);

}


/* =====================================
   ESCAPE HTML
===================================== */

function escapeHTML(text){

  return String(text || "")
    .replace(
      /[&<>"']/g,
      function(char){

        const map = {

          "&":"&amp;",
          "<":"&lt;",
          ">":"&gt;",
          '"':"&quot;",
          "'":"&#039;"

        };

        return map[char];

      }
    );

}


/* =====================================
   RENDER
===================================== */

function render(list){

  const grid =
    document.getElementById(
      "grid"
    );

  const count =
    document.getElementById(
      "count"
    );


  grid.innerHTML = "";

  count.innerText =
    list.length +
    " Wallpapers";


  if(list.length === 0){

    grid.innerHTML = `

      <div class="empty">

        <h3>
          No mobile wallpapers found
        </h3>

        <p style="margin-top:8px;">
          Upload a wallpaper to see it here.
        </p>

      </div>

    `;

    return;

  }


  list.forEach(
    (wallpaper,index) => {

      const card =
        document.createElement(
          "div"
        );


      card.className =
        "card";


      const safeName =
        escapeHTML(
          wallpaper.name
        );


      const safeCategory =
        escapeHTML(
          wallpaper.category
        );


      card.innerHTML = `

        <img
          src="${escapeHTML(wallpaper.url)}"
          loading="lazy"
          alt="${safeName}"
        >

        <div class="info">

          <h3>
            ${safeCategory}
            • Mobile Wallpaper
          </h3>

          <div class="brand">
            WALLORA
          </div>

          <div class="owner">
            Deepak Paweria
          </div>

          <div class="actions">

            <button
              class="like"
              onclick="likeWallpaper(this)"
            >
              ❤️ <span>0</span>
            </button>

            <button
              class="comment"
              onclick="toggleComments(this)"
            >
              💬
            </button>

            <a
              class="download"
              href="${escapeHTML(wallpaper.url)}"
              download
              target="_blank"
              rel="noopener"
            >
              ⬇ Download
            </a>

          </div>


          <div class="comments">

            <input
              type="text"
              placeholder="Write a comment..."
            >

            <button
              onclick="addComment(this)"
            >
              Post
            </button>

            <div class="comment-list"></div>

          </div>

        </div>

      `;


      card
        .querySelector("img")
        .onclick =
        function(){

          openImage(
            wallpaper.url
          );

        };


      grid.appendChild(card);

    }
  );

}


/* =====================================
   IMAGE VIEWER
===================================== */

function openImage(url){

  document
    .getElementById(
      "fullImage"
    )
    .src = url;

  document
    .getElementById(
      "imageViewer"
    )
    .classList
    .add("show");

}


function closeImage(event){

  if(event){

    event.stopPropagation();

  }

  document
    .getElementById(
      "imageViewer"
    )
    .classList
    .remove("show");

  document
    .getElementById(
      "fullImage"
    )
    .src = "";

}


/* =====================================
   LIKE
===================================== */

function likeWallpaper(button){

  const number =
    button.querySelector(
      "span"
    );

  let value =
    parseInt(
      number.innerText
    );


  if(
    button.classList.contains(
      "liked"
    )
  ){

    value--;

    button.classList.remove(
      "liked"
    );

  }else{

    value++;

    button.classList.add(
      "liked"
    );

  }


  number.innerText =
    value;

}


/* =====================================
   COMMENTS
===================================== */

function toggleComments(button){

  const area =
    button
      .closest(".info")
      .querySelector(
        ".comments"
      );

  area
    .classList
    .toggle("show");

}


function addComment(button){

  const area =
    button.closest(
      ".comments"
    );

  const input =
    area.querySelector(
      "input"
    );

  const list =
    area.querySelector(
      ".comment-list"
    );

  const text =
    input.value.trim();


  if(!text)return;


  const div =
    document.createElement(
      "div"
    );

  div.innerText =
    "💬 " + text;

  list.appendChild(
    div
  );

  input.value = "";

}


/* =====================================
   ESC KEY
===================================== */

document.addEventListener(
  "keydown",
  function(event){

    if(
      event.key === "Escape"
    ){

      closeImage();
      closeUpload();

    }

  }
);


/* =====================================
   START
===================================== */

document.addEventListener(
  "DOMContentLoaded",
  function(){

    applyTheme(
      getWalloraTheme()
    );

    checkOwner();

    loadWallpapers();

  }
);


/* =====================================
   AUTH CHANGE
===================================== */

supabaseClient
  .auth
  .onAuthStateChange(
    function(){

      checkOwner();

    }
  );

</script>
