<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wallora • Mobile Wallpapers</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    min-height:100%;
    overflow-x:hidden;
}

:root{
    --bg:#f6f7fb;
    --card:#ffffff;
    --text:#17171c;
    --muted:#777b86;
    --border:rgba(0,0,0,.08);
    --accent:#111111;
    --soft:#f0f1f5;
}

body.dark{
    --bg:#090a0f;
    --card:#11131a;
    --text:#ffffff;
    --muted:#9b9fab;
    --border:rgba(255,255,255,.09);
    --accent:#ffffff;
    --soft:#1b1e27;
}

body{
    background:var(--bg);
    color:var(--text);
    font-family:Arial,Helvetica,sans-serif;
    transition:.25s;
}

/* HEADER */
header{
    position:sticky;
    top:0;
    z-index:100;
    height:70px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
    background:rgba(255,255,255,.82);
    backdrop-filter:blur(18px);
    border-bottom:1px solid var(--border);
}

body.dark header{
    background:rgba(9,10,15,.82);
}

.logo{
    font-size:25px;
    font-weight:900;
    letter-spacing:-1px;
}

.logo span{
    opacity:.45;
}

.back-btn,
.upload-btn{
    border:0;
    background:var(--soft);
    color:var(--text);
    padding:11px 15px;
    border-radius:14px;
    font-weight:700;
    cursor:pointer;
}

.upload-btn{
    display:none;
}

/* HERO */
.hero{
    text-align:center;
    padding:34px 16px 20px;
}

.hero h1{
    font-size:34px;
    font-weight:900;
    letter-spacing:-1.5px;
}

.hero p{
    color:var(--muted);
    margin-top:8px;
}

/* SEARCH */
.search-box{
    max-width:650px;
    margin:5px auto 25px;
    padding:0 16px;
}

.search-box input{
    width:100%;
    border:1px solid var(--border);
    outline:none;
    background:var(--card);
    color:var(--text);
    padding:15px 18px;
    border-radius:17px;
    font-size:15px;
}

/* CATEGORIES */
.categories{
    display:flex;
    gap:9px;
    overflow-x:auto;
    padding:0 16px 20px;
    scrollbar-width:none;
}

.categories::-webkit-scrollbar{
    display:none;
}

.category{
    flex:0 0 auto;
    border:1px solid var(--border);
    background:var(--card);
    color:var(--text);
    padding:10px 15px;
    border-radius:30px;
    cursor:pointer;
    font-weight:700;
}

.category.active{
    background:var(--text);
    color:var(--bg);
}

/* GALLERY */
.gallery{
    width:100%;
    max-width:1200px;
    margin:auto;
    padding:10px 15px 50px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
}

.card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:22px;
    overflow:hidden;
    box-shadow:0 8px 30px rgba(0,0,0,.06);
}

.image-wrap{
    position:relative;
    width:100%;
    height:360px;
    background:#ddd;
    cursor:pointer;
    overflow:hidden;
}

.image-wrap img{
    width:100%;
    height:100%;
    display:block;
    object-fit:cover;
    transition:transform .35s ease;
}

.tap-hint{
    position:absolute;
    left:50%;
    bottom:13px;
    transform:translateX(-50%);
    padding:7px 12px;
    border-radius:30px;
    background:rgba(0,0,0,.65);
    color:white;
    font-size:11px;
    font-weight:700;
    pointer-events:none;
}

/* FULL SIZE STATE */
.card.full-size{
    grid-column:1 / -1;
}

.card.full-size .image-wrap{
    height:min(78vh,850px);
    background:#000;
}

.card.full-size .image-wrap img{
    object-fit:contain;
    transform:none;
}

.card.full-size .tap-hint{
    display:none;
}

/* ACTION AREA */
.action-panel{
    display:none;
    padding:14px;
    background:var(--card);
}

.card.full-size .action-panel{
    display:block;
}

.actions{
    display:grid;
    grid-template-columns:1fr 1fr 1.25fr;
    gap:9px;
}

.actions button{
    min-height:44px;
    border:0;
    border-radius:13px;
    font-weight:800;
    cursor:pointer;
    background:var(--soft);
    color:var(--text);
}

.actions .download{
    background:var(--text);
    color:var(--bg);
}

.actions button:disabled{
    opacity:.6;
}

/* COMMENTS */
.comments{
    display:none;
    margin-top:12px;
}

.comments.show{
    display:block;
}

.comments-row{
    display:flex;
    gap:8px;
}

.comments input{
    flex:1;
    min-width:0;
    border:1px solid var(--border);
    background:var(--soft);
    color:var(--text);
    padding:12px;
    border-radius:12px;
    outline:none;
}

.comments-row button{
    padding:0 16px;
    border:0;
    border-radius:12px;
    background:var(--text);
    color:var(--bg);
    font-weight:800;
}

.comment-list{
    margin-top:10px;
}

.comment-item{
    padding:9px 11px;
    margin-top:7px;
    background:var(--soft);
    border-radius:11px;
    font-size:13px;
}

/* EMPTY / LOADING */
.message{
    grid-column:1/-1;
    text-align:center;
    padding:50px 20px;
    color:var(--muted);
}

.spinner{
    width:30px;
    height:30px;
    border:3px solid var(--border);
    border-top-color:var(--text);
    border-radius:50%;
    animation:spin .8s linear infinite;
    margin:0 auto 12px;
}

@keyframes spin{
    to{transform:rotate(360deg);}
}

/* UPLOAD MODAL */
.modal{
    position:fixed;
    inset:0;
    z-index:500;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:rgba(0,0,0,.65);
    backdrop-filter:blur(8px);
}

.modal.show{
    display:flex;
}

.modal-box{
    width:100%;
    max-width:480px;
    background:var(--card);
    color:var(--text);
    border-radius:24px;
    padding:22px;
}

.modal-box h2{
    margin-bottom:18px;
}

.modal-box input,
.modal-box select{
    width:100%;
    padding:13px;
    margin-bottom:12px;
    border-radius:12px;
    border:1px solid var(--border);
    background:var(--soft);
    color:var(--text);
    outline:none;
}

.modal-actions{
    display:flex;
    gap:10px;
}

.modal-actions button{
    flex:1;
    padding:13px;
    border:0;
    border-radius:13px;
    font-weight:800;
}

.cancel{
    background:var(--soft);
    color:var(--text);
}

.upload-confirm{
    background:var(--text);
    color:var(--bg);
}

/* MOBILE */
@media(max-width:800px){
    .gallery{
        grid-template-columns:repeat(2,1fr);
        gap:12px;
        padding-left:10px;
        padding-right:10px;
    }

    .image-wrap{
        height:330px;
    }

    .card.full-size{
        grid-column:1/-1;
    }

    .card.full-size .image-wrap{
        height:78vh;
    }
}

@media(max-width:500px){
    header{
        height:64px;
        padding:0 12px;
    }

    .logo{
        font-size:22px;
    }

    .back-btn,
    .upload-btn{
        padding:9px 11px;
        border-radius:12px;
        font-size:12px;
    }

    .hero{
        padding-top:27px;
    }

    .hero h1{
        font-size:29px;
    }

    .gallery{
        grid-template-columns:1fr;
    }

    .image-wrap{
        height:430px;
    }

    .card.full-size .image-wrap{
        height:78vh;
        min-height:480px;
    }

    .actions{
        grid-template-columns:1fr 1fr;
    }

    .actions .download{
        grid-column:1/-1;
    }
}
</style>
</head>

<body>

<header>
    <button class="back-btn" onclick="history.back()">← Back</button>

    <div class="logo">
        Wallora<span> • Mobile</span>
    </div>

    <button id="uploadBtn" class="upload-btn" onclick="openUpload()">
        ＋ Upload
    </button>
</header>

<section class="hero">
    <h1>Mobile Wallpapers</h1>
    <p>Premium wallpapers for your phone.</p>
</section>

<div class="search-box">
    <input
        id="searchInput"
        type="search"
        placeholder="Search wallpapers..."
        oninput="renderWallpapers()"
    >
</div>

<div class="categories">
    <button class="category active" data-category="all" onclick="selectCategory('all',this)">All</button>
    <button class="category" data-category="cartoon" onclick="selectCategory('cartoon',this)">🎨 Cartoon</button>
    <button class="category" data-category="anime" onclick="selectCategory('anime',this)">🌸 Anime</button>
    <button class="category" data-category="dark" onclick="selectCategory('dark',this)">🖤 Dark</button>
    <button class="category" data-category="nature" onclick="selectCategory('nature',this)">🌿 Nature</button>
    <button class="category" data-category="cars" onclick="selectCategory('cars',this)">🚗 Cars</button>
    <button class="category" data-category="bike" onclick="selectCategory('bike',this)">🏍️ Bike</button>
    <button class="category" data-category="abstract" onclick="selectCategory('abstract',this)">✨ Abstract</button>
    <button class="category" data-category="gaming" onclick="selectCategory('gaming',this)">🎮 Gaming</button>
    <button class="category" data-category="minimal" onclick="selectCategory('minimal',this)">◻️ Minimal</button>
    <button class="category" data-category="3d" onclick="selectCategory('3d',this)">🧊 3D</button>
</div>

<main id="gallery" class="gallery">
    <div class="message">
        <div class="spinner"></div>
        Loading wallpapers...
    </div>
</main>

<!-- UPLOAD MODAL -->
<div id="uploadModal" class="modal">
    <div class="modal-box">
        <h2>Upload Wallpaper</h2>

        <input id="wallpaperName" type="text" placeholder="Wallpaper name">

        <select id="wallpaperCategory">
            <option value="cartoon">Cartoon</option>
            <option value="anime">Anime</option>
            <option value="dark">Dark</option>
            <option value="nature">Nature</option>
            <option value="cars">Cars</option>
            <option value="bike">Bike</option>
            <option value="abstract">Abstract</option>
            <option value="gaming">Gaming</option>
            <option value="minimal">Minimal</option>
            <option value="3d">3D</option>
        </select>

        <input id="wallpaperFile" type="file" accept="image/*">

        <div class="modal-actions">
            <button class="cancel" onclick="closeUpload()">Cancel</button>
            <button class="upload-confirm" onclick="uploadWallpaper()">Upload</button>
        </div>
    </div>
</div>

<script>
/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://frsdscguevzqqkzbwxxy.supabase.co";

const SUPABASE_KEY =
"sb_publishable_fzXOjFFKz_QXtZagfGXpEA_xgf1cZfN";

const OWNER_UID =
"7c9261f0-a096-482f-acd7-14af34bade15";

const supabaseClient =
supabase.createClient(SUPABASE_URL,SUPABASE_KEY);


/* =========================
   CLOUDINARY
========================= */

const CLOUDINARY_CLOUD =
"igtv8px2";

const CLOUDINARY_PRESET =
"wallora_upload";


/* =========================
   STATE
========================= */

let wallpapers = [];
let currentCategory = "all";


/* =========================
   THEME SYNC
========================= */

function applyTheme(){
    const theme = localStorage.getItem("wallora-theme");

    if(theme === "dark"){
        document.body.classList.add("dark");
    }else{
        document.body.classList.remove("dark");
    }
}

applyTheme();

window.addEventListener("storage",applyTheme);
window.addEventListener("focus",applyTheme);

document.addEventListener("visibilitychange",()=>{
    if(!document.hidden) applyTheme();
});


/* =========================
   OWNER BUTTON
========================= */

async function checkOwner(){

    try{

        const {data,error} =
        await supabaseClient.auth.getUser();

        if(error) return;

        if(
            data &&
            data.user &&
            data.user.id === OWNER_UID
        ){
            document.getElementById("uploadBtn").style.display="block";
        }

    }catch(error){
        console.error(error);
    }
}

checkOwner();


/* =========================
   LOAD WALLPAPERS
========================= */

async function loadWallpapers(){

    const gallery =
    document.getElementById("gallery");

    gallery.innerHTML = `
        <div class="message">
            <div class="spinner"></div>
            Loading wallpapers...
        </div>
    `;

    const {data,error} =
    await supabaseClient
    .from("wallpapers")
    .select("*")
    .order("created_at",{ascending:false});

    if(error){

        console.error(error);

        gallery.innerHTML = `
            <div class="message">
                Unable to load wallpapers.
            </div>
        `;

        return;
    }

    wallpapers = data || [];

    renderWallpapers();
}


/* =========================
   RENDER
========================= */

function renderWallpapers(){

    const gallery =
    document.getElementById("gallery");

    const search =
    document
    .getElementById("searchInput")
    .value
    .toLowerCase()
    .trim();

    let filtered =
    wallpapers.filter(item=>{

        const categoryMatch =
        currentCategory === "all" ||
        item.category === currentCategory;

        const searchMatch =
        !search ||
        (item.name || "")
        .toLowerCase()
        .includes(search);

        return categoryMatch && searchMatch;
    });

    if(!filtered.length){

        gallery.innerHTML = `
            <div class="message">
                No wallpapers found.
            </div>
        `;

        return;
    }

    gallery.innerHTML =
    filtered.map((wallpaper,index)=>{

        const safeName =
        escapeHTML(wallpaper.name || "Wallora Wallpaper");

        const safeURL =
        escapeHTML(wallpaper.url);

        const fileName =
        (wallpaper.name || "Wallora-Wallpaper")
        .replace(/[^a-zA-Z0-9-_]/g,"-")
        + ".jpg";

        return `
        <article class="card" data-id="${wallpaper.id}">

            <div class="image-wrap">

                <img
                    src="${safeURL}"
                    loading="lazy"
                    alt="${safeName}"
                >

                <div class="tap-hint">
                    Tap to view full size
                </div>

            </div>

            <div class="action-panel">

                <div class="actions">

                    <button
                        class="like-btn"
                        onclick="likeWallpaper(this)"
                    >
                        ❤️ <span>0</span>
                    </button>

                    <button
                        onclick="toggleComments(this)"
                    >
                        💬 Comment
                    </button>

                    <button
                        class="download"
                        onclick="downloadWallpaper(
                            '${safeURL}',
                            '${escapeHTML(fileName)}',
                            this
                        )"
                    >
                        ⬇ Download
                    </button>

                </div>

                <div class="comments">

                    <div class="comments-row">

                        <input
                            type="text"
                            placeholder="Write a comment..."
                            maxlength="200"
                        >

                        <button onclick="addComment(this)">
                            Post
                        </button>

                    </div>

                    <div class="comment-list"></div>

                </div>

            </div>

        </article>
        `;

    }).join("");

    attachImageTap();
}


/* =========================
   IMAGE TAP = FULL SIZE
========================= */

function attachImageTap(){

    document
    .querySelectorAll(".image-wrap")
    .forEach(wrap=>{

        wrap.addEventListener("click",()=>{

            const card =
            wrap.closest(".card");

            const alreadyOpen =
            card.classList.contains("full-size");

            // close all other full-size cards
            document
            .querySelectorAll(".card.full-size")
            .forEach(other=>{
                other.classList.remove("full-size");
            });

            if(!alreadyOpen){

                card.classList.add("full-size");

                setTimeout(()=>{

                    card.scrollIntoView({
                        behavior:"smooth",
                        block:"center"
                    });

                },50);

            }

        });

    });

}


/* =========================
   CATEGORY
========================= */

function selectCategory(category,button){

    currentCategory = category;

    document
    .querySelectorAll(".category")
    .forEach(btn=>{
        btn.classList.remove("active");
    });

    button.classList.add("active");

    renderWallpapers();
}


/* =========================
   LIKE
========================= */

function likeWallpaper(button){

    const span =
    button.querySelector("span");

    let count =
    Number(span.innerText || 0);

    if(button.dataset.liked === "true"){

        count--;

        button.dataset.liked="false";

        button.innerHTML =
        `❤️ <span>${count}</span>`;

    }else{

        count++;

        button.dataset.liked="true";

        button.innerHTML =
        `❤️ <span>${count}</span>`;

    }

}


/* =========================
   COMMENTS
========================= */

function toggleComments(button){

    const panel =
    button.closest(".action-panel");

    const comments =
    panel.querySelector(".comments");

    comments.classList.toggle("show");

    if(comments.classList.contains("show")){

        setTimeout(()=>{

            comments
            .querySelector("input")
            .focus();

        },100);

    }

}


function addComment(button){

    const comments =
    button.closest(".comments");

    const input =
    comments.querySelector("input");

    const list =
    comments.querySelector(".comment-list");

    const text =
    input.value.trim();

    if(!text) return;

    const div =
    document.createElement("div");

    div.className="comment-item";

    div.textContent=text;

    list.appendChild(div);

    input.value="";

}


/* =========================
   DOWNLOAD
========================= */

async function downloadWallpaper(
    url,
    fileName,
    button
){

    const originalText =
    button.innerText;

    try{

        button.disabled=true;
        button.innerText="⏳ Preparing...";

        let downloadURL=url;

        /*
          Cloudinary attachment transformation.
        */

        if(
            url.includes("res.cloudinary.com") &&
            url.includes("/upload/")
        ){

            downloadURL =
            url.replace(
                "/upload/",
                "/upload/fl_attachment/"
            );

        }

        const response =
        await fetch(
            downloadURL,
            {
                method:"GET",
                mode:"cors"
            }
        );

        if(!response.ok){
            throw new Error("Download failed");
        }

        const blob =
        await response.blob();

        const blobURL =
        URL.createObjectURL(blob);

        const link =
        document.createElement("a");

        link.href=blobURL;
        link.download=
        fileName || "Wallora-Wallpaper.jpg";

        document.body.appendChild(link);

        link.click();

        link.remove();

        setTimeout(()=>{
            URL.revokeObjectURL(blobURL);
        },1500);

        button.innerText="✅ Downloaded";

        setTimeout(()=>{
            button.innerText=originalText;
            button.disabled=false;
        },1500);

    }catch(error){

        console.error(
            "Download error:",
            error
        );

        /*
          Fallback:
          Open Cloudinary attachment URL.
        */

        let fallback=url;

        if(
            url.includes("res.cloudinary.com") &&
            url.includes("/upload/")
        ){

            fallback =
            url.replace(
                "/upload/",
                "/upload/fl_attachment/"
            );

        }

        window.open(
            fallback,
            "_blank"
        );

        button.innerText="⬇ Download";
        button.disabled=false;

    }

}


/* =========================
   UPLOAD
========================= */

function openUpload(){
    document
    .getElementById("uploadModal")
    .classList.add("show");
}

function closeUpload(){

    document
    .getElementById("uploadModal")
    .classList.remove("show");

}


/* =========================
   CLOUDINARY UPLOAD
========================= */

async function uploadWallpaper(){

    try{

        const {data,error} =
        await supabaseClient.auth.getUser();

        if(
            error ||
            !data.user ||
            data.user.id !== OWNER_UID
        ){

            alert(
                "Only Wallora owner can upload."
            );

            return;
        }


        const file =
        document
        .getElementById("wallpaperFile")
        .files[0];

        const name =
        document
        .getElementById("wallpaperName")
        .value
        .trim();

        const category =
        document
        .getElementById("wallpaperCategory")
        .value;


        if(!file){

            alert("Please select a wallpaper.");

            return;
        }

        if(!name){

            alert("Please enter wallpaper name.");

            return;
        }


        if(file.size > 15 * 1024 * 1024){

            alert(
                "Maximum file size is 15MB."
            );

            return;
        }


        const formData =
        new FormData();

        formData.append(
            "file",
            file
        );

        formData.append(
            "upload_preset",
            CLOUDINARY_PRESET
        );

        formData.append(
            "folder",
            `wallora/mobile/${category}`
        );


        const uploadResponse =
        await fetch(
            `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD}/image/upload`,
            {
                method:"POST",
                body:formData
            }
        );


        if(!uploadResponse.ok){

            throw new Error(
                "Cloudinary upload failed"
            );

        }


        const uploaded =
        await uploadResponse.json();


        const {error:insertError} =
        await supabaseClient
        .from("wallpapers")
        .insert({

            name:name,

            category:category,

            url:uploaded.secure_url

        });


        if(insertError){

            console.error(insertError);

            alert(
                "Image uploaded but database save failed."
            );

            return;
        }


        alert(
            "✅ Wallpaper uploaded successfully!"
        );


        document
        .getElementById("wallpaperName")
        .value="";

        document
        .getElementById("wallpaperFile")
        .value="";


        closeUpload();

        await loadWallpapers();


    }catch(error){

        console.error(
            "Upload error:",
            error
        );

        alert(
            "Upload failed. Please try again."
        );

    }

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value){

    return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================
   START
========================= */

loadWallpapers();

</script>

</body>
</html>
