<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wallora • Mobile Wallpapers</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    min-height:100%;
    overflow-x:hidden;
}

:root{
    --bg:#f6f7fb;
    --card:#fff;
    --text:#17171c;
    --muted:#777b86;
    --border:rgba(0,0,0,.08);
    --soft:#f0f1f5;
}

body.dark{
    --bg:#090a0f;
    --card:#11131a;
    --text:#fff;
    --muted:#9b9fab;
    --border:rgba(255,255,255,.09);
    --soft:#1b1e27;
}

body{
    background:var(--bg);
    color:var(--text);
    font-family:Arial,Helvetica,sans-serif;
    transition:.25s;
}

/* HEADER */
header{
    position:sticky;
    top:0;
    z-index:100;
    height:70px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
    background:rgba(255,255,255,.84);
    backdrop-filter:blur(18px);
    border-bottom:1px solid var(--border);
}

body.dark header{
    background:rgba(9,10,15,.84);
}

.logo{
    font-size:25px;
    font-weight:900;
    letter-spacing:-1px;
}

.logo span{
    opacity:.45;
}

.back-btn,
.upload-btn{
    border:0;
    background:var(--soft);
    color:var(--text);
    padding:11px 15px;
    border-radius:14px;
    font-weight:700;
    cursor:pointer;
}

.upload-btn{
    display:none;
}

/* HERO */
.hero{
    text-align:center;
    padding:34px 16px 20px;
}

.hero h1{
    font-size:34px;
    font-weight:900;
    letter-spacing:-1.5px;
}

.hero p{
    color:var(--muted);
    margin-top:8px;
}

/* SEARCH */
.search-box{
    max-width:650px;
    margin:5px auto 25px;
    padding:0 16px;
}

.search-box input{
    width:100%;
    border:1px solid var(--border);
    outline:none;
    background:var(--card);
    color:var(--text);
    padding:15px 18px;
    border-radius:17px;
    font-size:15px;
}

/* CATEGORIES */
.categories{
    display:flex;
    gap:9px;
    overflow-x:auto;
    padding:0 16px 20px;
    scrollbar-width:none;
}

.categories::-webkit-scrollbar{
    display:none;
}

.category{
    flex:0 0 auto;
    border:1px solid var(--border);
    background:var(--card);
    color:var(--text);
    padding:10px 15px;
    border-radius:30px;
    cursor:pointer;
    font-weight:700;
}

.category.active{
    background:var(--text);
    color:var(--bg);
}

/* GALLERY */
.gallery{
    width:100%;
    max-width:1200px;
    margin:auto;
    padding:10px 15px 50px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
}

.card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:22px;
    overflow:hidden;
    box-shadow:0 8px 30px rgba(0,0,0,.06);
}

.image-wrap{
    position:relative;
    width:100%;
    height:360px;
    background:#ddd;
    cursor:pointer;
    overflow:hidden;
}

.image-wrap img{
    width:100%;
    height:100%;
    display:block;
    object-fit:cover;
    transition:transform .35s ease;
}

.image-wrap:active img{
    transform:scale(.97);
}

.tap-hint{
    position:absolute;
    left:50%;
    bottom:13px;
    transform:translateX(-50%);
    padding:7px 12px;
    border-radius:30px;
    background:rgba(0,0,0,.68);
    color:white;
    font-size:11px;
    font-weight:700;
    pointer-events:none;
}

/* CARD INFO */
.card-info{
    padding:13px 15px;
}

.card-name{
    font-weight:800;
    font-size:14px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.card-category{
    color:var(--muted);
    font-size:11px;
    margin-top:4px;
}

/* =========================
   FULL SCREEN VIEWER
========================= */

.viewer{
    position:fixed;
    inset:0;
    z-index:1000;
    display:none;
    flex-direction:column;
    background:rgba(0,0,0,.97);
}

.viewer.show{
    display:flex;
}

/* TOP BAR */
.viewer-top{
    height:64px;
    flex:0 0 64px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 15px;
    color:white;
    background:linear-gradient(
        rgba(0,0,0,.75),
        transparent
    );
}

.viewer-title{
    max-width:75%;
    font-size:15px;
    font-weight:800;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.close-viewer{
    width:43px;
    height:43px;
    border:0;
    border-radius:50%;
    background:rgba(255,255,255,.12);
    color:white;
    font-size:24px;
    cursor:pointer;
}

/* IMAGE AREA */
.viewer-image-area{
    flex:1;
    min-height:0;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:8px 12px;
}

.viewer-image-area img{
    max-width:100%;
    max-height:100%;
    width:auto;
    height:auto;
    object-fit:contain;
    display:block;
    border-radius:8px;
}

/* BOTTOM ACTIONS */
.viewer-bottom{
    flex:0 0 auto;
    padding:12px 12px calc(12px + env(safe-area-inset-bottom));
    background:linear-gradient(
        transparent,
        rgba(0,0,0,.96) 18%
    );
}

.viewer-actions{
    width:100%;
    max-width:700px;
    margin:auto;
    display:grid;
    grid-template-columns:1fr 1fr 1.25fr;
    gap:9px;
}

.viewer-actions button{
    min-height:48px;
    border:0;
    border-radius:14px;
    background:rgba(255,255,255,.12);
    color:white;
    font-size:14px;
    font-weight:800;
    cursor:pointer;
    border:1px solid rgba(255,255,255,.08);
}

.viewer-actions button:active{
    transform:scale(.97);
}

.viewer-actions .download-btn{
    background:white;
    color:#111;
}

/* COMMENT BOX */
.viewer-comments{
    display:none;
    width:100%;
    max-width:700px;
    margin:10px auto 0;
}

.viewer-comments.show{
    display:block;
}

.comment-row{
    display:flex;
    gap:8px;
}

.comment-row input{
    flex:1;
    min-width:0;
    padding:13px 14px;
    border:0;
    outline:none;
    border-radius:13px;
    background:rgba(255,255,255,.12);
    color:white;
    border:1px solid rgba(255,255,255,.1);
}

.comment-row input::placeholder{
    color:#aaa;
}

.comment-row button{
    padding:0 17px;
    border:0;
    border-radius:13px;
    background:white;
    color:#111;
    font-weight:800;
}

.comment-list{
    max-height:130px;
    overflow-y:auto;
    margin-top:8px;
}

.comment-item{
    background:rgba(255,255,255,.1);
    color:white;
    padding:9px 11px;
    margin-top:6px;
    border-radius:10px;
    font-size:13px;
}

/* EMPTY / LOADING */
.message{
    grid-column:1/-1;
    text-align:center;
    padding:50px 20px;
    color:var(--muted);
}

.spinner{
    width:30px;
    height:30px;
    border:3px solid var(--border);
    border-top-color:var(--text);
    border-radius:50%;
    animation:spin .8s linear infinite;
    margin:0 auto 12px;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

/* UPLOAD MODAL */
.modal{
    position:fixed;
    inset:0;
    z-index:1200;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:rgba(0,0,0,.65);
    backdrop-filter:blur(8px);
}

.modal.show{
    display:flex;
}

.modal-box{
    width:100%;
    max-width:480px;
    background:var(--card);
    color:var(--text);
    border-radius:24px;
    padding:22px;
}

.modal-box h2{
    margin-bottom:18px;
}

.modal-box input,
.modal-box select{
    width:100%;
    padding:13px;
    margin-bottom:12px;
    border-radius:12px;
    border:1px solid var(--border);
    background:var(--soft);
    color:var(--text);
    outline:none;
}

.modal-actions{
    display:flex;
    gap:10px;
}

.modal-actions button{
    flex:1;
    padding:13px;
    border:0;
    border-radius:13px;
    font-weight:800;
}

.cancel{
    background:var(--soft);
    color:var(--text);
}

.upload-confirm{
    background:var(--text);
    color:var(--bg);
}

/* MOBILE */
@media(max-width:800px){

    .gallery{
        grid-template-columns:repeat(2,1fr);
        gap:12px;
        padding-left:10px;
        padding-right:10px;
    }

    .image-wrap{
        height:330px;
    }
}

@media(max-width:500px){

    header{
        height:64px;
        padding:0 12px;
    }

    .logo{
        font-size:22px;
    }

    .back-btn,
    .upload-btn{
        padding:9px 11px;
        border-radius:12px;
        font-size:12px;
    }

    .hero{
        padding-top:27px;
    }

    .hero h1{
        font-size:29px;
    }

    .gallery{
        grid-template-columns:1fr;
    }

    .image-wrap{
        height:430px;
    }

    .viewer-image-area{
        padding:5px 8px;
    }

    .viewer-image-area img{
        max-width:100%;
        max-height:100%;
    }

    .viewer-actions{
        grid-template-columns:1fr 1fr;
    }

    .viewer-actions .download-btn{
        grid-column:1/-1;
    }

    .viewer-top{
        height:58px;
        flex-basis:58px;
    }

    .close-viewer{
        width:40px;
        height:40px;
    }
}
</style>
</head>

<body>

<header>

    <button class="back-btn" onclick="history.back()">
        ← Back
    </button>

    <div class="logo">
        Wallora<span> • Mobile</span>
    </div>

    <button
        id="uploadBtn"
        class="upload-btn"
        onclick="openUpload()"
    >
        ＋ Upload
    </button>

</header>


<section class="hero">

    <h1>Mobile Wallpapers</h1>

    <p>
        Premium wallpapers for your phone.
    </p>

</section>


<div class="search-box">

    <input
        id="searchInput"
        type="search"
        placeholder="Search wallpapers..."
        oninput="renderWallpapers()"
    >

</div>


<div class="categories">

    <button
        class="category active"
        onclick="selectCategory('all',this)"
    >
        All
    </button>

    <button
        class="category"
        onclick="selectCategory('cartoon',this)"
    >
        🎨 Cartoon
    </button>

    <button
        class="category"
        onclick="selectCategory('anime',this)"
    >
        🌸 Anime
    </button>

    <button
        class="category"
        onclick="selectCategory('dark',this)"
    >
        🖤 Dark
    </button>

    <button
        class="category"
        onclick="selectCategory('nature',this)"
    >
        🌿 Nature
    </button>

    <button
        class="category"
        onclick="selectCategory('cars',this)"
    >
        🚗 Cars
    </button>

    <button
        class="category"
        onclick="selectCategory('bike',this)"
    >
        🏍️ Bike
    </button>

    <button
        class="category"
        onclick="selectCategory('abstract',this)"
    >
        ✨ Abstract
    </button>

    <button
        class="category"
        onclick="selectCategory('gaming',this)"
    >
        🎮 Gaming
    </button>

    <button
        class="category"
        onclick="selectCategory('minimal',this)"
    >
        ◻️ Minimal
    </button>

    <button
        class="category"
        onclick="selectCategory('3d',this)"
    >
        🧊 3D
    </button>

</div>


<main id="gallery" class="gallery">

    <div class="message">

        <div class="spinner"></div>

        Loading wallpapers...

    </div>

</main>


<!-- =========================
     FULL SCREEN VIEWER
========================= -->

<div
    id="viewer"
    class="viewer"
>

    <div class="viewer-top">

        <div
            id="viewerTitle"
            class="viewer-title"
        >
            Wallpaper
        </div>

        <button
            class="close-viewer"
            onclick="closeViewer()"
        >
            ✕
        </button>

    </div>


    <div class="viewer-image-area">

        <img
            id="viewerImage"
            src=""
            alt="Wallpaper"
        >

    </div>


    <div class="viewer-bottom">

        <div class="viewer-actions">

            <button
                id="viewerLike"
                onclick="viewerLike()"
            >
                ❤️ <span id="likeCount">0</span>
            </button>

            <button
                onclick="toggleViewerComments()"
            >
                💬 Comment
            </button>

            <button
                class="download-btn"
                onclick="viewerDownload(this)"
            >
                ⬇ Download
            </button>

        </div>


        <div
            id="viewerComments"
            class="viewer-comments"
        >

            <div class="comment-row">

                <input
                    id="commentInput"
                    type="text"
                    maxlength="200"
                    placeholder="Write a comment..."
                >

                <button onclick="addViewerComment()">
                    Post
                </button>

            </div>

            <div
                id="commentList"
                class="comment-list"
            ></div>

        </div>

    </div>

</div>


<!-- =========================
     UPLOAD MODAL
========================= -->

<div
    id="uploadModal"
    class="modal"
>

    <div class="modal-box">

        <h2>
            Upload Wallpaper
        </h2>

        <input
            id="wallpaperName"
            type="text"
            placeholder="Wallpaper name"
        >

        <select id="wallpaperCategory">

            <option value="cartoon">
                Cartoon
            </option>

            <option value="anime">
                Anime
            </option>

            <option value="dark">
                Dark
            </option>

            <option value="nature">
                Nature
            </option>

            <option value="cars">
                Cars
            </option>

            <option value="bike">
                Bike
            </option>

            <option value="abstract">
                Abstract
            </option>

            <option value="gaming">
                Gaming
            </option>

            <option value="minimal">
                Minimal
            </option>

            <option value="3d">
                3D
            </option>

        </select>

        <input
            id="wallpaperFile"
            type="file"
            accept="image/*"
        >

        <div class="modal-actions">

            <button
                class="cancel"
                onclick="closeUpload()"
            >
                Cancel
            </button>

            <button
                class="upload-confirm"
                onclick="uploadWallpaper()"
            >
                Upload
            </button>

        </div>

    </div>

</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://frsdscguevzqqkzbwxxy.supabase.co";

const SUPABASE_KEY =
"sb_publishable_fzXOjFFKz_QXtZagfGXpEA_xgf1cZfN";

const OWNER_UID =
"7c9261f0-a096-482f-acd7-14af34bade15";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================
   CLOUDINARY
========================= */

const CLOUDINARY_CLOUD =
"igtv8px2";

const CLOUDINARY_PRESET =
"wallora_upload";


/* =========================
   STATE
========================= */

let wallpapers = [];

let currentCategory = "all";

let currentWallpaper = null;

let viewerLiked = false;

let viewerLikeNumber = 0;


/* =========================
   THEME
========================= */

function applyTheme(){

    const theme =
    localStorage.getItem(
        "wallora-theme"
    );

    if(theme === "dark"){

        document.body.classList.add("dark");

    }else{

        document.body.classList.remove("dark");

    }

}

applyTheme();

window.addEventListener(
    "storage",
    applyTheme
);

window.addEventListener(
    "focus",
    applyTheme
);

document.addEventListener(
    "visibilitychange",
    ()=>{
        if(!document.hidden){
            applyTheme();
        }
    }
);


/* =========================
   OWNER
========================= */

async function checkOwner(){

    try{

        const {data,error} =
        await supabaseClient
        .auth
        .getUser();

        if(error) return;

        if(
            data &&
            data.user &&
            data.user.id === OWNER_UID
        ){

            document
            .getElementById("uploadBtn")
            .style.display = "block";

        }

    }catch(error){

        console.error(error);

    }

}

checkOwner();


/* =========================
   LOAD
========================= */

async function loadWallpapers(){

    const gallery =
    document.getElementById(
        "gallery"
    );

    gallery.innerHTML = `
        <div class="message">
            <div class="spinner"></div>
            Loading wallpapers...
        </div>
    `;

    const {data,error} =
    await supabaseClient
    .from("wallpapers")
    .select("*")
    .order(
        "created_at",
        {ascending:false}
    );

    if(error){

        console.error(error);

        gallery.innerHTML = `
            <div class="message">
                Unable to load wallpapers.
            </div>
        `;

        return;
    }

    wallpapers = data || [];

    renderWallpapers();

}


/* =========================
   RENDER
========================= */

function renderWallpapers(){

    const gallery =
    document.getElementById(
        "gallery"
    );

    const search =
    document
    .getElementById(
        "searchInput"
    )
    .value
    .toLowerCase()
    .trim();


    const filtered =
    wallpapers.filter(item=>{

        const categoryMatch =
        currentCategory === "all" ||
        item.category === currentCategory;

        const searchMatch =
        !search ||
        (item.name || "")
        .toLowerCase()
        .includes(search);

        return (
            categoryMatch &&
            searchMatch
        );

    });


    if(!filtered.length){

        gallery.innerHTML = `
            <div class="message">
                No wallpapers found.
            </div>
        `;

        return;
    }


    gallery.innerHTML =
    filtered.map(
        wallpaper => {

            return `

            <article
                class="card"
                data-id="${wallpaper.id}"
            >

                <div class="image-wrap">

                    <img
                        src="${escapeHTML(wallpaper.url)}"
                        loading="lazy"
                        alt="${escapeHTML(
                            wallpaper.name ||
                            "Wallora Wallpaper"
                        )}"
                    >

                    <div class="tap-hint">
                        Tap to view full size
                    </div>

                </div>

                <div class="card-info">

                    <div class="card-name">
                        ${escapeHTML(
                            wallpaper.name ||
                            "Wallora Wallpaper"
                        )}
                    </div>

                    <div class="card-category">
                        ${escapeHTML(
                            wallpaper.category ||
                            "Mobile"
                        )}
                    </div>

                </div>

            </article>

            `;

        }
    ).join("");


    document
    .querySelectorAll(".card")
    .forEach(card=>{

        card
        .querySelector(".image-wrap")
        .addEventListener(
            "click",
            ()=>{
                const id =
                card.dataset.id;

                openViewer(id);
            }
        );

    });

}


/* =========================
   OPEN FULL SCREEN
========================= */

function openViewer(id){

    const wallpaper =
    wallpapers.find(
        item =>
        String(item.id) === String(id)
    );

    if(!wallpaper) return;

    currentWallpaper =
    wallpaper;

    viewerLiked = false;

    viewerLikeNumber = 0;

    document
    .getElementById("viewerTitle")
    .innerText =
    wallpaper.name ||
    "Wallora Wallpaper";

    document
    .getElementById("viewerImage")
    .src =
    wallpaper.url;

    document
    .getElementById("likeCount")
    .innerText =
    "0";

    document
    .getElementById("viewerLike")
    .innerHTML =
    `❤️ <span id="likeCount">0</span>`;

    document
    .getElementById("viewerComments")
    .classList.remove("show");

    document
    .getElementById("commentInput")
    .value = "";

    document
    .getElementById("commentList")
    .innerHTML = "";


    document
    .getElementById("viewer")
    .classList.add("show");


    document.body.style.overflow =
    "hidden";

}


/* =========================
   CLOSE VIEWER
========================= */

function closeViewer(){

    document
    .getElementById("viewer")
    .classList.remove("show");

    document.body.style.overflow =
    "";

    currentWallpaper = null;

}


/* =========================
   LIKE
========================= */

function viewerLike(){

    viewerLiked =
    !viewerLiked;

    if(viewerLiked){

        viewerLikeNumber++;

    }else{

        viewerLikeNumber--;

    }

    const button =
    document.getElementById(
        "viewerLike"
    );

    button.innerHTML =
    `❤️ <span id="likeCount">
        ${viewerLikeNumber}
    </span>`;

}


/* =========================
   COMMENTS
========================= */

function toggleViewerComments(){

    const box =
    document.getElementById(
        "viewerComments"
    );

    box.classList.toggle("show");

    if(box.classList.contains("show")){

        setTimeout(()=>{

            document
            .getElementById(
                "commentInput"
            )
            .focus();

        },100);

    }

}


function addViewerComment(){

    const input =
    document.getElementById(
        "commentInput"
    );

    const list =
    document.getElementById(
        "commentList"
    );

    const text =
    input.value.trim();

    if(!text) return;


    const comment =
    document.createElement(
        "div"
    );

    comment.className =
    "comment-item";

    comment.textContent =
    text;

    list.appendChild(
        comment
    );

    input.value = "";

}


/* =========================
   DOWNLOAD
========================= */

async function viewerDownload(button){

    if(!currentWallpaper)
        return;


    const original =
    button.innerText;

    try{

        button.disabled = true;

        button.innerText =
        "⏳ Preparing...";


        let downloadURL =
        currentWallpaper.url;


        if(
            downloadURL.includes(
                "res.cloudinary.com"
            ) &&
            downloadURL.includes(
                "/upload/"
            )
        ){

            downloadURL =
            downloadURL.replace(
                "/upload/",
                "/upload/fl_attachment/"
            );

        }


        const response =
        await fetch(
            downloadURL,
            {
                method:"GET",
                mode:"cors"
            }
        );


        if(!response.ok){

            throw new Error(
                "Download failed"
            );

        }


        const blob =
        await response.blob();


        const blobURL =
        URL.createObjectURL(
            blob
        );


        const link =
        document.createElement(
            "a"
        );


        link.href =
        blobURL;

        link.download =
        (
            currentWallpaper.name ||
            "Wallora-Wallpaper"
        )
        .replace(
            /[^a-zA-Z0-9-_]/g,
            "-"
        )
        + ".jpg";


        document.body.appendChild(
            link
        );

        link.click();

        link.remove();


        setTimeout(
            ()=>{
                URL.revokeObjectURL(
                    blobURL
                );
            },
            1500
        );


        button.innerText =
        "✅ Downloaded";


        setTimeout(
            ()=>{
                button.innerText =
                original;

                button.disabled =
                false;
            },
            1500
        );


    }catch(error){

        console.error(
            "Download error:",
            error
        );


        let fallback =
        currentWallpaper.url;


        if(
            fallback.includes(
                "res.cloudinary.com"
            ) &&
            fallback.includes(
                "/upload/"
            )
        ){

            fallback =
            fallback.replace(
                "/upload/",
                "/upload/fl_attachment/"
            );

        }


        window.open(
            fallback,
            "_blank"
        );


        button.innerText =
        "⬇ Download";

        button.disabled =
        false;

    }

}

   CATEGORY
========================= */

){

    category;


    document
    .querySelectorAll(
        ".category"
    )
    .forEach(btn=>{

        );

    );

/* =========================
   UPLOAD MODAL
========================= */

function openUpload(){

    document
    .getElementById(
        "uploadModal"
    )
    .classList.add("show");

}


function closeUpload(){

    document
    .getElementById(
        "uploadModal"
    )
    .classList.remove("show");

}


/* =========================
   UPLOAD
========================= */

async function uploadWallpaper(){

    try{

        const {data,error} =
        await supabaseClient
        .auth
        .getUser();


        if(
            error ||
            !data.user ||
            data.user.id !== OWNER_UID
        ){

            alert(
                "Only Wallora owner can upload."
            );

            return;

        }


        const file =
        document
        .getElementById(
            "wallpaperFile"
        )
        .files[0];


        const name =
        document
        .getElementById(
            "wallpaperName"
        )
        .value
        .trim();


        const category =
        document
        .getElementById(
            "wallpaperCategory"
        )
        .value;


        if(!file){

            alert(
                "Please select a wallpaper."
            );

            return;

        }


        if(!name){

            alert(
                "Please enter wallpaper name."
            );

            return;

        }


        if(
            file.size >
            15 * 1024 * 1024
        ){

            alert(
                "Maximum file size is 15MB."
            );

            return;

        }


        const formData =
        new FormData();


        formData.append(
            "file",
            file
        );


        formData.append(
            "upload_preset",
            CLOUDINARY_PRESET
        );


        formData.append(
            "folder",
            `wallora/mobile/${category}`
        );


        const uploadResponse =
        await fetch(
            `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD}/image/upload`,
            {
                method:"POST",
                body:formData
            }
        );


        if(!uploadResponse.ok){

            throw new Error(
                "Cloudinary upload failed"
            );

        }


        const uploaded =
        await uploadResponse.json();


        const {error:insertError} =
        await supabaseClient
        .from("wallpapers")
        .insert({

            name:name,

            category:category,

            url:uploaded.secure_url

        });


        if(insertError){

            console.error(
                insertError
            );

            alert(
                "Image uploaded but database save failed."
            );

            return;

        }


        alert(
            "✅ Wallpaper uploaded successfully!"
        );


        document
        .getElementById(
            "wallpaperName"
        )
        .value = "";


        document
        .getElementById(
            "wallpaperFile"
        )
        .value = "";


        closeUpload();

        await loadWallpapers();


    }catch(error){

        console.error(
            "Upload error:",
            error
        );

        alert(
            "Upload failed. Please try again."
        );

    }

}


/* =========================
   ESCAPE
========================= */

function escapeHTML(value){

    return String(value)
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =========================
   ESC KEY
========================= */

document.addEventListener(
    "keydown",
    event=>{

        if(
            event.key === "Escape"
        ){

            closeViewer();

        }

    }
);


/* =========================
   START
========================= */

loadWallpapers();
