<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Wallora • Mobile Wallpapers</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

:root{
  --bg:#060711;
  --card:#0e1120;
  --card2:#171a2c;
  --text:#ffffff;
  --muted:#9299b5;
  --border:#292e49;
  --purple:#8066ff;
  --blue:#00cfff;
  --gold:#ffc857;
  --danger:#ff4d67;
}

html,
body{
  width:100%;
  max-width:100%;
  overflow-x:hidden;
}

body{
  font-family:Inter,Arial,Helvetica,sans-serif;
  background:
    radial-gradient(circle at 10% 0%,#6c45ff30,transparent 32%),
    radial-gradient(circle at 95% 10%,#00cfff20,transparent 30%),
    var(--bg);
  color:var(--text);
  min-height:100vh;
  transition:.3s ease;
}


/* ================= LIGHT THEME ================= */

body.light{
  --bg:#f5f7fc;
  --card:#ffffff;
  --card2:#eef1f8;
  --text:#151827;
  --muted:#687089;
  --border:#dfe3ed;

  background:
    radial-gradient(circle at 10% 0%,#8066ff18,transparent 32%),
    radial-gradient(circle at 95% 10%,#00cfff15,transparent 30%),
    var(--bg);
}

body.light header{
  background:#ffffffdd;
}

body.light .search input,
body.light .comments input,
body.light .upload-panel input,
body.light .upload-panel select{
  color:var(--text);
}

body.light .cancel{
  background:#e4e7ef;
  color:#171b30;
}

body.light .social-btn{
  background:#e9ecf4;
  color:#171b30;
}


/* ================= HEADER ================= */

header{
  position:sticky;
  top:0;
  z-index:1000;

  height:72px;
  padding:0 5%;

  display:flex;
  align-items:center;
  justify-content:space-between;

  background:#070914d9;
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);

  border-bottom:1px solid var(--border);
}

.logo{
  font-size:28px;
  font-weight:900;
  letter-spacing:-1.4px;
}

.logo span{
  background:linear-gradient(
    90deg,
    var(--purple),
    var(--blue),
    var(--gold)
  );

  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.header-actions{
  display:flex;
  align-items:center;
  gap:8px;
}

.theme-btn,
.back,
.owner-btn{
  padding:10px 14px;

  border:1px solid var(--border);
  border-radius:13px;

  background:var(--card);
  color:var(--text);

  text-decoration:none;
  cursor:pointer;

  font-size:13px;

  transition:.25s;
}

.theme-btn:hover,
.back:hover{
  border-color:var(--purple);
  transform:translateY(-1px);
}

.theme-btn{
  width:44px;
  height:42px;
  padding:0;
  font-size:17px;
}

.owner-btn{
  background:linear-gradient(
    135deg,
    var(--purple),
    var(--blue)
  );

  border:0;
  color:white;
  font-weight:800;

  box-shadow:0 8px 25px #8066ff35;
}

.owner-btn:hover{
  transform:translateY(-2px);
}


/* ================= HERO ================= */

.hero{
  text-align:center;
  padding:65px 20px 38px;
}

.hero h1{
  font-size:50px;
  font-weight:950;
  letter-spacing:-2px;
  line-height:1.1;
}

.hero h1 span{
  background:linear-gradient(
    90deg,
    var(--purple),
    var(--blue)
  );

  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.hero p{
  margin-top:13px;
  color:var(--muted);
  font-size:14px;
}


/* ================= SEARCH ================= */

.search{
  max-width:650px;
  margin:27px auto 0;
}

.search input{
  width:100%;

  padding:17px 23px;

  border-radius:30px;
  border:1px solid var(--border);

  background:var(--card);
  color:var(--text);

  outline:none;
  font-size:15px;

  box-shadow:0 12px 35px #0003;

  transition:.25s;
}

.search input:focus{
  border-color:var(--purple);

  box-shadow:
    0 0 0 3px #8066ff18,
    0 15px 40px #0004;
}


/* ================= GALLERY ================= */

.gallery{
  padding:22px 5% 65px;
}

.gallery-head{
  display:flex;
  align-items:center;
  justify-content:space-between;

  margin-bottom:21px;
}

.gallery-head h2{
  font-size:24px;
  font-weight:850;
}

.gallery-head span{
  color:var(--muted);
  font-size:13px;
}


/* ================= GRID ================= */

.grid{
  display:grid;

  grid-template-columns:
    repeat(auto-fill,minmax(220px,1fr));

  gap:20px;
}


/* ================= CARD ================= */

.card{
  position:relative;

  background:
    linear-gradient(
      145deg,
      var(--card),
      var(--card2)
    );

  border:1px solid var(--border);
  border-radius:22px;

  overflow:hidden;

  box-shadow:
    0 14px 38px #0005,
    inset 0 1px #ffffff08;

  transition:.3s ease;
}

.card:hover{
  transform:translateY(-5px);

  border-color:#8066ff88;

  box-shadow:
    0 24px 55px #0008,
    0 0 25px #8066ff12;
}


/* ================= BIG IMAGE ================= */

.card img{
  width:100%;

  /*
    Image pehle se badi rahegi.
  */

  height:360px;

  object-fit:cover;

  display:block;

  cursor:pointer;

  transition:
    transform .45s ease,
    filter .3s ease;
}

.card:hover img{
  transform:scale(1.025);
}

.card.image-open img{
  filter:brightness(.82);
}


/* ================= IMAGE TAP HINT ================= */

.image-wrap{
  position:relative;
}

.tap-hint{
  position:absolute;

  left:50%;
  bottom:14px;

  transform:
    translateX(-50%);

  padding:7px 13px;

  border-radius:20px;

  background:#0009;
  backdrop-filter:blur(10px);

  color:white;

  font-size:10px;
  font-weight:700;

  opacity:.9;

  pointer-events:none;

  transition:.25s;
}

.card.image-open .tap-hint{
  opacity:0;
}


/* ================= CARD INFO ================= */

.info{
  padding:15px;
}

.info h3{
  font-size:14px;
  margin-bottom:7px;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.brand{
  font-size:10px;

  color:var(--gold);

  font-weight:900;
  letter-spacing:1.7px;
}

.owner{
  font-size:11px;
  color:var(--muted);

  margin-top:5px;
}


/* ================= ACTION AREA ================= */

.action-panel{
  max-height:0;
  opacity:0;
  overflow:hidden;

  transform:translateY(-5px);

  transition:
    max-height .35s ease,
    opacity .25s ease,
    transform .35s ease;
}

.card.image-open .action-panel{
  max-height:220px;

  opacity:1;

  transform:translateY(0);

  margin-top:13px;
}


/* ================= PREMIUM ACTIONS ================= */

.actions{
  display:flex;
  gap:8px;
}

.social-btn{
  min-width:52px;

  padding:10px 12px;

  border:1px solid var(--border);

  border-radius:12px;

  background:
    linear-gradient(
      145deg,
      #20253a,
      #15192a
    );

  color:white;

  cursor:pointer;

  font-size:13px;
  font-weight:800;

  transition:.25s;

  box-shadow:
    inset 0 1px #ffffff0a,
    0 5px 15px #0003;
}

.social-btn:hover{
  transform:translateY(-2px);

  border-color:var(--purple);

  box-shadow:
    0 8px 20px #8066ff20;
}

.social-btn.liked{
  background:
    linear-gradient(
      135deg,
      #ff4d67,
      #ff3156
    );

  border-color:#ff7185;

  color:white;
}


/* ================= DOWNLOAD ================= */

.download{
  flex:1;

  min-height:40px;

  padding:10px;

  border:0;

  border-radius:12px;

  background:
    linear-gradient(
      90deg,
      var(--purple),
      var(--blue)
    );

  color:white;

  display:flex;
  align-items:center;
  justify-content:center;

  text-align:center;

  font-size:12px;
  font-weight:900;

  cursor:pointer;

  box-shadow:
    0 7px 20px #8066ff30;

  transition:.25s;
}

.download:hover{
  transform:translateY(-2px);

  box-shadow:
    0 10px 25px #8066ff45;
}

.download:disabled{
  opacity:.65;
  cursor:wait;
}


/* ================= COMMENTS ================= */

.comments{
  margin-top:11px;

  padding:11px;

  border-radius:13px;

  background:
    linear-gradient(
      145deg,
      #ffffff05,
      #ffffff02
    );

  border:1px solid var(--border);
}

.comments-row{
  display:flex;
  gap:7px;
}

.comments input{
  flex:1;

  min-width:0;

  padding:10px 12px;

  border:1px solid var(--border);

  border-radius:10px;

  background:var(--bg);
  color:var(--text);

  outline:none;

  font-size:12px;
}

.comments input:focus{
  border-color:var(--purple);
}

.comments button{
  padding:9px 13px;

  border:0;

  border-radius:10px;

  background:var(--gold);

  color:#171717;

  cursor:pointer;

  font-size:11px;

  font-weight:900;
}

.comment-list{
  margin-top:9px;

  max-height:120px;

  overflow:auto;

  font-size:12px;

  color:var(--muted);
}

.comment-list:empty{
  display:none;
}

.comment-list div{
  padding:7px 0;

  border-bottom:1px solid var(--border);
}


/* ================= EMPTY ================= */

.empty{
  grid-column:1/-1;

  text-align:center;

  padding:70px 20px;

  color:var(--muted);
}

.empty h3{
  color:var(--text);

  margin-bottom:7px;
}


/* ================= IMAGE VIEWER ================= */

.image-viewer{
  position:fixed;
  inset:0;

  z-index:5000;

  display:none;

  align-items:center;
  justify-content:center;

  padding:20px;

  background:#000f;

  backdrop-filter:blur(10px);
}

.image-viewer.show{
  display:flex;
}

.image-viewer img{
  max-width:100%;
  max-height:92vh;

  object-fit:contain;

  border-radius:12px;

  box-shadow:0 25px 80px #000;
}

.close-viewer{
  position:absolute;

  top:18px;
  right:22px;

  width:45px;
  height:45px;

  border:0;
  border-radius:50%;

  background:#222b;
  color:white;

  font-size:28px;

  cursor:pointer;
}


/* ================= UPLOAD ================= */

.upload-box{
  position:fixed;
  inset:0;

  z-index:6000;

  display:none;

  align-items:center;
  justify-content:center;

  padding:20px;

  background:#000c;

  backdrop-filter:blur(12px);
}

.upload-box.show{
  display:flex;
}

.upload-panel{
  width:100%;
  max-width:450px;

  padding:27px;

  border-radius:23px;

  background:
    linear-gradient(
      145deg,
      var(--card),
      var(--card2)
    );

  border:1px solid var(--border);

  box-shadow:0 30px 90px #000;

  animation:uploadIn .25s ease;
}

@keyframes uploadIn{
  from{
    opacity:0;
    transform:translateY(15px) scale(.97);
  }

  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}

.upload-panel h2{
  margin-bottom:18px;

  font-size:21px;
}

.upload-panel input,
.upload-panel select{
  width:100%;

  padding:13px;

  margin-top:10px;

  border-radius:11px;

  border:1px solid var(--border);

  background:var(--bg);
  color:var(--text);

  outline:none;
}

.upload-panel input:focus,
.upload-panel select:focus{
  border-color:var(--purple);
}

.upload-actions{
  display:flex;

  gap:10px;

  margin-top:16px;
}

.upload-actions button{
  flex:1;

  padding:13px;

  border:0;

  border-radius:11px;

  cursor:pointer;

  font-weight:bold;
}

.upload{
  background:
    linear-gradient(
      90deg,
      var(--purple),
      var(--blue)
    );

  color:white;
}

.cancel{
  background:#292f4b;
  color:white;
}

#uploadStatus{
  margin-top:13px;

  color:var(--muted);

  font-size:13px;

  line-height:1.4;
}


/* ================= FOOTER ================= */

footer{
  padding:42px 20px;

  text-align:center;

  border-top:1px solid var(--border);

  color:var(--muted);
}

.footer-logo{
  font-size:23px;

  font-weight:900;

  margin-bottom:8px;
}

.footer-logo span{
  color:var(--purple);
}

footer strong{
  color:var(--gold);
}


/* ================= MOBILE ================= */

@media(max-width:700px){

  header{
    padding:0 4%;

    height:66px;
  }

  .logo{
    font-size:25px;
  }

  .hero{
    padding:47px 18px 31px;
  }

  .hero h1{
    font-size:38px;
  }

  .gallery{
    padding:15px 4% 45px;
  }

  .grid{
    grid-template-columns:repeat(2,1fr);

    gap:12px;
  }

  /*
    Mobile image size increased.
  */

  .card img{
    height:330px;
  }

  .card{
    border-radius:17px;
  }

  .info{
    padding:12px;
  }

  .info h3{
    font-size:12px;
  }

  .brand{
    font-size:9px;
  }

  .owner{
    font-size:10px;
  }

  .actions{
    gap:6px;
  }

  .social-btn{
    padding:9px 8px;

    min-width:43px;

    font-size:12px;
  }

  .download{
    font-size:11px;

    padding:9px 5px;
  }

  .back{
    display:none;
  }

  .owner-btn{
    padding:9px 11px;
  }

  .gallery-head h2{
    font-size:20px;
  }

  .tap-hint{
    font-size:9px;

    padding:6px 10px;
  }

}

@media(max-width:380px){

  .grid{
    grid-template-columns:1fr;
  }

  .card img{
    height:430px;
  }

}


/* ================= SMALL MOBILE ================= */

@media(max-width:330px){

  .owner-btn{
    font-size:11px;
    padding:8px;
  }

  .theme-btn{
    width:40px;
    height:40px;
  }

}

</style>
</head>


<body>


<!-- ================= IMAGE VIEWER ================= -->

<div
  class="image-viewer"
  id="imageViewer"
  onclick="closeImage(event)"
>

  <button
    class="close-viewer"

  >

  <img

<div

>

      <button
        class="cancel"
        onclick="closeUpload()"
      >
        Cancel
      </button>

      <button
        class="upload"
        id="uploadButton"
        onclick="uploadWallpaper()"
      >
        Upload
      </button>

    </div>

    <div id="uploadStatus"></div>

  </div>

</div>


<!-- ================= HEADER ================= -->

<header>

  <div class="logo">
    Wall<span>ora</span>
  </div>

  <div class="header-actions">

    <button
      class="theme-btn"
      id="themeButton"
      onclick="toggleTheme()"
      title="Change Theme"
    >
      🌙
    </button>

    <button
      class="owner-btn"
      id="ownerButton"
      onclick="openUpload()"
      style="display:none;"
    >
      ＋ Upload
    </button>

    <a
      href="index.html"
      class="back"
    >
      ← Home
    </a>

  </div>

</header>


<!-- ================= HERO ================= -->

<section class="hero">

  <h1>
    Mobile <span>Wallpapers</span>
  </h1>

  <p>
    Premium HD wallpapers made for your phone
  </p>

  <div class="search">

    <input
      id="search"
      type="text"
      placeholder="🔍 Search mobile wallpapers..."
      oninput="searchWallpaper()"
    >

  </div>

</section>


<!-- ================= GALLERY ================= -->

<section class="gallery">

  <div class="gallery-head">

    <h2>
      📱 Mobile Wallpapers
    </h2>

    <span id="count">
      Loading...
    </span>

  </div>

  <div
    class="grid"
    id="grid"
  >

      Loading wallpapers...
    </div>

  </div>

<!-- ================= FOOTER ================= -->

<footer>

  <div class="footer-logo">
    Wall<span>ora</span>
  </div>

  <p>
    Premium Mobile Wallpapers
  </p>

  <p style="margin-top:8px;">
    © 2026 Wallora • Created by
    <strong>Deepak Paweria</strong>
  </p>

</footer>


<script>

/* =====================================
   SUPABASE
===================================== */

const SUPABASE_URL =
"https://frsdscguevzqqkzbwxxy.supabase.co";

const SUPABASE_KEY =
"sb_publishable_fzXOjFFKz_QXtZagfGXpEA_xgf1cZfN";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =====================================
   CLOUDINARY
===================================== */

const CLOUDINARY_CLOUD_NAME =
"igtv8px2";

const CLOUDINARY_UPLOAD_PRESET =
"wallora_upload";


/* =====================================
   OWNER
===================================== */

const OWNER_UID =
"7c9261f0-a096-482f-acd7-14af34bade15";


/* =====================================
   THEME
===================================== */

const WALLORA_THEME_KEY =
"wallora-theme";


function getWalloraTheme(){

  const saved =
    localStorage.getItem(
      WALLORA_THEME_KEY
    );

  return saved === "light"
    ? "light"
    : "dark";

}


function applyTheme(theme){

  document.body.classList.toggle(
    "light",
    theme === "light"
  );

  const button =
    document.getElementById(
      "themeButton"
    );

  if(button){

    button.innerText =
      theme === "light"
        ? "☀️"
        : "🌙";

  }

}


function toggleTheme(){

  const current =
    getWalloraTheme();

  const newTheme =
    current === "light"
      ? "dark"
      : "light";

  localStorage.setItem(
    WALLORA_THEME_KEY,
    newTheme
  );

  applyTheme(newTheme);

}


/* =====================================
   THEME SYNC
===================================== */

window.addEventListener(
  "storage",
  function(event){

    if(
      event.key ===
      WALLORA_THEME_KEY
    ){

      applyTheme(
        event.newValue === "light"
          ? "light"
          : "dark"
      );

    }

  }
);


document.addEventListener(
  "visibilitychange",
  function(){

    if(!document.hidden){

      applyTheme(
        getWalloraTheme()
      );

    }

  }
);


window.addEventListener(
  "focus",
  function(){

    applyTheme(
      getWalloraTheme()
    );

  }
);


/* =====================================
   DATA
===================================== */

let wallpapers = [];


/* =====================================
   CHECK OWNER
===================================== */

async function checkOwner(){

  const {
    data
  } =
  await supabaseClient
    .auth
    .getUser();

  const button =
    document.getElementById(
      "ownerButton"
    );

  if(
    data &&
    data.user &&
    data.user.id === OWNER_UID
  ){

    button.style.display =
      "block";

  }else{

    button.style.display =
      "none";

  }

}


/* =====================================
   OPEN UPLOAD
===================================== */

async function openUpload(){

  const {
    data
  } =
  await supabaseClient
    .auth
    .getUser();

  if(
    !data.user ||
    data.user.id !== OWNER_UID
  ){

    alert(
      "Only Wallora owner can upload."
    );

    return;

  }

  document
    .getElementById("uploadBox")
    .classList
    .add("show");

}


/* =====================================
   CLOSE UPLOAD
===================================== */

function closeUpload(){

  document
    .getElementById("uploadBox")
    .classList
    .remove("show");

  document
    .getElementById("uploadStatus")
    .innerText = "";

}


/* =====================================
   UPLOAD TO CLOUDINARY
===================================== */

async function uploadWallpaper(){

  const file =
    document
      .getElementById(
        "wallpaperFile"
      )
      .files[0];

  const category =
    document
      .getElementById(
        "wallpaperCategory"
      )
      .value;

  const status =
    document
      .getElementById(
        "uploadStatus"
      );

  const uploadButton =
    document
      .getElementById(
        "uploadButton"
      );


  if(!file){

    status.innerText =
      "Please select a wallpaper.";

    return;

  }


  if(
    !file.type.startsWith("image/")
  ){

    status.innerText =
      "Only image files are allowed.";

    return;

  }


  if(
    file.size >
    15 * 1024 * 1024
  ){

    status.innerText =
      "Maximum file size is 15 MB.";

    return;

  }


  const {
    data
  } =
  await supabaseClient
    .auth
    .getUser();


  if(
    !data.user ||
    data.user.id !== OWNER_UID
  ){

    status.innerText =
      "Only Wallora owner can upload.";

    return;

  }


  uploadButton.disabled = true;
  uploadButton.innerText = "Uploading...";

  status.innerText =
    "Uploading wallpaper...";


  try{

    /* CLOUDINARY */

    const formData =
      new FormData();

    formData.append(
      "file",
      file
    );

    formData.append(
      "upload_preset",
      CLOUDINARY_UPLOAD_PRESET
    );

    formData.append(
      "folder",
      "wallora/mobile/" + category
    );


    const response =
      await fetch(
        "https://api.cloudinary.com/v1_1/" +
        CLOUDINARY_CLOUD_NAME +
        "/image/upload",
        {
          method:"POST",
          body:formData
        }
      );


    const result =
      await response.json();


    if(
      !response.ok ||
      !result.secure_url
    ){

      console.error(result);

      throw new Error(
        result.error?.message ||
        "Cloudinary upload failed."
      );

    }


    status.innerText =
      "Saving wallpaper...";


    /* SAVE URL */

    const {
      error
    } =
    await supabaseClient
      .from("wallpapers")
      .insert({

        name:file.name,

        category:category,

        url:result.secure_url

      });


    if(error){

      console.error(error);

      throw new Error(
        "Wallpaper uploaded but database save failed: " +
        error.message
      );

    }


    status.innerText =
      "✅ Wallpaper uploaded successfully!";


    document
      .getElementById(
        "wallpaperFile"
      )
      .value = "";


    setTimeout(
      function(){

        closeUpload();

        loadWallpapers();

      },
      1000
    );


  }catch(error){

    console.error(error);

    status.innerText =
      "❌ " + error.message;

  }


  uploadButton.disabled = false;

  uploadButton.innerText =
    "Upload";

}


/* =====================================
   LOAD WALLPAPERS
===================================== */

async function loadWallpapers(){

  const grid =
    document.getElementById(
      "grid"
    );

  const count =
    document.getElementById(
      "count"
    );


  grid.innerHTML = `

    <div class="empty">

      <h3>Loading wallpapers...</h3>

      <p style="margin-top:8px;">
        Please wait
      </p>

    </div>

  `;


  const {
    data,
    error
  } =
  await supabaseClient
    .from("wallpapers")
    .select("*")
    .order(
      "created_at",
      {
        ascending:false
      }
    );


  if(error){

    console.error(error);

    grid.innerHTML = `

      <div class="empty">

        <h3>Unable to load wallpapers</h3>

        <p style="margin-top:8px;">
          ${escapeHTML(error.message)}
        </p>

      </div>

    `;

    count.innerText =
      "Error";

    return;

  }


  wallpapers =
    (data || []).map(
      item => ({

        id:item.id,

        name:item.name,

        category:item.category,

        url:item.url

      })
    );


  render(
    wallpapers
  );

}


/* =====================================
   SEARCH
===================================== */

function searchWallpaper(){

  const text =
    document
      .getElementById("search")
      .value
      .toLowerCase()
      .trim();


  const filtered =
    wallpapers.filter(
      wallpaper =>

        (
          wallpaper.name +
          " " +
          wallpaper.category
        )
        .toLowerCase()
        .includes(text)

    );


  render(filtered);

}


/* =====================================
   ESCAPE HTML
===================================== */

function escapeHTML(text){

  return String(text || "")
    .replace(
      /[&<>"']/g,
      function(char){

        const map = {

          "&":"&amp;",
          "<":"&lt;",
          ">":"&gt;",
          '"':"&quot;",
          "'":"&#039;"

        };

        return map[char];

      }
    );

}


/* =====================================
   RENDER
===================================== */

function render(list){

  const grid =
    document.getElementById(
      "grid"
    );

  const count =
    document.getElementById(
      "count"
    );


  grid.innerHTML = "";

  count.innerText =
    list.length +
    " Wallpapers";


  if(list.length === 0){

    grid.innerHTML = `

      <div class="empty">

        <h3>
          No mobile wallpapers found
        </h3>

        <p style="margin-top:8px;">
          Upload a wallpaper to see it here.
        </p>

      </div>

    `;

    return;

  }


  list.forEach(
    (wallpaper,index) => {

      const card =
        document.createElement(
          "div"
        );

      card.className =
        "card";


      const safeName =
        escapeHTML(
          wallpaper.name
        );


      const safeCategory =
        escapeHTML(
          wallpaper.category
        );


      card.innerHTML = `

        <div class="image-wrap">

          <img
            src="${escapeHTML(wallpaper.url)}"
            loading="lazy"
            alt="${safeName}"
          >

          <div class="tap-hint">
            Tap image for actions
          </div>

        </div>


        <div class="info">

          <h3>
            ${safeCategory}
            • Mobile Wallpaper
          </h3>

          <div class="brand">
            WALLORA
          </div>

          <div class="owner">
            Deepak Paweria
          </div>


          <div class="action-panel">

            <div class="actions">

              <button
                class="social-btn"
                onclick="likeWallpaper(this)"
              >
                ❤️ <span>0</span>
              </button>

              <button
                class="social-btn"
                onclick="toggleComments(this)"
              >
                💬 Comment
              </button>

              <button
                class="download"
                onclick="downloadWallpaper(
                  '${escapeHTML(wallpaper.url)}',
                  '${escapeHTML(wallpaper.name)}',
                  this
                )"
              >
                ⬇ Download
              </button>

            </div>


            <div class="comments">

              <div class="comments-row">

                <input
                  type="text"
                  placeholder="Write a comment..."
                >

                <button
                  onclick="addComment(this)"
                >
                  Post
                </button>

              </div>

              <div class="comment-list"></div>

            </div>

          </div>

        </div>

      `;


      /* IMAGE TAP */

      card
        .querySelector(".image-wrap")
        .addEventListener(
          "click",
          function(event){

            /*
              Single tap image:
              actions show/hide.

              Close viewer is only triggered
              by the image itself when long/normal
              viewer behaviour is not needed.
            */

            card.classList.toggle(
              "image-open"
            );

          }
        );


      grid.appendChild(card);

    }
  );

}


/* =====================================
   DOWNLOAD
===================================== */

async function downloadWallpaper(
  url,
  fileName,
  button
){

  const originalText =
    button.innerText;


  try{

    button.disabled = true;

    button.innerText =
      "⏳ Downloading...";


    let downloadUrl =
      url;


    /*
      Cloudinary attachment flag.
      This tells Cloudinary to return
      the image as a downloadable file.
    */

    if(
      url.includes("res.cloudinary.com") &&
      url.includes("/upload/")
    ){

      downloadUrl =
        url.replace(
          "/upload/",
          "/upload/fl_attachment/"
        );

    }


    const response =
      await fetch(
        downloadUrl,
        {
          method:"GET",
          mode:"cors"
        }
      );


    if(!response.ok){

      throw new Error(
        "Download failed"
      );

    }


    const blob =
      await response.blob();


    const blobUrl =
      URL.createObjectURL(
        blob
      );


    const link =
      document.createElement(
        "a"
      );


    link.href =
      blobUrl;


    link.download =
      fileName ||
      "Wallora-Wallpaper.jpg";


    document.body.appendChild(
      link
    );


    link.click();


    link.remove();


    setTimeout(
      function(){

        URL.revokeObjectURL(
          blobUrl
        );

      },
      1500
    );


    button.innerText =
      "✅ Downloaded";


    setTimeout(
      function(){

        button.innerText =
          originalText;

        button.disabled =
          false;

      },
      1500
    );


  }catch(error){

    console.error(
      "Download Error:",
      error
    );


    /*
      Fallback.
    */

    window.open(
      url,
      "_blank"
    );


    button.innerText =
      "⬇ Download";

    button.disabled =
      false;

  }

}


/* =====================================
   LIKE
===================================== */

function likeWallpaper(button){

  const number =
    button.querySelector(
      "span"
    );


  let value =
    parseInt(
      number.innerText
    ) || 0;


  if(
    button.classList.contains(
      "liked"
    )
  ){

    value--;

    button.classList.remove(
      "liked"
    );

  }else{

    value++;

    button.classList.add(
      "liked"
    );

  }


  number.innerText =
    value;

}


/* =====================================
   COMMENT
===================================== */

function toggleComments(button){

  const area =
    button
      .closest(".action-panel")
      .querySelector(
        ".comments"
      );


  if(
    area.style.display === "block"
  ){

    area.style.display =
      "none";

  }else{

    area.style.display =
      "block";

    const input =
      area.querySelector(
        "input"
      );

    setTimeout(
      function(){

        input.focus();

      },
      100
    );

  }

}


/* =====================================
   ADD COMMENT
===================================== */

function addComment(button){

  const area =
    button.closest(
      ".comments"
    );


  const input =
    area.querySelector(
      "input"
    );


  const list =
    area.querySelector(
      ".comment-list"
    );


  const text =
    input.value.trim();


  if(!text){

    return;

  }


  const div =
    document.createElement(
      "div"
    );


  div.innerText =
    "💬 " + text;


  list.appendChild(
    div
  );


  input.value = "";

}


/* =====================================
   IMAGE VIEWER
===================================== */

function openImage(url){

  document
    .getElementById(
      "fullImage"
    )
    .src = url;


  document
    .getElementById(
      "imageViewer"
    )
    .classList
    .add("show");

}


function closeImage(event){

  if(event){

    event.stopPropagation();

  }


  document
    .getElementById(
      "imageViewer"
    )
    .classList
    .remove("show");


  document
    .getElementById(
      "fullImage"
    )
    .src = "";

}


/* =====================================
   ESC KEY
===================================== */

document.addEventListener(
  "keydown",
  function(event){

    if(
      event.key === "Escape"
    ){

      closeImage();
      closeUpload();

    }

  }
);


/* =====================================
   START
===================================== */

document.addEventListener(
  "DOMContentLoaded",
  function(){

    applyTheme(
      getWalloraTheme()
    );

    checkOwner();

    loadWallpapers();

  }
);


/* =====================================
   AUTH CHANGE
===================================== */

supabaseClient
  .auth
  .onAuthStateChange(
    function(){

      checkOwner();

    }
  );

</script>
