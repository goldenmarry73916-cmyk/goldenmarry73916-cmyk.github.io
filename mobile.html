<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wallora • Mobile Wallpapers</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    min-height:100%;
    overflow-x:hidden;
}

:root{
    --bg:#f6f7fb;
    --card:#fff;
    --text:#17171c;
    --muted:#777b86;
    --border:rgba(0,0,0,.08);
    --soft:#f0f1f5;
}

body.dark{
    --bg:#090a0f;
    --card:#11131a;
    --text:#fff;
    --muted:#9b9fab;
    --border:rgba(255,255,255,.09);
    --soft:#1b1e27;
}

body{
    background:var(--bg);
    color:var(--text);
    font-family:Arial,Helvetica,sans-serif;
    transition:.25s;
}

header{
    position:sticky;
    top:0;
    z-index:100;
    height:70px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
    background:rgba(255,255,255,.84);
    backdrop-filter:blur(18px);
    border-bottom:1px solid var(--border);
}

body.dark header{
    background:rgba(9,10,15,.84);
}

.logo{
    font-size:25px;
    font-weight:900;
    letter-spacing:-1px;
}

.logo span{
    opacity:.45;
}

.back-btn,
.upload-btn{
    border:0;
    background:var(--soft);
    color:var(--text);
    padding:11px 15px;
    border-radius:14px;
    font-weight:700;
    cursor:pointer;
}

.upload-btn{
    display:none;
}

.hero{
    text-align:center;
    padding:34px 16px 20px;
}

.hero h1{
    font-size:34px;
    font-weight:900;
    letter-spacing:-1.5px;
}

.hero p{
    color:var(--muted);
    margin-top:8px;
}

.search-box{
    max-width:650px;
    margin:5px auto 25px;
    padding:0 16px;
}

.search-box input{
    width:100%;
    border:1px solid var(--border);
    outline:none;
    background:var(--card);
    color:var(--text);
    padding:15px 18px;
    border-radius:17px;
    font-size:15px;
}

.categories{
    display:flex;
    gap:9px;
    overflow-x:auto;
    padding:0 16px 20px;
    scrollbar-width:none;
}

.categories::-webkit-scrollbar{
    display:none;
}

.category{
    flex:0 0 auto;
    border:1px solid var(--border);
    background:var(--card);
    color:var(--text);
    padding:10px 15px;
    border-radius:30px;
    cursor:pointer;
    font-weight:700;
}

.category.active{
    background:var(--text);
    color:var(--bg);
}

.gallery{
    width:100%;
    max-width:1200px;
    margin:auto;
    padding:10px 15px 50px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
}

.card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:22px;
    overflow:hidden;
    box-shadow:0 8px 30px rgba(0,0,0,.06);
}

.image-wrap{
    position:relative;
    width:100%;
    height:360px;
    background:#ddd;
    cursor:pointer;
    overflow:hidden;
}

.image-wrap img{
    width:100%;
    height:100%;
    display:block;
    object-fit:cover;
    transition:transform .35s ease;
}

.image-wrap:active img{
    transform:scale(.97);
}

.tap-hint{
    position:absolute;
    left:50%;
    bottom:13px;
    transform:translateX(-50%);
    padding:7px 12px;
    border-radius:30px;
    background:rgba(0,0,0,.68);
    color:white;
    font-size:11px;
    font-weight:700;
    pointer-events:none;
}

.card-info{
    padding:13px 15px;
}

.card-name{
    font-weight:800;
    font-size:14px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.card-category{
    color:var(--muted);
    font-size:11px;
    margin-top:4px;
}

.viewer{
    position:fixed;
    inset:0;
    z-index:1000;
    display:none;
    flex-direction:column;
    background:rgba(0,0,0,.97);
}

.viewer.show{
    display:flex;
}

.viewer-top{
    height:64px;
    flex:0 0 64px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 15px;
    color:white;
    background:linear-gradient(
        rgba(0,0,0,.75),
        transparent
    );
}

.viewer-title{
    max-width:75%;
    font-size:15px;
    font-weight:800;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.close-viewer{
    width:43px;
    height:43px;
    border:0;
    border-radius:50%;
    background:rgba(255,255,255,.12);
    color:white;
    font-size:24px;
    cursor:pointer;
}

.viewer-image-area{
    flex:1;
    min-height:0;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:8px 12px;
}

.viewer-image-area img{
    max-width:100%;
    max-height:100%;
    width:auto;
    height:auto;
    object-fit:contain;
    display:block;
    border-radius:8px;
}

.viewer-bottom{
    flex:0 0 auto;
    padding:12px 12px calc(12px + env(safe-area-inset-bottom));
    background:linear-gradient(
        transparent,
        rgba(0,0,0,.96) 18%
    );
}

.viewer-actions{
    width:100%;
    max-width:700px;
    margin:auto;
    display:grid;
    grid-template-columns:1fr 1fr 1.25fr;
    gap:9px;
}

.viewer-actions button{
    min-height:48px;
    border:0;
    border-radius:14px;
    background:rgba(255,255,255,.12);
    color:white;
    font-size:14px;
    font-weight:800;
    cursor:pointer;
    border:1px solid rgba(255,255,255,.08);
}

.viewer-actions button:active{
    transform:scale(.97);
}

.viewer-actions .download-btn{
    background:white;
    color:#111;
}

.viewer-comments{
    display:none;
    width:100%;
    max-width:700px;
    margin:10px auto 0;
}

.viewer-comments.show{
    display:block;
}

.comment-row{
    display:flex;
    gap:8px;
}

.comment-row input{
    flex:1;
    min-width:0;
    padding:13px 14px;
    border:0;
    outline:none;
    border-radius:13px;
    background:rgba(255,255,255,.12);
    color:white;
    border:1px solid rgba(255,255,255,.1);
}

.comment-row input::placeholder{
    color:#aaa;
}

.comment-row button{
    padding:0 17px;
    border:0;
    border-radius:13px;
    background:white;
    color:#111;
    font-weight:800;
}

.comment-list{
    max-height:130px;
    overflow-y:auto;
    margin-top:8px;
}

.comment-item{
    background:rgba(255,255,255,.1);
    color:white;
    padding:9px 11px;
    margin-top:6px;
    border-radius:10px;
    font-size:13px;
}

.message{
    grid-column:1/-1;
    text-align:center;
    padding:50px 20px;
    color:var(--muted);
}

.spinner{
    width:30px;
    height:30px;
    border:3px solid var(--border);
    border-top-color:var(--text);
    border-radius:50%;
    animation:spin .8s linear infinite;
    margin:0 auto 12px;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

.modal{
    position:fixed;
    inset:0;
    z-index:1200;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:rgba(0,0,0,.65);
    backdrop-filter:blur(8px);
}

.modal.show{
    display:flex;
}

.modal-box{
    width:100%;
    max-width:480px;
    background:var(--card);
    color:var(--text);
    border-radius:24px;
    padding:22px;
}

.modal-box h2{
    margin-bottom:18px;
}

.modal-box input,
.modal-box select{
    width:100%;
    padding:13px;
    margin-bottom:12px;
    border-radius:12px;
    border:1px solid var(--border);
    background:var(--soft);
    color:var(--text);
    outline:none;
}

.modal-actions{
    display:flex;
    gap:10px;
}

.modal-actions button{
    flex:1;
    padding:13px;
    border:0;
    border-radius:13px;
    font-weight:800;
}

.cancel{
    background:var(--soft);
    color:var(--text);
}

.upload-confirm{
    background:var(--text);
    color:var(--bg);
}

@media(max-width:800px){

    .gallery{
        grid-template-columns:repeat(2,1fr);
        gap:12px;
        padding-left:10px;
        padding-right:10px;
    }

    .image-wrap{
        height:330px;
    }
}

@media(max-width:500px){

    header{
        height:64px;
        padding:0 12px;
    }

    .logo{
        font-size:22px;
    }

    .back-btn,
    .upload-btn{
        padding:9px 11px;
        border-radius:12px;
        font-size:12px;
    }

    .hero{
        padding-top:27px;
    }

    .hero h1{
        font-size:29px;
    }

    .gallery{
        grid-template-columns:1fr;
    }

    .image-wrap{
        height:430px;
    }

    .viewer-image-area{
        padding:5px 8px;
    }

    .viewer-image-area img{
        max-width:100%;
        max-height:100%;
    }

    .viewer-actions{
        grid-template-columns:1fr 1fr;
    }

    .viewer-actions .download-btn{
        grid-column:1/-1;
    }

    .viewer-top{
        height:58px;
        flex-basis:58px;
    }

    .close-viewer{
        width:40px;
        height:40px;
    }
}
</style>
</head>

<body>

<header>

    <button class="back-btn" onclick="history.back()">
        ← Back
    </button>

    <div class="logo">
        Wallora<span> • Mobile</span>
    </div>

    <button
        id="uploadBtn"
        class="upload-btn"
        onclick="openUpload()"
    >
        ＋ Upload
    </button>

</header>

<section class="hero">

    <h1>Mobile Wallpapers</h1>

    <p>
        Premium wallpapers for your phone.
    </p>

</section>

<div class="search-box">

    <input
        id="searchInput"
        type="search"
        placeholder="Search wallpapers..."
        oninput="renderWallpapers()"
    >

</div>

<!-- MOBILE CATEGORY BUTTONS REMOVED
     ONLY ALL BUTTON KEPT -->

<div class="categories">

    <button class="category active"
        onclick="selectCategory('all',this)">
        All
    </button>

</div>

<main id="gallery" class="gallery">

    <div class="message">
        <div class="spinner"></div>
        Loading wallpapers...
    </div>

</main>


<!-- FULL SCREEN VIEWER -->

<div id="viewer" class="viewer">

    <div class="viewer-top">

        <div id="viewerTitle" class="viewer-title">
            Wallpaper
        </div>

        <button
            class="close-viewer"
            onclick="closeViewer()"
        >
            ✕
        </button>

    </div>

    <div class="viewer-image-area">

        <img
            id="viewerImage"
            src=""
            alt="Wallpaper"
        >

    </div>

    <div class="viewer-bottom">

        <div class="viewer-actions">

            <button
                id="viewerLike"
                onclick="viewerLike()"
            >
                ❤️ <span id="likeCount">0</span>
            </button>

            <button onclick="toggleViewerComments()">
                💬 Comment
            </button>

            <button
                class="download-btn"
                onclick="viewerDownload(this)"
            >
                ⬇ Download
            </button>

        </div>

        <div
            id="viewerComments"
            class="viewer-comments"
        >

            <div class="comment-row">

                <input
                    id="commentInput"
                    type="text"
                    maxlength="200"
                    placeholder="Write a comment..."
                >

                <button onclick="addViewerComment()">
                    Post
                </button>

            </div>

            <div
                id="commentList"
                class="comment-list"
            ></div>

        </div>

    </div>

</div>


<!-- UPLOAD MODAL -->

<div id="uploadModal" class="modal">

    <div class="modal-box">

        <h2>
            Upload Wallpaper
        </h2>

        <input
            id="wallpaperName"
            type="text"
            placeholder="Wallpaper name"
        >

        <select id="wallpaperCategory">

            <option value="cartoon">Cartoon</option>
            <option value="anime">Anime</option>
            <option value="dark">Dark</option>
            <option value="nature">Nature</option>
            <option value="cars">Cars</option>
            <option value="bike">Bike</option>
            <option value="abstract">Abstract</option>
            <option value="gaming">Gaming</option>
            <option value="minimal">Minimal</option>
            <option value="3d">3D</option>

        </select>

        <input
            id="wallpaperFile"
            type="file"
            accept="image/*"
        >

        <div class="modal-actions">

            <button
                class="cancel"
                onclick="closeUpload()"
            >
                Cancel
            </button>

            <button
                class="upload-confirm"
                onclick="uploadWallpaper()"
            >
                Upload
            </button>

        </div>

    </div>

</div>


<script>

/* =========================
   OLD SUPABASE
   OLD PHOTOS KE LIYE
========================= */

const OLD_SUPABASE_URL =
"https://frsdscguevzqqkzbwxxy.supabase.co";

const OLD_SUPABASE_KEY =
"sb_publishable_fzXOjFFKz_QXtZagfGXpEA_xgf1cZfN";

const oldSupabase =
supabase.createClient(
    OLD_SUPABASE_URL,
    OLD_SUPABASE_KEY
);


/* =========================
   CURRENT WALLORA SUPABASE
   LOGIN + NEW PHOTOS
========================= */

const WALLORA_SUPABASE_URL =
"https://lbvpjnfnhxnhzydjydfn.supabase.co";

const WALLORA_SUPABASE_KEY =
"sb_publishable_QFKLim7EOGmn-7kjHAONDA_0k-L_YxU";

const OWNER_UID =
"5244bbae-9306-4c50-857d-feba9a4d0807";

const walloraSupabase =
supabase.createClient(
    WALLORA_SUPABASE_URL,
    WALLORA_SUPABASE_KEY
);


/* =========================
   CLOUDINARY
========================= */

const CLOUDINARY_CLOUD =
"igtv8px2";

const CLOUDINARY_PRESET =
"wallora_upload";


/* =========================
   MOBILE CATEGORIES
========================= */

const MOBILE_CATEGORIES = [
    "cartoon",
    "anime",
    "dark",
    "nature",
    "cars",
    "bike",
    "abstract",
    "gaming",
    "minimal",
    "3d"
];


/* =========================
   STATE
========================= */

let wallpapers = [];

let currentCategory = "all";

let currentWallpaper = null;

let viewerLiked = false;

let viewerLikeNumber = 0;


/* =========================
   THEME
========================= */

function applyTheme(){

    const theme =
    localStorage.getItem(
        "wallora-theme"
    );

    if(theme === "dark"){

        document.body.classList.add("dark");

    }else{

        document.body.classList.remove("dark");

    }

}

applyTheme();

window.addEventListener(
    "storage",
    applyTheme
);

window.addEventListener(
    "focus",
    applyTheme
);


/* =========================
   OWNER CHECK
========================= */

async function checkOwner(){

    const uploadBtn =
    document.getElementById(
        "uploadBtn"
    );

    if(!uploadBtn) return;

    uploadBtn.style.display =
    "none";

    try{

        const {data,error} =
        await walloraSupabase
        .auth
        .getUser();

        console.log(
            "Logged user:",
            data?.user?.id
        );

        if(error){

            console.log(
                "Login check:",
                error.message
            );

            return;

        }

        if(
            data?.user &&
            data.user.id === OWNER_UID
        ){

            uploadBtn.style.display =
            "block";

            console.log(
                "Wallora owner detected ✔"
            );

        }

    }catch(error){

        console.error(
            "Owner check error:",
            error
        );

    }

}


/* =========================
   AUTH LISTENER
========================= */

walloraSupabase
.auth
.onAuthStateChange(
    (event,session)=>{

        console.log(
            "Auth event:",
            event
        );

        setTimeout(
            checkOwner,
            300
        );

    }
);


/* =========================
   LOAD OLD + NEW PHOTOS
========================= */

async function loadWallpapers(){

    const gallery =
    document.getElementById(
        "gallery"
    );

    gallery.innerHTML = `
        <div class="message">
            <div class="spinner"></div>
            Loading wallpapers...
        </div>
    `;

    try{

        /* OLD DATABASE */

        const oldResult =
        await oldSupabase
        .from("wallpapers")
        .select("*")
        .order(
            "created_at",
            {
                ascending:false
            }
        );

        if(oldResult.error){

            console.error(
                "Old database error:",
                oldResult.error
            );

        }

        let oldPhotos =
        oldResult.data || [];


        oldPhotos =
        oldPhotos.filter(
            item =>
            MOBILE_CATEGORIES.includes(
                String(
                    item.category || ""
                ).toLowerCase()
            )
        );


        /* CURRENT DATABASE */

        const newResult =
        await walloraSupabase
        .from("wallpapers")
        .select("*")
        .order(
            "created_at",
            {
                ascending:false
            }
        );

        if(newResult.error){

            console.error(
                "Current database error:",
                newResult.error
            );

        }

        let newPhotos =
        newResult.data || [];


        newPhotos =
        newPhotos.filter(
            item =>
            MOBILE_CATEGORIES.includes(
                String(
                    item.category || ""
                ).toLowerCase()
            )
        );


        /* SAFE IDS */

        oldPhotos =
        oldPhotos.map(
            item => ({

                ...item,

                _source:"old",

                _uid:
                "old-" +
                String(item.id)

            })
        );


        newPhotos =
        newPhotos.map(
            item => ({

                ...item,

                _source:"new",

                _uid:
                "new-" +
                String(item.id)

            })
        );


        /* MERGE */

        wallpapers = [
            ...oldPhotos,
            ...newPhotos
        ];


        /* SORT */

        wallpapers.sort(
            (a,b)=>{

                const dateA =
                new Date(
                    a.created_at || 0
                ).getTime();

                const dateB =
                new Date(
                    b.created_at || 0
                ).getTime();

                return dateB - dateA;

            }
        );


        renderWallpapers();


    }catch(error){

        console.error(
            "Load wallpapers error:",
            error
        );

        gallery.innerHTML = `
            <div class="message">
                Unable to load wallpapers.
            </div>
        `;

    }

}


/* =========================
   RENDER
========================= */

function renderWallpapers(){

    const gallery =
    document.getElementById(
        "gallery"
    );

    const search =
    document
    .getElementById(
        "searchInput"
    )
    .value
    .toLowerCase()
    .trim();


    const filtered =
    wallpapers.filter(
        item=>{

            const category =
            String(
                item.category || ""
            ).toLowerCase();


            const categoryMatch =
            currentCategory === "all" ||
            category === currentCategory;


            const searchMatch =
            !search ||
            (item.name || "")
            .toLowerCase()
            .includes(search);


            return(
                categoryMatch &&
                searchMatch
            );

        }
    );


    if(!filtered.length){

        gallery.innerHTML = `
            <div class="message">
                No wallpapers found.
            </div>
        `;

        return;

    }


    gallery.innerHTML =
    filtered.map(
        wallpaper => {

            return `

            <article
                class="card"
                data-id="${escapeHTML(
                    wallpaper._uid
                )}"
            >

                <div class="image-wrap">

                    <img
                        src="${escapeHTML(
                            wallpaper.url
                        )}"
                        loading="lazy"
                        alt="${escapeHTML(
                            wallpaper.name ||
                            "Wallora Wallpaper"
                        )}"
                        onerror="this.style.display='none'"
                    >

                    <div class="tap-hint">
                        Tap to view full size
                    </div>

                </div>

                <div class="card-info">

                    <div class="card-name">
                        ${escapeHTML(
                            wallpaper.name ||
                            "Wallora Wallpaper"
                        )}
                    </div>

                    <div class="card-category">
                        ${escapeHTML(
                            wallpaper.category ||
                            "Mobile"
                        )}
                    </div>

                </div>

            </article>

            `;

        }
    ).join("");


    document
    .querySelectorAll(".card")
    .forEach(card=>{

        card
        .querySelector(".image-wrap")
        .addEventListener(
            "click",
            ()=>{

                openViewer(
                    card.dataset.id
                );

            }
        );

    });

}


/* =========================
   VIEWER
========================= */

function openViewer(uid){

    const wallpaper =
    wallpapers.find(
        item =>
        String(item._uid) ===
        String(uid)
    );


    if(!wallpaper) return;


    currentWallpaper =
    wallpaper;


    viewerLiked = false;

    viewerLikeNumber = 0;


    document
    .getElementById(
        "viewerTitle"
    )
    .innerText =
    wallpaper.name ||
    "Wallora Wallpaper";


    document
    .getElementById(
        "viewerImage"
    )
    .src =
    wallpaper.url;


    document
    .getElementById(
        "likeCount"
    )
    .innerText =
    "0";


    document
    .getElementById(
        "viewerComments"
    )
    .classList.remove(
        "show"
    );


    document
    .getElementById(
        "commentInput"
    )
    .value = "";


    document
    .getElementById(
        "commentList"
    )
    .innerHTML = "";


    document
    .getElementById(
        "viewer"
    )
    .classList.add(
        "show"
    );


    document.body.style.overflow =
    "hidden";

}


function closeViewer(){

    document
    .getElementById(
        "viewer"
    )
    .classList.remove(
        "show"
    );


    document.body.style.overflow =
    "";


    currentWallpaper =
    null;

}


/* =========================
   LIKE
========================= */

function viewerLike(){

    viewerLiked =
    !viewerLiked;


    if(viewerLiked){

        viewerLikeNumber++;

    }else{

        viewerLikeNumber--;

    }


    document
    .getElementById(
        "likeCount"
    )
    .innerText =
    viewerLikeNumber;

}

/* =========================
   UPLOAD WALLPAPER
   FIXED VERSION
========================= */

async function uploadWallpaper(){

    try{

        /* LOGIN CHECK */

        const {
            data:userData,
            error:userError
        } =
        await walloraSupabase
        .auth
        .getUser();


        if(
            userError ||
            !userData?.user
        ){

            alert(
                "Please login to Wallora first."
            );

            return;

        }


        /* OWNER CHECK */

        if(
            userData.user.id !==
            OWNER_UID
        ){

            alert(
                "Only Wallora owner can upload."
            );

            return;

        }


        /* FORM */

        const file =
        document
        .getElementById(
            "wallpaperFile"
        )
        .files[0];


        const name =
        document
        .getElementById(
            "wallpaperName"
        )
        .value
        .trim();


        const category =
        document
        .getElementById(
            "wallpaperCategory"
        )
        .value;


        if(!file){

            alert(
                "Please select a wallpaper."
            );

            return;

        }


        if(!name){

            alert(
                "Please enter wallpaper name."
            );

            return;

        }


        if(
            file.size >
            15 * 1024 * 1024
        ){

            alert(
                "Maximum file size is 15MB."
            );

            return;

        }


        /* CLOUDINARY UPLOAD */

        const formData =
        new FormData();


        formData.append(
            "file",
            file
        );


        formData.append(
            "upload_preset",
            CLOUDINARY_PRESET
        );


        formData.append(
            "folder",
            `wallora/mobile/${category}`
        );


        const uploadResponse =
        await fetch(
            `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD}/image/upload`,
            {
                method:"POST",
                body:formData
            }
        );


        if(!uploadResponse.ok){

            let cloudError =
            "Cloudinary upload failed.";

            try{

                const cloudData =
                await uploadResponse.json();

                if(
                    cloudData?.error?.message
                ){

                    cloudError =
                    cloudData.error.message;

                }

            }catch(e){}


            throw new Error(
                cloudError
            );

        }


        const uploaded =
        await uploadResponse.json();


        if(
            !uploaded.secure_url
        ){

            throw new Error(
                "Cloudinary URL not received."
            );

        }


        /* =========================
           SAVE TO CURRENT WALLORA DB
           IMPORTANT:
           NO .select()
           NO .single()
        ========================= */

        const {
            error:dbError
        } =
        await walloraSupabase
        .from("wallpapers")
        .insert({

            name:name,

            category:category,

            url:uploaded.secure_url

        });


        if(dbError){

            console.error(
                "CURRENT DATABASE ERROR:",
                dbError
            );


            alert(
                "Database Error:\n\n" +
                dbError.message
            );


            return;

        }


        /* SUCCESS */

        alert(
            "✅ Wallpaper uploaded successfully!"
        );


        document
        .getElementById(
            "wallpaperName"
        )
        .value = "";


        document
        .getElementById(
            "wallpaperFile"
        )
        .value = "";


        closeUpload();


        /* LOAD OLD + NEW */

        await loadWallpapers();


    }catch(error){

        console.error(
            "UPLOAD ERROR:",
            error
        );


        alert(
            "Upload failed:\n\n" +
            error.message
        );

    }

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value){

    return String(value)
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}

document.addEventListener(

            closeUpload();

    }
);
