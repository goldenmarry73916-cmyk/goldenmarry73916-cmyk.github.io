<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wallora - Mobile Wallpapers</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

:root{
  --bg:#070812;
  --card:#101321;
  --card2:#171b30;
  --text:#ffffff;
  --muted:#9299b5;
  --border:#292f4b;
  --purple:#7c5cff;
  --blue:#00c8ff;
  --gold:#ffc857;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:
    radial-gradient(
      circle at 10% 5%,
      #38218a55,
      transparent 30%
    ),
    radial-gradient(
      circle at 90% 15%,
      #006f9250,
      transparent 28%
    ),
    var(--bg);

  color:var(--text);
  min-height:100vh;
}


/* =========================
   HEADER
========================= */

header{

  position:sticky;
  top:0;

  z-index:1000;

  height:70px;

  padding:0 5%;

  display:flex;
  align-items:center;
  justify-content:space-between;

  background:#080a14dd;

  backdrop-filter:blur(18px);

  border-bottom:
  1px solid var(--border);

}

.logo{

  font-size:27px;

  font-weight:900;

}

.logo span{

  background:
  linear-gradient(
    90deg,
    var(--purple),
    var(--blue),
    var(--gold)
  );

  -webkit-background-clip:text;

  color:transparent;

}


.back{

  padding:10px 15px;

  border-radius:12px;

  border:
  1px solid var(--border);

  background:var(--card);

  color:white;

  text-decoration:none;

  font-size:13px;

}


/* =========================
   HERO
========================= */

.hero{

  text-align:center;

  padding:
  55px 20px 30px;

}

.hero h1{

  font-size:46px;

  font-weight:900;

}

.hero h1 span{

  background:
  linear-gradient(
    90deg,
    var(--purple),
    var(--blue)
  );

  -webkit-background-clip:text;

  color:transparent;

}

.hero p{

  margin-top:10px;

  color:var(--muted);

  font-size:14px;

}


/* =========================
   CATEGORY SECTION
========================= */

.category-section{

  padding:
  20px 6% 35px;

}


.category-title{

  display:flex;

  align-items:center;

  justify-content:space-between;

  margin-bottom:15px;

}


.category-title h2{

  font-size:23px;

}


.category-title span{

  color:var(--muted);

  font-size:12px;

}


/* =========================
   GRID
========================= */

.grid{

  display:grid;

  grid-template-columns:
  repeat(
    auto-fill,
    minmax(180px,1fr)
  );

  gap:18px;

}


/* =========================
   CARD
========================= */

.card{

  background:
  linear-gradient(
    145deg,
    var(--card),
    var(--card2)
  );

  border:
  1px solid var(--border);

  border-radius:18px;

  overflow:hidden;

  box-shadow:
  0 10px 30px #0006;

  transition:.3s;

}


.card:hover{

  transform:
  translateY(-5px);

  border-color:
  var(--purple);

  box-shadow:
  0 20px 45px #0009;

}


.card img{

  width:100%;

  height:280px;

  object-fit:cover;

  display:block;

  cursor:pointer;

  transition:.35s;

}


.card:hover img{

  transform:
  scale(1.03);

}


/* =========================
   INFO
========================= */

.info{

  padding:12px;

}


.info h3{

  font-size:14px;

  margin-bottom:5px;

}


.brand{

  font-size:10px;

  font-weight:bold;

  color:var(--gold);

  letter-spacing:1.5px;

}


.owner{

  font-size:10px;

  color:var(--muted);

  margin:
  4px 0 11px;

}


/* =========================
   ACTIONS
========================= */

.actions{

  display:flex;

  gap:7px;

}


.like,
.comment{

  border:0;

  border-radius:9px;

  padding:9px 11px;

  background:#252a40;

  color:white;

  cursor:pointer;

}


.like.liked{

  background:#e53935;

}


.download{

  flex:1;

  padding:9px;

  border-radius:9px;

  background:
  linear-gradient(
    90deg,
    var(--purple),
    var(--blue)
  );

  color:white;

  text-decoration:none;

  text-align:center;

  font-size:12px;

  font-weight:bold;

}


/* =========================
   COMMENTS
========================= */

.comments{

  display:none;

  margin-top:10px;

}


.comments.show{

  display:block;

}


.comments input{

  width:100%;

  padding:9px;

  border:
  1px solid var(--border);

  border-radius:8px;

  background:var(--bg);

  color:white;

  outline:none;

}


.comments button{

  margin-top:6px;

  padding:8px 12px;

  border:0;

  border-radius:7px;

  background:var(--gold);

  cursor:pointer;

}


.comment-list{

  margin-top:8px;

  font-size:12px;

  color:var(--muted);

}


/* =========================
   EMPTY
========================= */

.empty{

  padding:30px;

  color:var(--muted);

  text-align:center;

  grid-column:1/-1;

}


/* =========================
   IMAGE VIEWER
========================= */

.image-viewer{

  position:fixed;

  inset:0;

  z-index:5000;

  display:none;

  align-items:center;

  justify-content:center;

  padding:20px;

  background:#000f;

}


.image-viewer.show{

  display:flex;

}


.image-viewer img{

  max-width:100%;

  max-height:92vh;

  object-fit:contain;

  border-radius:10px;

}


.close-viewer{

  position:absolute;

  top:18px;

  right:22px;

  width:45px;

  height:45px;

  border:0;

  border-radius:50%;

  background:#222;

  color:white;

  font-size:28px;

  cursor:pointer;

}


/* =========================
   FOOTER
========================= */

footer{

  margin-top:30px;

  padding:40px 20px;

  text-align:center;

  border-top:
  1px solid var(--border);

  color:var(--muted);

}


.footer-logo{

  font-size:22px;

  font-weight:900;

  margin-bottom:7px;

}


.footer-logo span{

  color:var(--purple);

}


footer strong{

  color:var(--gold);

}


/* =========================
   MOBILE
========================= */

@media(max-width:700px){

  .hero h1{

    font-size:38px;

  }


  .category-section{

    padding:
    15px 4% 30px;

  }


  .grid{

    grid-template-columns:
    repeat(2,1fr);

    gap:12px;

  }


  .card img{

    height:230px;

  }


  .category-title h2{

    font-size:20px;

  }

}


@media(max-width:380px){

  .grid{

    grid-template-columns:1fr;

  }


  .card img{

    height:350px;

  }

}

</style>

</head>


<body>


<!-- =========================
     FULL SCREEN VIEWER
========================= -->

<div
  class="image-viewer"
  id="imageViewer"
  onclick="closeImage()"
>

  <button
    class="close-viewer"
    onclick="closeImage(event)"
  >
    ×
  </button>

  <img
    id="fullImage"
    src=""
    alt="Wallpaper"
  >

</div>


<!-- =========================
     HEADER
========================= -->

<header>

  <div class="logo">
    Wall<span>ora</span>
  </div>

  <a
    href="index.html"
    class="back"
  >
    ← Home
  </a>

</header>


<!-- =========================
     HERO
========================= -->

<section class="hero">

  <h1>
    Mobile <span>Wallpapers</span>
  </h1>

  <p>
    Explore premium wallpapers for your phone
  </p>

</section>


<!-- =========================
     ALL MOBILE CATEGORIES
========================= -->

<div id="mobileContainer"></div>


<!-- =========================
     FOOTER
========================= -->

<footer>

  <div class="footer-logo">
    Wall<span>ora</span>
  </div>

  <p>
    Premium Mobile Wallpapers
  </p>

  <p style="margin-top:8px;">
    © 2026 Wallora • Created by
    <strong>Deepak Paweria</strong>
  </p>

</footer>


<script>


/* =========================
   GITHUB
========================= */

const GITHUB_USER =
"goldenmarry73916-cmyk";

const GITHUB_REPO =
"goldenmarry73916-cmyk.github.io";

const BRANCH =
"main";


/* =========================
   CATEGORIES
========================= */

const categories = [

  ["cartoon","🎨 Cartoon"],

  ["anime","👾 Anime"],

  ["dark","🖤 Dark"],

  ["nature","🌿 Nature"],

  ["cars","🚗 Cars"],

  ["bike","🏍️ Bike"],

  ["abstract","🌌 Abstract"],

  ["gaming","🎮 Gaming"],

  ["minimal","🤍 Minimal"],

  ["3d","🔷 3D"]

];


/* =========================
   GET GITHUB FILES
========================= */

async function getFiles(path){

  const url =
  `https://api.github.com/repos/`+
  `${GITHUB_USER}/`+
  `${GITHUB_REPO}/contents/`+
  `${path}?ref=${BRANCH}`;


  try{

    const response =
    await fetch(url);


    if(!response.ok){

      console.log(
        "Folder not found:",
        path
      );

      return [];

    }


    const data =
    await response.json();


    return Array.isArray(data)
      ? data
      : [];


  }catch(error){

    console.log(error);

    return [];

  }

}


/* =========================
   CHECK IMAGE
========================= */

function isImage(file){

  return file &&
  file.type === "file" &&
  /\.(jpg|jpeg|png|webp|gif|avif)$/i
  .test(file.name);

}


/* =========================
   LOAD CATEGORY
========================= */

async function loadCategory(
  folder,
  title,
  icon
){

  const files =
  await getFiles(
    "mobile/" + folder
  );


  const images =
  files.filter(
    file => isImage(file)
  );


  const section =
  document.createElement("section");


  section.className =
  "category-section";


  section.innerHTML = `

    <div class="category-title">

      <h2>
        ${icon} ${title}
      </h2>

      <span>
        ${images.length} Wallpapers
      </span>

    </div>

    <div class="grid"></div>

  `;


  const grid =
  section.querySelector(".grid");


  if(images.length === 0){

    grid.innerHTML = `

      <div class="empty">

        No wallpapers available yet.

      </div>

    `;

  }else{


    images.forEach(
      (file,index)=>{

        const url =
        `https://raw.githubusercontent.com/`+
        `${GITHUB_USER}/`+
        `${GITHUB_REPO}/`+
        `${BRANCH}/`+
        `${file.path}`;


        const card =
        document.createElement("div");


        card.className =
        "card";


        card.innerHTML = `

          <img
            src="${url}"
            loading="lazy"
            alt="${title} wallpaper"
          >

          <div class="info">

            <h3>
              ${title} ${index + 1}
            </h3>

            <div class="brand">
              WALLORA
            </div>

            <div class="owner">
              Deepak Paweria
            </div>

            <div class="actions">

              <button
                class="like"
                onclick="likeWallpaper(this)"
              >
                ❤️ <span>0</span>
              </button>


              <button
                class="comment"
                onclick="toggleComments(this)"
              >
                💬
              </button>


              <a
                class="download"
                href="${url}"
                download
              >
                Download
              </a>

            </div>


            <div class="comments">

              <input
                type="text"
                placeholder="Write a comment..."
              >

              <button
                onclick="addComment(this)"
              >
                Post
              </button>

              <div class="comment-list"></div>

            </div>

          </div>

        `;


        const image =
        card.querySelector("img");


        image.addEventListener(
          "click",
          function(){

            openImage(url);

          }
        );


        grid.appendChild(card);

      }
    );

  }


  document
  .getElementById(
    "mobileContainer"
  )
  .appendChild(section);

}


/* =========================
   LOAD ALL CATEGORIES
========================= */

async function loadAllCategories(){

  for(
    const category
    of categories
  ){

    await loadCategory(
      category[0],
      category[1].substring(2),
      category[1].substring(0,2)
    );

  }

}


/* =========================
   FULL SCREEN
========================= */

function openImage(url){

  const viewer =
  document.getElementById(
    "imageViewer"
  );

  const image =
  document.getElementById(
    "fullImage"
  );


  image.src = url;


  viewer.classList
  .add("show");

}


function closeImage(event){

  if(event){

    event.stopPropagation();

  }


  const viewer =
  document.getElementById(
    "imageViewer"
  );


  const image =
  document.getElementById(
    "fullImage"
  );


  viewer.classList
  .remove("show");


  image.src = "";

}


document.addEventListener(
  "keydown",
  function(event){

    if(event.key === "Escape"){

      closeImage();

    }

  }
);


/* =========================
   LIKE
========================= */

function likeWallpaper(button){

  const number =
  button.querySelector("span");


  let value =
  parseInt(
    number.innerText
  );


  if(
    button.classList
    .contains("liked")
  ){

    value--;

    button.classList
    .remove("liked");

  }else{

    value++;

    button.classList
    .add("liked");

  }


  number.innerText =
  value;

}


/* =========================
   COMMENTS
========================= */

function toggleComments(button){

  const area =
  button
  .closest(".info")
  .querySelector(".comments");


  area.classList
  .toggle("show");

}


function addComment(button){

  const area =
  button.closest(".comments");


  const input =
  area.querySelector("input");


  const list =
  area.querySelector(".comment-list");


  const text =
  input.value.trim();


  if(!text){

    return;

  }


  const div =
  document.createElement("div");


  div.innerText =
  "💬 " + text;


  list.appendChild(div);


  input.value = "";

}


/* =========================
   START
========================= */

loadAllCategories();

</script>

</body>
</html>
